<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="paper-deepread-html · library">
<meta name="library-version" content="{{LIBRARY_VERSION}}">
<title>Paper Deepread · 文献库</title>
<!--
================================================================================
  PAPER-DEEPREAD-HTML · LIBRARY / INDEX PAGE SHELL  (v2 — library-app layout)
================================================================================
  One self-contained index for MANY paper deep-read reports: compact app header,
  left sticky filter rail, dense card/table views, full-text search and an
  in-page iframe reader for the report HTML. All CSS and vanilla JS are inline.
  No external fonts, no CDN, no network requests; opens from file://, offline.

  --------------------------------------------------------------------------
  BUILD CONTRACT — the builder replaces each double-brace token exactly ONCE
  (each token appears exactly once below; do not add copies):
    LIBRARY_TITLE token -> plain text. Sits in a hidden div#libraryTitleSrc;
                          JS hydrates <h1>, <title>, and the QA summary.
    BUILD_DATE token    -> plain text build date ("2026-10-28"). Hidden
                          div#buildDateSrc; appears in the header stats/footer.
    LIBRARY_VERSION token -> plain text version ("1.2.0"). Lives in
                          <meta name="library-version">; JS also shows it as the
                          header chip, the footer badge and in <title>.
    LIBRARY_JSON token  -> raw JSON inside the script#library-data element
                          (type="application/json"). Schema (all best-effort):
                            { "papers": [ {
                                id, dir, html, raw, raw_name,
                                title, title_zh, journal, year, authors[], doi,
                                tags[], tldr, metrics[], figures, claims, sections,
                                categories[], updated, thumb, text[{id,h,t}],
                                readme, pdf            (both ignored by the UI)
                              } ],
                              "stats": {n, years[], journals, categories, updated} }
                          IMPORTANT: when serialising the JSON, escape any "<"
                          as \u003c so stray "</script>" text in a paper cannot
                          terminate the data element. (json.dumps then
                          .replace("<", "\\u003c") stays valid JSON.)

  LINKS: paper links are relative paths with spaces; they are assigned through
  DOM properties so the browser encodes them. Card clicks open the in-page
  iframe reader (report HTML); the "在新标签打开" links are the fallback when a
  browser refuses to frame a file:// document. RAW-*.pdf links: 查看原文 opens
  in a new tab. README is not linked.

  QA HOOK: on load + 250ms the script#library-qa element (application/json)
  receives {title, theme, papers, cards, hits, snippets, marks, groups,
  tableRows, query, view, count, viewerOpen, viewerSrc, railOpen, stars,
  openedCount, lastId, relatedOpen, overflowCount, overflow[],
  externalResources[], error, hash}. It is also callable through
  window.__library.writeQa().

  LIVE MODE (optional): when a local stdlib server injects
  window.__LIBRARY_LIVE__ (true, or {title, buildDate}) into <head>, this page
  fetches GET /api/library (cache: no-store), re-renders in place while keeping
  query/filters/sort/view, polls a cheap signature every 20 s, defers updates
  while the reader is open, and falls back to the embedded snapshot on errors.
  A plain file:// snapshot never fetches; it shows "静态快照" instead.

  PREFERENCES (client-side): localStorage "deepread-theme" (light/dark),
  "deepread-font" (read|mono), "deepread-density" (comfort|compact),
  "deepread-view" (cards|table|list) and "deepread-rail-groups" (rail accordions)
  are applied before first paint where possible; ?theme= / ?font= override.

  READING STATE (client-side only): localStorage "deepread-library-state" holds
  {opened:{id:ISO}, stars:{id:true}, last:{id,at}}; missing/corrupt JSON is
  tolerated. Related papers are computed in the browser from category overlaps
  (weight 2) + tag overlaps (weight 1) — the builder injects no extra data.
================================================================================
-->
<script>
/* Theme bootstrap before first paint (avoids FOUC):
   ?theme= > localStorage > OS preference. Shared key with the report shell so the
   report loaded inside the reader follows the same preference on next open. */
(function(){try{
  var sp=null; try{ sp=new URLSearchParams(location.search); }catch(e){}
  var q=sp?sp.get('theme'):null;
  var s=null; try{s=localStorage.getItem('deepread-theme');}catch(e){}
  var t=(q==='dark'||q==='light')?q:(s||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));
  document.documentElement.setAttribute('data-theme',t);

  var f=sp?sp.get('font'):null;
  var fs=null; try{fs=localStorage.getItem('deepread-font');}catch(e){}
  var font=(f==='mono'||f==='read')?f:(fs==='mono'?'mono':'read');
  document.documentElement.setAttribute('data-font',font);

  var dn=null; try{dn=localStorage.getItem('deepread-density');}catch(e){}
  document.documentElement.setAttribute('data-density',dn==='compact'?'compact':'comfort');
}catch(e){
  document.documentElement.setAttribute('data-theme','light');
  document.documentElement.setAttribute('data-font','read');
  document.documentElement.setAttribute('data-density','comfort');
}})();
</script>
<style>
/* ==========================================================================
   0. DESIGN TOKENS — same family as assets/report_template.html
   ========================================================================== */
:root{
  /* monospace everywhere (user preference); CJK falls back to the nearest CJK face */
  --font-sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono","Sarasa Mono SC","Noto Sans Mono CJK SC","PingFang SC","Microsoft YaHei",monospace;

  --bg:#f5f2ea;
  --bg-2:#ece7db;
  --surface:#fffdf8;
  --surface-2:#f8f5ee;
  --ink:#14242e;
  --ink-2:#485c66;
  --ink-3:#78898f;
  --rule:#dcd4c4;
  --rule-soft:#e8e2d5;

  --teal:#0f6f67;
  --teal-ink:#0a5b55;
  --teal-soft:#d9ebe7;
  --amber:#a4610b;
  --amber-ink:#8a5108;
  --amber-soft:#f4e4c6;
  --navy:#0d2b44;
  --navy-soft:#e1e8ef;
  --ok:#1f7a5b;
  --ok-soft:#dcefe5;
  --bad:#a63f2c;
  --bad-soft:#f5ddd6;
  --focus:#0f6f67;

  --fig-bg:#efebe1;
  --shadow-1:0 1px 2px rgba(13,43,68,.05),0 12px 30px -18px rgba(13,43,68,.22);
  --shadow-2:0 24px 70px -24px rgba(5,24,35,.45);
  --shadow-pop:0 10px 30px -12px rgba(5,24,35,.28);

  /* auto-category accent tints (light) */
  --cat0-bg:#d9ebe7; --cat0-ink:#0a5b55;
  --cat1-bg:#f4e4c6; --cat1-ink:#8a5108;
  --cat2-bg:#e1e8ef; --cat2-ink:#1f4a6e;
  --cat3-bg:#f5ddd6; --cat3-ink:#9c3a28;
  --cat4-bg:#e6e8da; --cat4-ink:#4d5b33;

  --maxw:1400px;

}

html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#081216;
  --bg-2:#0c191f;
  --surface:#0f1e25;
  --surface-2:#0c1a21;
  --ink:#e6eef1;
  --ink-2:#a8bcc3;
  --ink-3:#7c929a;
  --rule:#243841;
  --rule-soft:#182b33;

  --teal:#63d6c8;
  --teal-ink:#8ae6dc;
  --teal-soft:#10312f;
  --amber:#f0b45f;
  --amber-ink:#f5c67f;
  --amber-soft:#2c2312;
  --navy:#cfe0ec;
  --navy-soft:#142734;
  --ok:#6fd2a9;
  --ok-soft:#102b22;
  --bad:#ef927c;
  --bad-soft:#2e1915;
  --focus:#63d6c8;

  --fig-bg:#e8e5de;
  --shadow-1:0 1px 2px rgba(0,0,0,.25),0 14px 34px -20px rgba(0,0,0,.6);
  --shadow-2:0 26px 80px -24px rgba(0,0,0,.75);
  --shadow-pop:0 12px 34px -14px rgba(0,0,0,.6);

  --cat0-bg:#10312f; --cat0-ink:#8ae6dc;

.cat-0{--cat-bg:var(--cat0-bg);--cat-ink:var(--cat0-ink)}
.cat-1{--cat-bg:var(--cat1-bg);--cat-ink:var(--cat1-ink)}
.cat-2{--cat-bg:var(--cat2-bg);--cat-ink:var(--cat2-ink)}
.cat-3{--cat-bg:var(--cat3-bg);--cat-ink:var(--cat3-ink)}

/* ==========================================================================
   1. RESET + BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  overflow-x:clip;
  scrollbar-gutter:stable;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.65;
  font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img,svg{max-width:100%}
img{height:auto}
button{font:inherit;color:inherit}
a{color:var(--teal-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--teal) 48%,transparent)}
a:hover{text-decoration-color:var(--teal)}
::selection{background:var(--amber-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.hidden{display:none!important}
.nw{white-space:nowrap}

.skip-link{
  position:fixed;left:14px;top:-60px;z-index:900;
  padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--bg);
  font-size:13px;text-decoration:none;transition:top .18s ease;
}
.skip-link:focus{top:12px}
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
html.viewer-open,html.viewer-open body,
html.drawer-lock,html.drawer-lock body{overflow:hidden}

/* ==========================================================================
   2. COMPACT APP HEADER (title + inline stats + search + theme)
   ========================================================================== */
.app-head{
  position:sticky;top:0;z-index:120;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  backdrop-filter:blur(14px) saturate(1.1);
  border-bottom:1px solid var(--rule-soft);
}
.app-head::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:1;
  background:linear-gradient(90deg,var(--teal),transparent 38%,transparent 62%,var(--amber));
  opacity:.7;
}
.head-main{
  max-width:var(--maxw);margin:0 auto;
  padding:9px clamp(16px,3vw,32px);
  display:flex;align-items:center;gap:18px;min-height:var(--head-h);
}
.head-brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 1 auto}
.brand-mark{
  width:32px;height:32px;flex:none;display:grid;place-items:center;
  border-radius:9px;background:var(--navy);color:var(--bg);
}
.brand-mark svg{width:18px;height:18px;display:block}
.brand-text{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.brand-row{display:flex;align-items:center;gap:9px;min-width:0}
.brand-row h1{
  margin:0;font-family:var(--font-serif);
  font-size:clamp(17px,1.5vw,20px);font-weight:600;letter-spacing:-.005em;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch;
}
.brand-ver{
  flex:none;display:inline-flex;align-items:center;white-space:nowrap;
  font-family:var(--font-mono);font-size:10.3px;font-weight:600;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
  color:var(--teal-ink);background:var(--teal-soft);
  border:1px solid color-mix(in srgb,var(--teal) 26%,transparent);
  border-radius:999px;padding:1.5px 7px;
}
.head-stats{
  margin:2px 0 0;
  font-family:var(--font-mono);font-size:10.3px;line-height:1.5;
  letter-spacing:.01em;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60ch;
  font-variant-numeric:tabular-nums;
}
.head-stats b{color:var(--ink-2);font-weight:600}
.head-stats .sep{opacity:.45;padding:0 4px}

.head-search{
  display:flex;align-items:center;gap:8px;min-width:0;
  flex:1 1 280px;max-width:520px;margin-left:auto;
  height:38px;padding:0 9px 0 12px;
  border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
.head-search:focus-within{
  border-color:var(--teal);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 14%,transparent);
  background:var(--surface);
}
.search-ico{flex:none;width:15px;height:15px;color:var(--ink-3);display:block}
.head-search:focus-within .search-ico{color:var(--teal-ink)}
#q{
  flex:1 1 auto;min-width:0;height:100%;
  appearance:none;-webkit-appearance:none;border:0;background:transparent;outline:none;
  color:var(--ink);font-family:var(--font-sans);font-size:13.5px;letter-spacing:.005em;
}
#q::placeholder{color:var(--ink-3);opacity:1}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search-kbd{
  flex:none;display:inline-grid;place-items:center;
  min-width:20px;height:20px;padding:0 5px;
  border:1px solid var(--rule);border-radius:5px;
  font-family:var(--font-mono);font-size:10px;line-height:1;color:var(--ink-3);
  background:var(--surface-2);
}
.search-clear{
  flex:none;appearance:none;cursor:pointer;
  width:23px;height:23px;border:1px solid var(--rule);border-radius:50%;
  display:grid;place-items:center;background:var(--surface-2);
  color:var(--ink-2);font-size:13px;line-height:1;
}
.search-clear:hover{background:var(--teal-soft);color:var(--teal-ink);border-color:var(--teal)}
.theme-toggle{
  flex:none;appearance:none;cursor:pointer;
  width:38px;height:38px;display:grid;place-items:center;
  border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);color:var(--ink-2);
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.theme-toggle:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.theme-toggle svg{width:16px;height:16px;display:block}
.theme-toggle .i-moon{display:none}
html[data-theme="dark"] .theme-toggle .i-sun{display:none}
html[data-theme="dark"] .theme-toggle .i-moon{display:block}

/* ==========================================================================
   3. LAYOUT: sticky rail + main column
   ========================================================================== */
.app-layout{
  max-width:var(--maxw);margin:0 auto;
  padding:clamp(18px,2.4vw,26px) clamp(16px,3vw,32px) 8px;
  display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);
  gap:clamp(20px,2.6vw,34px);align-items:start;
}
.rail{
  position:sticky;top:calc(var(--head-h) + 18px);
  align-self:start;min-width:0;
  max-height:calc(100vh - var(--head-h) - 36px);
  overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:var(--rule);border-radius:99px}
.rail-head{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.rail-h{
  margin:0;font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
}
.rail-clear{
  margin-left:auto;appearance:none;cursor:pointer;border:0;background:transparent;
  padding:3px 4px;border-radius:5px;
  font-size:11px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;
}
.rail-clear:hover{color:var(--bad)}
.rail-clear[disabled]{opacity:.4;cursor:not-allowed;text-decoration:none}
.rail-close{
  display:none;appearance:none;cursor:pointer;
  width:28px;height:28px;border:1px solid var(--rule);border-radius:8px;
  background:var(--surface);color:var(--ink-2);font-size:15px;line-height:1;
}
.rail-close:hover{background:var(--surface-2);color:var(--ink)}

.rail-group{margin:0 0 16px;padding:0 0 15px;border-bottom:1px dashed var(--rule-soft)}
.rail-group:last-of-type{border-bottom:0}
.rail-title{
  margin:0 0 8px;
  font-family:var(--font-mono);font-size:9.8px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
.rail-list{display:flex;flex-direction:column;gap:1px}
.rail-opt{
  appearance:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  width:100%;min-width:0;padding:4px 6px;margin:0 -6px;
  border:0;border-radius:7px;background:transparent;
  text-align:left;font-size:12.5px;line-height:1.5;color:var(--ink-2);
  transition:background .14s ease,color .14s ease;
}
.rail-opt:hover{background:var(--surface-2);color:var(--ink)}
.opt-box{
  flex:none;width:13px;height:13px;border:1px solid var(--rule);border-radius:4px;
  background:var(--surface);display:grid;place-items:center;
  transition:background .14s ease,border-color .14s ease;
}
.opt-box::after{content:"";width:6px;height:3px;border-left:1.6px solid transparent;border-bottom:1.6px solid transparent;transform:rotate(-45deg) translateY(-1px)}
.opt-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-n{flex:none;font-family:var(--font-mono);font-size:9.8px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail-opt[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.rail-opt[aria-pressed="true"] .opt-box{background:var(--teal);border-color:var(--teal)}
.rail-opt[aria-pressed="true"] .opt-box::after{border-color:var(--surface)}
.rail-opt[aria-pressed="true"] .opt-n{color:var(--teal-ink);opacity:.75}
.rail-empty{margin:2px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-3)}
.rail-select{
  width:100%;height:31px;padding:0 7px;
  border:1px solid var(--rule);border-radius:8px;background:var(--surface);
  color:var(--ink);font-family:var(--font-sans);font-size:12.5px;line-height:1;
  cursor:pointer;
}
.rail-select:hover{border-color:var(--ink-3)}
.rail-more{margin:0 0 14px;border-bottom:1px dashed var(--rule-soft);padding-bottom:12px}
.rail-more summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
  padding:3px 0;font-size:12.5px;color:var(--ink-2);
}
.rail-more summary::-webkit-details-marker{display:none}
.rail-more summary::after{
  content:"▾";margin-left:auto;font-size:9px;color:var(--ink-3);
  transition:transform .15s ease;
}
.rail-more[open] summary::after{transform:rotate(180deg)}
.rail-more summary:hover{color:var(--ink)}
.rail-more-n{
  display:none;align-items:center;justify-content:center;
  min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--teal-soft);color:var(--teal-ink);
  font-family:var(--font-mono);font-size:9px;font-weight:700;
}
.rail-more-n.is-on{display:inline-grid}
.rail-more-body{padding:9px 0 0}
.rail-tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 7px}
.tag-chip{
  appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  max-width:100%;padding:2px 7px;border-radius:999px;
  border:1px solid var(--rule);background:var(--surface);
  font-family:var(--font-sans);font-size:10.6px;line-height:1.65;color:var(--ink-3);
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
.tag-chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:15ch}
.tag-chip:hover{border-color:var(--ink-3);color:var(--ink)}
.tag-chip[aria-pressed="true"]{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 40%,var(--rule));color:var(--teal-ink);font-weight:600}
.rail-tag-more{
  appearance:none;cursor:pointer;border:0;background:transparent;padding:2px 0;
  font-size:10.6px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;
}
.rail-tag-more:hover{color:var(--teal-ink)}
.rail-check{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:2px 0;font-size:12.2px;color:var(--ink-2);
}
.rail-check input{accent-color:var(--teal);width:14px;height:14px;margin:0}
.rail-check:hover{color:var(--ink)}
.rail-foot{
  margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-soft);
  font-family:var(--font-mono);font-size:9.5px;line-height:1.65;color:var(--ink-3);
}
.rail-foot b{color:var(--ink-2);font-weight:600}

/* ==========================================================================
   4. TOOLBAR + ACTIVE FILTER BAR
   ========================================================================== */
.main{min-width:0}

/* ==========================================================================
   5. CARDS (dense)
   ========================================================================== */
.cards{

  .quick-bar{gap:5px;margin-bottom:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .quick-bar::-webkit-scrollbar{display:none}
  .quick-btn{flex:none;height:27px;font-size:11px;padding:0 9px}
}

/* rail accordions */
.rail-head{margin-bottom:9px}
.rail-acc{margin:0;padding:0;border-bottom:1px solid var(--rule-soft)}
.rail-acc:last-of-type{border-bottom:0}
.rail-acc-head{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;
  padding:6px 0;
}
.rail-acc-head::-webkit-details-marker{display:none}
.rail-acc-title{
  font-family:var(--font-mono);font-size:9.8px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}
.rail-acc-head:hover .rail-acc-title{color:var(--ink-2)}
.rail-acc-n{
  margin-left:auto;min-width:0;max-width:52%;
  font-family:var(--font-mono);font-size:9.2px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;
}
.rail-acc-chev{flex:none;position:relative;width:10px;height:10px;font-size:0;color:var(--ink-3)}
.rail-acc-chev::before{content:"";position:absolute;left:1px;top:2px;width:5px;height:5px;border-right:1.4px solid var(--ink-3);border-bottom:1.4px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s ease,top .15s ease}
.rail-acc[open] .rail-acc-chev::before{transform:rotate(-135deg);top:4px}
.rail-acc-body{padding:0 0 9px}
.rail-sub{display:flex;flex-direction:column;gap:3px;margin:0 0 7px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rail-sub:last-child{margin-bottom:0}
.rail-sub .rail-select{letter-spacing:0;text-transform:none;margin-top:2px}
.rail-pdf{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule-soft)}

/* quick peek popover */
.peek{
  position:fixed;z-index:420;width:min(360px,92vw);max-height:min(72vh,620px);overflow:auto;
  padding:13px 14px;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;box-shadow:var(--shadow-2);font-size:12px;color:var(--ink);
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.peek[hidden]{display:none!important}
.peek-top{display:flex;align-items:flex-start;gap:8px}
.peek-title{flex:1;min-width:0;font-family:var(--font-serif);font-size:14.5px;line-height:1.38;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.peek-close{appearance:none;cursor:pointer;flex:none;width:22px;height:22px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink-3);font-size:12px;line-height:1}
.peek-close:hover{background:var(--surface-2);color:var(--ink)}
.peek-zh{margin:4px 0 5px;font-size:11.5px;line-height:1.5;color:var(--ink-2);overflow-wrap:anywhere}
.peek-meta{margin:0 0 7px;font-family:var(--font-mono);font-size:9.4px;line-height:1.5;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek-tldr{margin:0 0 9px;font-size:12px;line-height:1.66;color:var(--ink-2);overflow-wrap:anywhere}
.peek-chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.peek-counts{display:flex;flex-wrap:wrap;gap:3px 9px;margin:0 0 9px;font-family:var(--font-mono);font-size:9.4px;color:var(--ink-3)}
.peek-counts b{color:var(--ink-2)}
.peek-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--rule-soft)}
.peek-acts .btn-read{height:26px;font-size:11px}

/* mobile bottom tabs */
.mobile-tabs{display:none}
@media (max-width:760px){
  .mobile-tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:150;
    display:grid;grid-template-columns:repeat(4,1fr);
    background:color-mix(in srgb,var(--surface) 97%,transparent);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--rule);
    padding:3px 6px calc(3px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 26px -20px rgba(5,24,35,.5);
  }
  .mtab{
    appearance:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;
    padding:4px 2px 3px;border:0;border-radius:8px;background:transparent;
    color:var(--ink-3);font-size:10.5px;line-height:1.25;
  }
  .mtab:hover{color:var(--ink-2)}
  .mtab.is-active{color:var(--teal-ink);background:var(--teal-soft);font-weight:600}
  .mtab:disabled{opacity:.42;cursor:default}
  .mtab-ico{font-size:13px;line-height:1.1}
  .mtab-n{font-family:var(--font-mono);font-size:8.4px;line-height:1.2;opacity:.78}
  html.viewer-open .mobile-tabs,body.drawer-open .mobile-tabs{display:none}
  .app-layout{padding-bottom:76px}
  .site-foot{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
}

/* reader: breadcrumb, loop, fullscreen, compact mobile bar */
.vcrumb{margin:0 0 1px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcrumb .sep{opacity:.45;padding:0 3px}
.vbtn-full{order:9;padding:0 8px;font-size:13px}
.viewer:fullscreen{padding:0}
.viewer:fullscreen .viewer-shell{border-radius:0;border:0}
@media (max-width:760px){
  .viewer-bar{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"close title full" "acts acts acts";
    align-items:center;gap:5px 8px;padding:6px 8px;
  }
  .viewer-bar .vbtn-close{grid-area:close;padding:0 8px}
  .vbtn-close svg{width:12px;height:12px}
  .viewer-bar #viewerFull{grid-area:full}
  .vtitle-wrap{grid-area:title;order:0;flex:none;min-width:0}
  .vacts{grid-area:acts;width:auto;margin-left:0;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:2px}
  .vacts .vbtn{flex:none}
  .vsep{display:none}
  .vcrumb,.vsub{display:none}
  .vtitle{font-size:13px}
  .viewer-bar .vbtn{height:28px}
  .viewer-bar #viewerFull{order:0}
}
.card-title{line-height:1.38}

/* ==========================================================================
   12. PRINT — a plain card list
   ========================================================================== */
@media print{
  @page{margin:14mm}
  /* print always uses the light token set, even when the reader is in dark mode */
  :root,html[data-theme="dark"],html[data-theme="light"]{
    --bg:#fff;--bg-2:#fff;--surface:#fff;--surface-2:#fff;
    --ink:#111;--ink-2:#333;--ink-3:#555;--rule:#bbb;--rule-soft:#ddd;
    --teal:#0f6f67;--teal-ink:#0a5b55;--teal-soft:#eef6f4;
    --amber:#a4610b;--amber-ink:#8a5108;--amber-soft:#faf1e2;
    --navy:#0d2b44;--navy-soft:#eee;--focus:#0f6f67;
    --shadow-1:none;--shadow-2:none;--shadow-pop:none;
  }
  html,body{background:#fff!important;color:#111!important}
  .app-head{position:static;background:#fff!important;border-bottom:2px solid #111}
  .app-head::before{display:none}
  .head-search,.theme-toggle,.rail,.rail-scrim,.toolbar,.active-bar,.site-foot,
  .viewer,.err-banner,.card-foot,.head-stats,.skip-link,.card-link{display:none!important}
  .app-layout{display:block;max-width:none;padding:8px 0 0}
  .main{padding:0}
  .cards{display:block}
  .card{
    break-inside:avoid;page-break-inside:avoid;
    margin:0 0 9pt;border:1px solid #bbb!important;box-shadow:none!important;
    display:block;
  }
  .card:hover{transform:none}
  .card-media{display:none!important}
  .card-body{padding:8pt 10pt 3pt}
  .card-catrow,.card-tags{display:none!important}
  .card-title{font-size:12pt;-webkit-line-clamp:unset;display:block;overflow:visible}
  .card-title-zh{white-space:normal;display:block;font-size:9.5pt}
  .card-meta{white-space:normal;font-size:8pt}
  .card-tldr{-webkit-line-clamp:unset;display:block;overflow:visible;font-size:9.5pt}
  .card-counts{font-size:8pt;color:#444}
  .card::after{
    content:attr(data-print-url);display:block;
    padding:0 10pt 4pt;font-family:monospace;font-size:7.5pt;color:#666;overflow-wrap:anywhere;
  }
  .hit{break-inside:avoid;box-shadow:none!important;border:1px solid #bbb!important;margin-bottom:8pt}
  .table-wrap{overflow:visible;border-color:#bbb}
  .lib-table{font-size:9pt}
  a{color:#111!important;text-decoration:none!important}
  .quick-bar,.mobile-tabs,.peek,.font-toggle,.tb-mini,.sync-wrap{display:none!important}
  .lib-list{display:block;border:0;box-shadow:none}
  .list-row{display:block;padding:6pt 0;border-bottom:1px solid #ddd}
  .list-thumb,.list-acts,.list-state,.list-open{display:none!important}
  .list-title{font-size:11pt;white-space:normal}
  .list-zh{font-size:9pt;white-space:normal}
  .list-meta,.list-counts{display:block;font-size:8pt}
  .list-cat{display:none}
}
</style>

<div class="app-layout">

        </div>
      </div>
    </details>

    <details class="rail-acc" data-group="cats" open>

    <details class="rail-acc" data-group="meta" open>

      </div>

    <details class="rail-acc" data-group="tags" open>
      <summary class="rail-acc-head"><span class="rail-acc-title">标签</span><span class="rail-acc-n" id="groupTagsN"></span><span class="rail-acc-chev" aria-hidden="true">▾</span></summary>
      <div class="rail-acc-body"><div class="rail-tags" id="tagChips"></div></div>
    </details>

    </label>

    <p class="rail-foot" id="railFoot"></p>

      <button class="quick-btn" type="button" data-quick="recent" aria-pressed="false">最近打开<span class="qn" id="quickRecentN">0</span></button>

        <span class="k">继续阅读：</span><span class="t" id="continueTitle"></span><span class="arrow">→</span>

    <div class="err-banner" id="errBanner" hidden></div>
  </main>
</div>

<!-- ================================================================ APP -->
<script>
(function(){
  'use strict';

  /* ---------------------------------------------------------- diagnostics */
  var ERRORS = [];
  window.addEventListener('error', function(ev){
    try{ ERRORS.push(String((ev && (ev.message || ev.error)) || 'unknown error')); }catch(e){}
  });

  /* ------------------------------------------------------------- helpers */
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function clear(n){ while(n && n.firstChild) n.removeChild(n.firstChild); }
  function str(v){ return (v === undefined || v === null) ? '' : String(v).trim(); }
  function num(v){
    if(typeof v === 'number' && isFinite(v)) return v;
    if(typeof v === 'string' && v.trim() !== ''){ var n = parseInt(v, 10); if(isFinite(n)) return n; }
    return null;
  }
  function toArr(v){
    if(Array.isArray(v)) return v;
    if(v === undefined || v === null || v === '') return [];
    if(typeof v === 'string') return v.split(/[,;，；|]/).map(function(s){ return s.trim(); }).filter(Boolean);
    return [v];
  }
  function dedupe(list){
    var seen = Object.create(null), out = [];
    list.forEach(function(x){
      var k = '$' + x;
      if(!seen[k]){ seen[k] = 1; out.push(x); }
    });
    return out;
  }
  function clampLine(text, max){
    text = str(text);
    return text.length > max ? text.slice(0, max - 1) + '…' : text;
  }
  /* only relative paths and http(s) links may become anchors; a hostile
     javascript:/data: value in the JSON is dropped instead of rendered as a link */
  function safeHref(v){
    var value = str(v);
    if(!value) return '';
    if(/^\s*(javascript|vbscript|data):/i.test(value)) return '';
    return value;
  }
  function baseName(path){
    var s = str(path).split(/[?#]/)[0];
    var parts = s.split('/');
    return parts[parts.length - 1] || '';
  }

  /* ------------------------------------------------------------ data load */
  var RAW = null;
  try{
    var dataNode = document.getElementById('library-data');
    if(dataNode && dataNode.textContent && dataNode.textContent.trim()) RAW = JSON.parse(dataNode.textContent);
    else RAW = {};
  }catch(err){
    ERRORS.push('文献库数据解析失败：' + (err && err.message ? err.message : String(err)));
    RAW = {};
  }
  if(Array.isArray(RAW)) RAW = { papers: RAW };
  if(!RAW || typeof RAW !== 'object') RAW = {};
  var RAW_STATS = (RAW.stats && typeof RAW.stats === 'object') ? RAW.stats : {};

  function normPaper(raw, i){
    if(!raw || typeof raw !== 'object') raw = {};
    var p = {};
    p.id = str(raw.id) || ('paper-' + (i + 1));
    p.html = safeHref(raw.html);
    p.raw = safeHref(raw.raw);
    p.rawName = str(raw.raw_name) || baseName(p.raw);
    p.pdf = safeHref(raw.pdf);         /* kept for tolerance; not linked */
    p.readme = str(raw.readme);        /* kept for tolerance; never linked */
    p.title = str(raw.title) || p.id;
    p.title_zh = str(raw.title_zh);
    p.journal = str(raw.journal);
    p.year = str(raw.year);
    p.doi = str(raw.doi);
    p.authors = dedupe(toArr(raw.authors).map(str).filter(Boolean));
    p.tags = dedupe(toArr(raw.tags).map(str).filter(Boolean));
    p.categories = dedupe(toArr(raw.categories).map(str).filter(Boolean));
    p.tldr = str(raw.tldr);
    p.metrics = [];
    if(Array.isArray(raw.metrics)){
      raw.metrics.forEach(function(m){
        if(!m || typeof m !== 'object') return;
        var value = str(m.value !== undefined ? m.value : m.v);
        var label = str(m.label !== undefined ? m.label : m.l);
        var note = str(m.note !== undefined ? m.note : m.n);
        if(value || label) p.metrics.push({ value: value, label: label, note: note });
      });
    }
    p.figures = num(raw.figures);
    p.claims = num(raw.claims);
    p.sectionsN = num(raw.sections);
    p.updated = str(raw.updated);
    p.thumb = str(raw.thumb);
    p.text = [];
    if(Array.isArray(raw.text)){
      raw.text.forEach(function(t, j){
        if(!t || typeof t !== 'object') return;
        var body = str(t.t);
        if(!body) return;
        p.text.push({ id: str(t.id), h: str(t.h) || ('段落 ' + (j + 1)), t: body, _l: null });
      });
    }
    p._meta = [
      ['标题', p.title],
      ['中文标题', p.title_zh],
      ['作者', p.authors.join(', ')],
      ['标签', p.tags.join(' · ')],
      ['一句话结论', p.tldr],
      ['DOI', p.doi]
    ];
    p._hay = [p.title, p.title_zh, p.authors.join(' '), p.tags.join(' '), p.tldr, p.doi].join('\n').toLowerCase();
    return p;
  }

  var PAPERS = [];
  var YEAR_MAP = Object.create(null), YEARS = [];
  var JOURNAL_MAP = Object.create(null), JOURNALS = [];
  var CAT_MAP = Object.create(null), CATEGORIES = [];
  var TAG_MAP = Object.create(null), TAGS = [];
  var RAW_COUNT = 0, LATEST_UPDATE = '', YEAR_RANGE = '';
  var UPDATED = '', CAT_COUNT = 0, TOTAL_PAPERS = 0;

  /* --------------------------------------------------------- computed meta */
  function countMap(items){
    var m = Object.create(null);
    items.forEach(function(x){ if(x) m[x] = (m[x] || 0) + 1; });
    return m;
  }
  function mapSorted(m){
    return Object.keys(m).map(function(k){ return { name: k, n: m[k] }; })
      .sort(function(a, b){ return (b.n - a.n) || a.name.localeCompare(b.name, 'zh-Hans-CN'); });
  }
  function yearNum(p){
    var y = parseInt(p.year, 10);
    return isFinite(y) ? y : -9999;
  }

  /* All data-derived values are rebuilt here (boot + every live refresh). */
  function refreshDataset(nextRaw){
    RAW = (nextRaw && typeof nextRaw === 'object') ? nextRaw : {};
    if(Array.isArray(RAW)) RAW = { papers: RAW };
    RAW_STATS = (RAW.stats && typeof RAW.stats === 'object') ? RAW.stats : {};
    PAPERS = (Array.isArray(RAW.papers) ? RAW.papers : []).map(normPaper);

    YEAR_MAP = countMap(PAPERS.map(function(p){ return p.year; }).filter(Boolean));
    YEARS = Object.keys(YEAR_MAP).sort(function(a, b){ return (parseInt(b, 10) || 0) - (parseInt(a, 10) || 0) || b.localeCompare(a); });
    JOURNAL_MAP = countMap(PAPERS.map(function(p){ return p.journal; }).filter(Boolean));
    JOURNALS = mapSorted(JOURNAL_MAP);
    CAT_MAP = countMap(PAPERS.reduce(function(acc, p){ return acc.concat(p.categories); }, []));
    CATEGORIES = mapSorted(CAT_MAP);
    TAG_MAP = countMap(PAPERS.reduce(function(acc, p){ return acc.concat(p.tags); }, []));
    TAGS = mapSorted(TAG_MAP);
    RAW_COUNT = PAPERS.filter(function(p){ return !!p.raw; }).length;
    LATEST_UPDATE = (function(){
      var best = '';
      PAPERS.forEach(function(p){ if(p.updated && p.updated > best) best = p.updated; });
      return best;
    })();
    YEAR_RANGE = (function(){
      if(!YEARS.length) return '';
      if(YEARS.length === 1) return YEARS[0];
      var nums = YEARS.map(function(y){ return parseInt(y, 10); }).filter(isFinite);
      if(nums.length === YEARS.length){
        var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
        return (lo === hi) ? String(lo) : (lo + '–' + hi);
      }
      return YEARS[YEARS.length - 1] + '–' + YEARS[0];
    })();
    UPDATED = str(RAW_STATS.updated) || LATEST_UPDATE || BUILD_DATE;
    CAT_COUNT = CATEGORIES.length;
    TOTAL_PAPERS = PAPERS.length;
    RELATED = computeRelated();
  }

  /* --------------------------------------------------------- title/date */
  var TITLE = (function(){
    var src = document.getElementById('libraryTitleSrc');
    var t = src ? str(src.textContent) : '';
    if(!t || t.indexOf('{{') >= 0) t = '文献库';
    return t;
  })();
  var BUILD_DATE = (function(){
    var src = document.getElementById('buildDateSrc');
    var t = src ? str(src.textContent) : '';
    if(!t || t.indexOf('{{') >= 0) t = '';
    return t;
  })();
  var VERSION = (function(){
    var m = document.querySelector('meta[name="library-version"]');
    var t = m ? str(m.getAttribute('content')) : '';
    if(!t || t.indexOf('{{') >= 0) t = '';
    return t.replace(/^v/i, '');
  })();

  function catClass(name){
    if(!name) return 'cat-5';
    var h = 0, i;
    for(i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
    return 'cat-' + (Math.abs(h) % 6);
  }

  /* -------------------------------------------------------------- state */
  var state = {
    q: '',
    cats: Object.create(null),
    year: '',
    journal: '',
    tags: Object.create(null),
    pdf: false,
    starOnly: false,
    unreadOnly: false,
    quick: 'all',
    view: 'cards',
    sort: 'year',
    tagsOpen: false
  };
  function catKeys(){ return Object.keys(state.cats); }
  function tagKeys(){ return Object.keys(state.tags); }
  function filterCount(){
    return catKeys().length + tagKeys().length + (state.year ? 1 : 0) + (state.journal ? 1 : 0) +
           (state.pdf ? 1 : 0) + (state.starOnly ? 1 : 0) + (state.unreadOnly ? 1 : 0) +
           (state.quick !== 'all' ? 1 : 0);
  }
  function activeCount(){ return filterCount() + (state.q.trim() ? 1 : 0); }
  function emptyState(){ return { q:'', cats:Object.create(null), year:'', journal:'', tags:Object.create(null), pdf:false, starOnly:false, unreadOnly:false, quick:'all', view:'cards', sort:'year' }; }
  function stateSig(st){
    return [String(st.q || '').trim(), Object.keys(st.cats || {}).sort().join('\u0001'), st.year || '', st.journal || '',
            Object.keys(st.tags || {}).sort().join('\u0001'), st.pdf ? '1' : '0',
            st.starOnly ? '1' : '0', st.unreadOnly ? '1' : '0', st.quick || 'all', st.view || 'cards', st.sort || 'year'].join('\u0002');
  }

  /* --------------------------------------------------------------- DOM */
  var qInput = $('#q');
  var qClear = $('#qClear');
  var libTitleEl = $('#libTitle');
  var headStats = $('#headStats');
  var themeToggle = $('#themeToggle');
  var catList = $('#catList');
  var yearSel = $('#yearSel');
  var journalSel = $('#journalSel');
  var tagChips = $('#tagChips');
  var pdfOnly = $('#pdfOnly');
  var pdfOnlyWrap = $('#pdfOnlyWrap');
  var fontToggle = $('#fontToggle');
  var densityBtn = $('#densityBtn');
  var quickBar = $('#quickBar');
  var quickBtns = $$('.quick-btn');
  var quickUnreadN = $('#quickUnreadN');
  var quickStarN = $('#quickStarN');
  var quickRecentN = $('#quickRecentN');
  var groupMyN = $('#groupMyN');
  var groupCatsN = $('#groupCatsN');
  var groupMetaN = $('#groupMetaN');
  var groupTagsN = $('#groupTagsN');
  var mobileTabs = $('#mobileTabs');
  var tabUnreadN = $('#tabUnreadN');
  var tabStarN = $('#tabStarN');
  var peekEl = $('#peek');
  var viewerFull = $('#viewerFull');
  var viewerCrumb = $('#viewerCrumb');
  var resetBtn = $('#resetBtn');
  var railClose = $('#railClose');
  var railScrim = $('#railScrim');
  var filterToggle = $('#filterToggle');
  var filterToggleN = $('#filterToggleN');
  var railFoot = $('#railFoot');
  var resultCountEl = $('#resultCount');
  var sortSel = $('#sortSel');
  var resultHead = $('#resultHead');
  var resultRegion = $('#resultRegion');
  var activeBar = $('#activeBar');
  var errBanner = $('#errBanner');
  var buildDateFoot = $('#buildDateFoot');
  var libVerEl = $('#libVer');
  var libVerFoot = $('#libVerFoot');
  var libTitleFoot = $('#libTitleFoot');

  var viewer = $('#viewer');
  var viewerShell = $('#viewerShell');
  var viewerClose = $('#viewerClose');
  var viewerTitle = $('#viewerTitle');
  var viewerSub = $('#viewerSub');
  var viewerPos = $('#viewerPos');
  var viewerPrev = $('#viewerPrev');
  var viewerNext = $('#viewerNext');
  var viewerOpenTab = $('#viewerOpenTab');
  var viewerRawView = $('#viewerRawView');
  var viewerFrame = $('#viewerFrame');
  var viewerLoading = $('#viewerLoading');
  var viewerHint = $('#viewerHint');

  var continueBtn = $('#continueBtn');
  var continueTitleEl = $('#continueTitle');
  var starOnly = $('#starOnly');
  var unreadOnly = $('#unreadOnly');
  var starCountEl = $('#starCount');
  var unreadCountEl = $('#unreadCount');
  var viewerRelatedBtn = $('#viewerRelatedBtn');
  var viewerRelatedN = $('#viewerRelatedN');
  var viewerRelated = $('#viewerRelated');
  var viewerRelatedList = $('#viewerRelatedList');
  var viewerRelatedClose = $('#viewerRelatedClose');

  var syncWrap = $('#syncWrap');
  var syncChip = $('#syncChip');
  var syncBadge = $('#syncBadge');
  var syncBtn = $('#syncBtn');
  var staticHint = $('#staticHint');

  /* =========================================================== header */
  function paintHeader(){
    libTitleEl.textContent = TITLE;
    var verText = VERSION ? ('v' + VERSION) : '';
    document.title = TITLE + (verText ? ' ' + verText : '') + ' · 程控数芯';
    var metaVer = document.querySelector('meta[name="library-version"]');
    if(metaVer) metaVer.setAttribute('content', verText || '');
    if(libVerEl){
      libVerEl.textContent = verText || 'v—';
      libVerEl.hidden = !verText;
      libVerEl.title = verText ? ('文献库版本 ' + verText) : '';
    }
    if(libVerFoot){
      libVerFoot.textContent = verText;
      libVerFoot.hidden = !verText;
    }
    if(libTitleFoot) libTitleFoot.textContent = TITLE;

    clear(headStats);
    if(!TOTAL_PAPERS){
      headStats.textContent = '还没有报告 · 用 paper-deepread-html skill 生成第一篇';
    }else{
      headStats.appendChild(el('b', null, String(TOTAL_PAPERS)));
      headStats.appendChild(document.createTextNode(' 篇'));
      if(YEAR_RANGE){
        headStats.appendChild(el('span', 'sep', '·'));
        headStats.appendChild(el('span', 'nw yr', YEAR_RANGE + ' 年'));
      }
      headStats.appendChild(el('span', 'sep', '·'));
      headStats.appendChild(el('b', null, String(CAT_COUNT)));
      headStats.appendChild(document.createTextNode(' 个主题'));
      if(UPDATED){
        headStats.appendChild(el('span', 'sep upd', '·'));
        headStats.appendChild(el('span', 'nw upd', '更新于 ' + UPDATED));
      }
    }
    buildDateFoot.textContent = BUILD_DATE ? ('构建于 ' + BUILD_DATE) : '构建于本地';
    clear(railFoot);
    if(RAW_COUNT){
      railFoot.appendChild(el('b', null, String(RAW_COUNT)));
      railFoot.appendChild(document.createTextNode(' / ' + TOTAL_PAPERS + ' 篇有原文 PDF'));
    }
  }

  /* ============================================================= rail */
  var catButtons = Object.create(null);
  var tagButtons = Object.create(null);

  function buildRail(){
    yearSel.addEventListener('change', function(){ state.year = yearSel.value; apply(); });
    journalSel.addEventListener('change', function(){ state.journal = journalSel.value; apply(); });
    pdfOnly.addEventListener('change', function(){ state.pdf = !!pdfOnly.checked; apply(); });
    starOnly.addEventListener('change', function(){ state.starOnly = !!starOnly.checked; apply(); });
    unreadOnly.addEventListener('change', function(){ state.unreadOnly = !!unreadOnly.checked; apply(); });
    renderFacetData();
  }

  /* facet DOM can be rebuilt on live refresh without re-binding controls */
  function renderFacetData(){
    clear(catList);
    if(!CATEGORIES.length){
      catList.appendChild(el('p', 'rail-empty', TOTAL_PAPERS ? '这些报告还没有分类' : '暂无可筛选的分类'));
    }else{
      CATEGORIES.forEach(function(c){
        var b = el('button', 'rail-opt');
        b.type = 'button';
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('data-cat', c.name);
        b.setAttribute('title', c.name + '（' + c.n + ' 篇）');
        var box = el('span', 'opt-box');
        box.setAttribute('aria-hidden', 'true');
        b.appendChild(box);
        b.appendChild(el('span', 'opt-name', c.name));
        b.appendChild(el('span', 'opt-n', String(c.n)));
        b.addEventListener('click', function(){ toggleCat(c.name); });
        catButtons[c.name] = b;
        catList.appendChild(b);
      });
    }

    clear(yearSel);
    yearSel.appendChild(new Option(TOTAL_PAPERS ? '全部年份' : '—', ''));
    YEARS.forEach(function(y){ yearSel.appendChild(new Option(y + '（' + YEAR_MAP[y] + '）', y)); });
    clear(journalSel);
    journalSel.appendChild(new Option(TOTAL_PAPERS ? '全部期刊' : '—', ''));
    JOURNALS.forEach(function(j){ journalSel.appendChild(new Option(clampLine(j.name, 40) + '（' + j.n + '）', j.name)); });
    renderTagChips();
    syncRailGroupCounts();
  }

  function syncRailGroupCounts(){
    var myActive = (state.starOnly ? 1 : 0) + (state.unreadOnly ? 1 : 0);
    if(groupMyN) groupMyN.textContent = myActive ? ('已选 ' + myActive) : '';
    if(groupCatsN) groupCatsN.textContent = CATEGORIES.length ? String(CATEGORIES.length) : '';
    if(groupMetaN) groupMetaN.textContent = YEARS.length || JOURNALS.length ? (YEARS.length + ' 年 · ' + JOURNALS.length + ' 刊') : '';
    if(groupTagsN) groupTagsN.textContent = TAGS.length ? String(TAGS.length) : '';
  }

  function renderTagChips(){
    clear(tagChips);
    tagButtons = Object.create(null);
    if(!TAGS.length){
      tagChips.appendChild(el('p', 'rail-empty', '这些报告还没有标签'));
      return;
    }
    var limit = 12;
    var visible = TAGS;
    if(!state.tagsOpen && TAGS.length > limit){
      var chosen = TAGS.filter(function(t){ return state.tags[t.name]; });
      var rest = TAGS.filter(function(t){ return !state.tags[t.name]; }).slice(0, Math.max(0, limit - chosen.length));
      visible = chosen.concat(rest);
    }
    visible.forEach(function(t){
      var b = el('button', 'tag-chip');
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('data-tag', t.name);
      b.setAttribute('title', t.name + '（' + t.n + ' 篇）');
      b.appendChild(el('span', 'lbl', t.name));
      b.addEventListener('click', function(){ toggleTag(t.name); });
      tagButtons[t.name] = b;
      tagChips.appendChild(b);
    });
    if(TAGS.length > limit){
      var more = el('button', 'rail-tag-more');
      more.type = 'button';
      more.textContent = state.tagsOpen ? '收起标签' : ('+ ' + Math.max(0, TAGS.length - visible.length) + ' 个标签');
      more.addEventListener('click', function(){
        state.tagsOpen = !state.tagsOpen;
        renderTagChips();
        syncRail();
      });
      tagChips.appendChild(more);
    }
  }

  function toggleCat(name){
    if(state.cats[name]) delete state.cats[name];
    else state.cats[name] = true;
    apply();
  }
  function toggleTag(name){
    if(state.tags[name]) delete state.tags[name];
    else state.tags[name] = true;
    apply();
  }

  function syncRail(){
    CATEGORIES.forEach(function(c){
      var b = catButtons[c.name];
      if(b) b.setAttribute('aria-pressed', state.cats[c.name] ? 'true' : 'false');
    });
    TAGS.forEach(function(t){
      var b = tagButtons[t.name];
      if(b) b.setAttribute('aria-pressed', state.tags[t.name] ? 'true' : 'false');
    });
    yearSel.value = state.year || '';
    journalSel.value = state.journal || '';
    pdfOnly.checked = !!state.pdf;
    pdfOnlyWrap.classList.toggle('is-checked', !!state.pdf);
    starOnly.checked = !!state.starOnly;
    unreadOnly.checked = !!state.unreadOnly;
    syncMyCounts();
    updateContinue();
    syncQuickBar();
    var root = document.documentElement;
    if(densityBtn) densityBtn.textContent = root.getAttribute('data-density') === 'compact' ? '紧凑' : '舒适';
    sortSel.value = state.sort;
    $$('.seg-btn').forEach(function(b){
      var on = b.getAttribute('data-view') === state.view;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var fc = filterCount();
    filterToggleN.textContent = String(fc);
    filterToggleN.hidden = fc === 0;
    filterToggle.setAttribute('aria-expanded', document.body.classList.contains('drawer-open') ? 'true' : 'false');
    filterToggle.setAttribute('aria-label', fc ? ('筛选与分类（已选 ' + fc + ' 项）') : '筛选与分类');
    resetBtn.disabled = activeCount() === 0;
    qInput.value = state.q;
    qClear.hidden = !state.q;
    syncRailGroupCounts();
  }

  function syncQuickBar(){
    quickBtns.forEach(function(b){
      var on = b.getAttribute('data-quick') === state.quick;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var tabs = $$('.mtab');
    tabs.forEach(function(b){
      var tab = b.getAttribute('data-tab');
      var on = (tab === 'library' && state.quick === 'all') ||
               (tab === 'unread' && state.quick === 'unread') ||
               (tab === 'star' && state.quick === 'star');
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* ========================================================= filtering */
  function baseFiltered(){
    var cats = catKeys(), tags = tagKeys();
    return PAPERS.filter(function(p){
      if(cats.length && !p.categories.some(function(c){ return state.cats[c]; })) return false;
      if(state.year && p.year !== state.year) return false;
      if(state.journal && p.journal !== state.journal) return false;
      if(tags.length && !p.tags.some(function(t){ return state.tags[t]; })) return false;
      if(state.pdf && !p.raw) return false;
      if(state.starOnly && !reading.stars[p.id]) return false;
      if(state.unreadOnly && reading.opened[p.id]) return false;
      if(state.quick === 'unread' && reading.opened[p.id]) return false;
      if(state.quick === 'star' && !reading.stars[p.id]) return false;
      if(state.quick === 'recent' && !reading.opened[p.id]) return false;
      return true;
    });
  }

  function sortPapers(list){
    var arr = list.slice();
    function byTitle(a, b){ return (a.title || '').localeCompare(b.title || '', 'zh-Hans-CN', { sensitivity: 'base', numeric: true }); }
    function byYearDesc(a, b){ return yearNum(b) - yearNum(a); }
    function byOpenedDesc(a, b){
      var ao = reading.opened[a.id] || '', bo = reading.opened[b.id] || '';
      if(ao === bo) return 0;
      if(!ao) return 1;
      if(!bo) return -1;
      return ao < bo ? 1 : -1;
    }
    if(state.quick === 'recent'){
      arr.sort(function(a, b){ return byOpenedDesc(a, b) || byYearDesc(a, b) || byTitle(a, b); });
      return arr;
    }
    function byUpdatedDesc(a, b){
      var av = a.updated || '', bv = b.updated || '';
      if(av === bv) return 0;
      if(!av) return 1;
      if(!bv) return -1;
      return av < bv ? 1 : -1;
    }
    if(state.sort === 'updated'){
      arr.sort(function(a, b){ return byUpdatedDesc(a, b) || byYearDesc(a, b) || byTitle(a, b); });
    }else if(state.sort === 'title'){
      arr.sort(function(a, b){ return byTitle(a, b) || byYearDesc(a, b); });
    }else if(state.sort === 'recent'){
      arr.sort(function(a, b){
        var ao = reading.opened[a.id] || '', bo = reading.opened[b.id] || '';
        if(ao !== bo){
          if(!ao) return 1;
          if(!bo) return -1;
          return ao < bo ? 1 : -1;
        }
        return byYearDesc(a, b) || byTitle(a, b);
      });
    }else{
      arr.sort(function(a, b){ return byYearDesc(a, b) || byUpdatedDesc(a, b) || byTitle(a, b); });
    }
    return arr;
  }

  /* ================================================= reading state + related */
  var LS_KEY = 'deepread-library-state';
  var reading = { opened: Object.create(null), stars: Object.create(null), last: null };
  var readingDirty = false;
  var RELATED = Object.create(null);
  var relatedOpen = false;

  function loadReading(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      if(!d || typeof d !== 'object') return;
      if(d.opened && typeof d.opened === 'object'){
        Object.keys(d.opened).forEach(function(k){
          if(typeof d.opened[k] === 'string') reading.opened[k] = d.opened[k];
        });
      }
      if(d.stars && typeof d.stars === 'object'){
        Object.keys(d.stars).forEach(function(k){ if(d.stars[k]) reading.stars[k] = true; });
      }
      if(d.last && typeof d.last === 'object' && typeof d.last.id === 'string' && d.last.id){
        reading.last = { id: d.last.id, at: typeof d.last.at === 'string' ? d.last.at : '' };
      }
    }catch(e){
      reading = { opened: Object.create(null), stars: Object.create(null), last: null };
    }
  }
  function saveReading(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({ opened: reading.opened, stars: reading.stars, last: reading.last }));
    }catch(e){}
  }
  function paperById(id){
    for(var i = 0; i < PAPERS.length; i++){ if(PAPERS[i].id === id) return PAPERS[i]; }
    return null;
  }
  function isOpened(p){ return !!(p && reading.opened[p.id]); }
  function isStarred(p){ return !!(p && reading.stars[p.id]); }
  function openedCount(){ return PAPERS.filter(isOpened).length; }
  function starredCount(){ return PAPERS.filter(isStarred).length; }
  function unreadCount(){ return PAPERS.filter(function(p){ return !isOpened(p); }).length; }

  function computeRelated(){
    var map = Object.create(null);
    PAPERS.forEach(function(p){
      var candidates = [];
      PAPERS.forEach(function(q){
        if(q === p) return;
        var sharedC = p.categories.filter(function(c){ return q.categories.indexOf(c) >= 0; });
        var sharedT = p.tags.filter(function(t){ return q.tags.indexOf(t) >= 0; });
        var score = sharedC.length * 2 + sharedT.length;
        if(score > 0) candidates.push({ paper: q, score: score, sharedC: sharedC, sharedT: sharedT });
      });
      candidates.sort(function(a, b){
        return (b.score - a.score) || (yearNum(b.paper) - yearNum(a.paper)) ||
               (a.paper.title || '').localeCompare(b.paper.title || '', 'zh-Hans-CN');
      });
      map[p.id] = candidates.slice(0, 6);
    });
    return map;
  }
  function relOf(p){ return (p && RELATED[p.id]) ? RELATED[p.id] : []; }

  function markOpened(p){
    if(!p) return;
    var now = new Date().toISOString();
    reading.opened[p.id] = now;
    reading.last = { id: p.id, at: now };
    readingDirty = true;
    saveReading();
    refreshReadingUI();
  }
  function updateContinue(){
    if(!continueBtn) return;
    var p = reading.last ? paperById(reading.last.id) : null;
    if(p && p.html){
      continueBtn.hidden = false;
      continueBtn._paper = p;
      continueTitleEl.textContent = clampLine(p.title_zh || p.title, 30);
      continueBtn.setAttribute('aria-label', '继续阅读：' + p.title);
      continueBtn.setAttribute('title', '继续阅读：' + p.title);

  }

    if(mobileTabs){

        contTab.disabled = !canCont;
        contTab.setAttribute('aria-disabled', canCont ? 'false' : 'true');
      }
    }
    syncRailGroupCounts();

  function refreshReadingUI(){
    $$('.list-row[data-id]').forEach(function(row){
      var lp = paperById(row.getAttribute('data-id'));

      var lstate = row.querySelector('.list-state');

    $$('.card[data-id]').forEach(function(card){

      if(flags){
        var chip = flags.querySelector('.media-read');
        if(reading.opened[p.id] && !chip) flags.appendChild(el('span', 'media-read', '已读'));
        else if(!reading.opened[p.id] && chip) flags.removeChild(chip);
      }
      var star = card.querySelector('.card-star');
      if(star){

        star.textContent = on ? '★' : '☆';
        star.setAttribute('aria-label', (on ? '取消星标：' : '星标：') + p.title);

  function switchViewerToRelated(q){
    if(!q || !q.html || !viewerState.paper) return;
    if(relatedOpen) relatedOpen = false; /* renderRelatedPanel re-opens; avoids stale click state */

  /* ============================================================ search */
  function sectionLower(sec){
    if(sec._l === null || sec._l === undefined) sec._l = sec.t.toLowerCase();
    return sec._l;
  }
  function countOccurrences(hay, needle){
    if(!needle) return 0;
    var n = 0, from = 0, idx;
    while(true){
      idx = hay.indexOf(needle, from);
      if(idx < 0) break;
      n++;
      from = idx + needle.length;
      if(n >= 500) break;
    }
    return n;
  }
  function searchPaper(p, needle){
    var ql = needle.toLowerCase();
    var total = 0;
    var metaHits = [];
    if(p._hay.indexOf(ql) >= 0){
      p._meta.forEach(function(f){
        var val = f[1];
        if(!val) return;
        var hay = val.toLowerCase();
        var idx = hay.indexOf(ql);
        if(idx < 0) return;
        var n = countOccurrences(hay, ql);
        total += n;
        if(metaHits.length < 3) metaHits.push({ label: f[0], text: val, idx: idx });
      });
    }
    var groups = [];
    p.text.forEach(function(sec){
      var hay = sectionLower(sec);
      if(hay.indexOf(ql) < 0) return;
      var from = 0, count = 0, positions = [];
      while(true){
        var idx = hay.indexOf(ql, from);
        if(idx < 0) break;
        count++;
        if(positions.length < 8) positions.push(idx);
        from = idx + ql.length;
        if(count >= 500) break;
      }
      if(count){ total += count; groups.push({ sec: sec, count: count, positions: positions }); }
    });
    if(!total) return null;
    groups.sort(function(a, b){ return b.count - a.count; });
    var snippets = [];
    var round = 0;
    while(snippets.length < 4 && round < 8){
      var added = false;
      for(var g = 0; g < groups.length && snippets.length < 4; g++){
        if(round < groups[g].positions.length){
          snippets.push({ sec: groups[g].sec, idx: groups[g].positions[round], count: groups[g].count });
          added = true;
        }
      }
      if(!added) break;
      round++;
    }
    if(snippets.length < 2 && metaHits.length){
      metaHits.slice(0, 2 - snippets.length).forEach(function(m){
        snippets.push({ label: m.label, text: m.text, idx: m.idx, count: 0 });
      });
    }
    return { paper: p, total: total, snippets: snippets };
  }
  function runSearch(list, needle){
    var results = [];
    var totalHits = 0;
    list.forEach(function(p){
      var r = searchPaper(p, needle);
      if(r){ results.push(r); totalHits += r.total; }
    });
    results.sort(function(a, b){
      return (b.total - a.total) || (yearNum(b.paper) - yearNum(a.paper)) || (a.paper.title || '').localeCompare(b.paper.title || '', 'zh-Hans-CN');
    });
    return { results: results, totalHits: totalHits };
  }

  /* ====================================================== build helpers */
  function actionLink(label, href, cls, extra){
    var a = el('a', 'card-link-mini' + (cls ? ' ' + cls : ''));
    a.href = href;
    if(extra && extra.target){ a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    if(extra && extra.download){ a.download = extra.download; a.setAttribute('download', extra.download); }
    a.appendChild(el('span', null, label));
    if(extra && extra.ext){
      var e = el('span', 'ext', '↗');
      e.setAttribute('aria-hidden', 'true');
      a.appendChild(e);
    }
    if(extra && extra.title) a.setAttribute('aria-label', extra.title);
    return a;
  }
  function authorLine(authors){
    if(!authors.length) return '';
    if(authors.length <= 3) return authors.join(', ');
    return authors.slice(0, 3).join(', ') + ' 等 ' + authors.length + ' 人';
  }
  function monogram(p){
    var src = (p.categories[0] || p.title || '?').replace(/\s+/g, ' ').trim();
    var chars = Array.from(src).slice(0, 2).join('');
    return chars.toUpperCase() || '·';
  }
  function countsRow(p){

    var star = el('button', 'card-star');
    star.type = 'button';
    star.setAttribute('aria-pressed', reading.stars[p.id] ? 'true' : 'false');

    /* body */

    }
    body.appendChild(el('h3', 'card-title', p.title));
    if(p.title_zh) body.appendChild(el('p', 'card-title-zh', p.title_zh));

    if(meta) body.appendChild(el('p', 'card-meta', meta));
    if(p.tldr) body.appendChild(el('p', 'card-tldr', p.tldr));
    if(p.tags.length){

    /* foot: primary 阅读 + RAW pdf links */

      read.appendChild(el('span', null, '阅读'));
      read.appendChild(el('span', 'arrow', '→'));
      read.addEventListener('click', function(e){
        e.preventDefault();

    }
    if(links.childNodes.length) foot.appendChild(links);

  /* ------------------------------------------------------------- snippets */
  function appendHighlighted(parent, text, query){
    var needle = (query || '').toLowerCase();
    if(!needle){ parent.appendChild(document.createTextNode(text)); return; }
    var hay = text.toLowerCase();
    var from = 0, idx;
    while(true){
      idx = hay.indexOf(needle, from);
      if(idx < 0){
        if(from < text.length) parent.appendChild(document.createTextNode(text.slice(from)));
        break;
      }
      if(idx > from) parent.appendChild(document.createTextNode(text.slice(from, idx)));
      parent.appendChild(el('mark', null, text.slice(idx, idx + needle.length)));
      from = idx + needle.length;
      if(from >= text.length) break;
    }
  }

  function snippetUrl(p, sec){
    var base = str(p.html).split('#')[0];
    if(!base) return '';
    return sec && sec.id ? (base + '#' + sec.id) : base;
  }

  function makeSnippet(p, snip, query){
    var canOpen = !!(p.html && snip.sec);
    var box = el(canOpen ? 'a' : 'div', 'snip');
    if(canOpen){
      box.href = snippetUrl(p, snip.sec);
      box.rel = 'noopener';
      box.addEventListener('click', function(e){
        if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        openViewer(p, snip.sec.id);
      });
    }
    var head = el('span', 'snip-head');
    head.appendChild(el('span', 'snip-sec', snip.sec ? (snip.sec.h || '全文章节') : ((snip.label || '摘要') + '命中')));
    if(canOpen) head.appendChild(el('span', 'snip-go', '阅读 ↗'));
    box.appendChild(head);

    var text = el('span', 'snip-text');
    var raw = str(snip.text !== undefined ? snip.text : (snip.sec ? snip.sec.t : ''));
    var qlen = query.length;
    var from = Math.max(0, (snip.idx || 0) - 50);
    var to = Math.min(raw.length, (snip.idx || 0) + qlen + 84);
    var seg = raw.slice(from, to).replace(/\s+/g, ' ');
    if(from > 0) seg = '…' + seg;
    if(to < raw.length && seg.charAt(seg.length - 1) !== '…') seg = seg + '…';
    appendHighlighted(text, seg, query);
    box.appendChild(text);
    return box;
  }

  /* ============================================================== viewer */
  var viewerState = { list: [], idx: -1, paper: null, lastFocus: null, loadToken: 0, fallbackTimer: null };

  function setLoading(on){
    viewerLoading.hidden = !on;
    if(on){
      viewerLoading.classList.remove('is-error');
      viewerHint.textContent = '离线单文件报告。若长时间不显示，请使用右上角的「在新标签打开」。';
    }
  }

  function showViewerAt(idx, sectionId){
    if(idx < 0 || idx >= viewerState.list.length) return;
    viewerState.idx = idx;
    var p = viewerState.list[idx];
    viewerState.paper = p;
    markOpened(p);
    viewerTitle.textContent = p.title;
    if(viewerCrumb){
      clear(viewerCrumb);
      viewerCrumb.appendChild(el('span', null, '文献库'));
      viewerCrumb.appendChild(el('span', 'sep', '/'));
      viewerCrumb.appendChild(el('span', null, p.categories[0] || '未分类'));
      viewerCrumb.appendChild(el('span', 'sep', '/'));
      viewerCrumb.appendChild(el('span', null, clampLine(p.title_zh || p.title, 22)));
    }
    var subParts = [];
    if(p.title_zh) subParts.push(p.title_zh);
    var meta = [p.journal, p.year].filter(Boolean).join(' · ');
    if(meta) subParts.push(meta);
    viewerSub.textContent = subParts.join('  ·  ') || '';
    viewerPos.textContent = (idx + 1) + ' / ' + viewerState.list.length;
    var canLoop = viewerState.list.length > 1;
    viewerPrev.disabled = !canLoop;
    viewerNext.disabled = !canLoop;
    viewerPrev.setAttribute('aria-label', canLoop ? '上一篇报告（循环）' : '上一篇报告');
    viewerNext.setAttribute('aria-label', canLoop ? '下一篇报告（循环）' : '下一篇报告');
    viewerPrev.setAttribute('title', canLoop ? '上一篇（循环）' : '上一篇');
    viewerNext.setAttribute('title', canLoop ? '下一篇（循环）' : '下一篇');

    var url = snippetUrl(p, sectionId ? { id: sectionId } : null);
    viewerOpenTab.href = url;
    if(p.raw){
      viewerRawView.hidden = false;
      viewerRawView.href = p.raw;
      viewerRawView.setAttribute('title', '在新标签查看原文 PDF：' + p.title);
    }else{
      viewerRawView.hidden = true;
      viewerRawView.removeAttribute('href');
    }
    refreshViewerRelated(p);

    var token = ++viewerState.loadToken;
    setLoading(true);
    if(viewerState.fallbackTimer) clearTimeout(viewerState.fallbackTimer);
    viewerFrame.onload = function(){
      if(token !== viewerState.loadToken) return;
      setLoading(false);
    };
    viewerFrame.title = '论文精读报告：' + p.title;
    viewerFrame.src = url;
    viewerState.fallbackTimer = setTimeout(function(){
      if(token !== viewerState.loadToken) return;
      if(viewerLoading.hidden) return;
      viewerLoading.classList.add('is-error');
      viewerHint.textContent = '报告载入较慢，或浏览器不允许在页面内嵌 file:// 文档。请使用右上角「在新标签打开」查看完整报告。';
    }, 9000);
  }

  function openViewer(paper, sectionId){
    if(!paper || !paper.html) return;
    var order = lastRendered.length ? lastRendered.slice() : sortPapers(baseFiltered());
    var list = order.filter(function(p){ return !!p.html; });
    var idx = list.indexOf(paper);
    if(idx < 0){ list = [paper].concat(list.filter(function(p){ return p !== paper; })); idx = 0; }
    viewerState.list = list;
    viewerState.lastFocus = document.activeElement;
    hidePeek();
    relatedOpen = false;
    if(viewerRelated) viewerRelated.hidden = true;
    viewer.hidden = false;
    document.documentElement.classList.add('viewer-open');
    showViewerAt(idx, sectionId || null);
    try{ viewerClose.focus(); }catch(e){}
  }

  function closeViewer(){
    if(viewer.hidden) return;
    if(document.fullscreenElement === viewer && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} }
    viewer.hidden = true;
    viewerState.loadToken++;
    viewerState.paper = null;
    if(viewerState.fallbackTimer){ clearTimeout(viewerState.fallbackTimer); viewerState.fallbackTimer = null; }
    viewerFrame.onload = null;
    viewerFrame.src = 'about:blank';
    document.documentElement.classList.remove('viewer-open');
    closeRelatedPanel();
    var back = viewerState.lastFocus;
    viewerState.lastFocus = null;
    if(readingDirty){
      readingDirty = false;
      if(state.sort === 'recent' || state.unreadOnly || state.quick === 'unread' || state.quick === 'recent'){
        apply({ skipHash: true });
      }
    }
    if(back && document.contains(back)){ try{ back.focus(); }catch(e){} }
  }

  function viewerStep(dir){
    var n = viewerState.list.length;
    if(n <= 1) return;
    var next = (viewerState.idx + dir + n) % n;
    showViewerAt(next, null);
  }

  function viewerFocusables(){
    return $$('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])', viewerShell)
      .filter(function(n){ return n.offsetParent !== null || n.tagName === 'IFRAME'; });
  }

  function initViewer(){
    viewerClose.addEventListener('click', closeViewer);
    viewerPrev.addEventListener('click', function(){ viewerStep(-1); });
    viewerNext.addEventListener('click', function(){ viewerStep(1); });
    viewerRelatedBtn.addEventListener('click', toggleRelatedPanel);
    viewerRelatedClose.addEventListener('click', closeRelatedPanel);
    initFullscreen();
    viewer.addEventListener('click', function(e){ if(e.target === viewer) closeViewer(); });
    document.addEventListener('keydown', function(e){
      if(viewer.hidden) return;
      if(e.key === 'Escape'){
        if(document.fullscreenElement){ e.preventDefault(); return; }
        e.preventDefault();
        if(relatedOpen){ closeRelatedPanel(); return; }
        closeViewer();
        return;
      }
      if(e.key === 'Tab'){
        var f = viewerFocusables();
        if(!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if(e.shiftKey && (document.activeElement === first || document.activeElement === viewerShell)){
          e.preventDefault(); last.focus();
        }else if(!e.shiftKey && document.activeElement === last){
          e.preventDefault(); first.focus();
        }
      }
    });
  }

  /* ============================================================== apply */
  function apply(opts){
    opts = opts || {};
    hidePeek();
    var query = state.q.trim();
    var filtered = baseFiltered();
    lastRendered = [];

    if(query){
      var payload = runSearch(filtered, query);
      lastRendered = payload.results.map(function(r){ return r.paper; });
      updateResultCount(payload.results.length, query, payload.totalHits);
      renderHits(payload, query);
    }else if(state.view === 'table'){
      var sortedT = sortPapers(filtered);
      lastRendered = sortedT;
      updateResultCount(sortedT.length, '');
      renderTable(sortedT);
    }else if(state.view === 'list'){
      var sortedL = sortPapers(filtered);
      lastRendered = sortedL;
      updateResultCount(sortedL.length, '');
      renderList(sortedL);
    }else{
      var sortedC = sortPapers(filtered);
      lastRendered = sortedC;
      updateResultCount(sortedC.length, '');
      renderCards(sortedC);
    }

    syncRail();
    renderActiveBar();
    if(!opts.skipHash) syncHash();
  }

  function setQuery(value){
    state.q = value === undefined || value === null ? '' : String(value);
    apply();
  }

  function resetAll(){
    state.q = '';
    state.cats = Object.create(null);
    state.tags = Object.create(null);
    state.year = '';
    state.journal = '';
    state.pdf = false;
    state.starOnly = false;
    state.unreadOnly = false;
    state.quick = 'all';
    state.tagsOpen = false;
    renderTagChips();
    apply();
  }

  /* ================================================================ hash */
  var hashTimer = null;
  function buildHash(){
    var p = new URLSearchParams();
    if(state.q.trim()) p.set('q', state.q.trim());
    catKeys().forEach(function(c){ p.append('cat', c); });
    tagKeys().forEach(function(t){ p.append('tag', t); });
    if(state.year) p.set('year', state.year);
    if(state.journal) p.set('journal', state.journal);
    if(state.pdf) p.set('pdf', '1');
    if(state.starOnly) p.set('star', '1');
    if(state.unreadOnly) p.set('unread', '1');
    if(state.quick !== 'all') p.set('quick', state.quick);
    if(state.view !== 'cards') p.set('view', state.view);
    if(state.sort !== 'year') p.set('sort', state.sort);
    var qs = p.toString();
    return qs ? '#' + qs : '';
  }
  function syncHash(){

        if(r.width <= 0 || r.height <= 0) continue;
        if(r.right <= vw + 1 && r.left >= -1) continue;

        var cls = (node.className && typeof node.className === 'string')

  function datasetIds(raw){
    var arr = (Array.isArray(raw) ? raw : (raw && Array.isArray(raw.papers) ? raw.papers : []));
    return arr.map(function(p){ return (p && p.id !== undefined && p.id !== null) ? String(p.id) : ''; });
  }
  function sigOfRaw(raw){
    var arr = (Array.isArray(raw) ? raw : (raw && Array.isArray(raw.papers) ? raw.papers : []));

  function changedCount(nextRaw){

    var added = 0, removed = 0;
    nextIds.forEach(function(id){

  function positionPeek(card){

      if(card){ peekCancelHide(); peekShowFor(card); }
    });
    document.addEventListener('focusout', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      if(t.closest('.card') || t.closest('.peek')){
        var rt = e.relatedTarget;
        if(rt && rt.closest && (rt.closest('.card') || rt.closest('.peek'))) return;
        peekHideSoon();
      }
    });
    peekEl.addEventListener('pointerenter', peekCancelHide);
    peekEl.addEventListener('pointerleave', peekHideSoon);
    peekEl.addEventListener('focusin', peekCancelHide);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && peekEl && !peekEl.hidden){ e.preventDefault(); hidePeek(); }
    });
    window.addEventListener('scroll', function(){ if(peekEl && !peekEl.hidden) peekEl.hidden = true; }, { passive: true });
    window.addEventListener('resize', function(){ if(peekEl && !peekEl.hidden) peekEl.hidden = true; });
  }

  /* ------------------------------------------------------- viewer fullscreen */
  function initFullscreen(){
    if(!viewerFull) return;
    var supported = !!(document.fullscreenEnabled && viewer.requestFullscreen);
    if(!supported){ viewerFull.hidden = true; return; }
    viewerFull.hidden = false;
    function paint(){
      var on = document.fullscreenElement === viewer;
      viewerFull.setAttribute('aria-pressed', on ? 'true' : 'false');
      viewerFull.setAttribute('aria-label', on ? '退出全屏' : '全屏阅读');
      viewerFull.setAttribute('title', on ? '退出全屏（Esc）' : '全屏阅读');
    }
    viewerFull.addEventListener('click', function(){
      if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); }
      else if(viewer.requestFullscreen){
        try{
          var pr = viewer.requestFullscreen();
          if(pr && pr.catch) pr.catch(function(){});
        }catch(e){}
      }
    });
    document.addEventListener('fullscreenchange', paint);
    paint();
  }

  /* ================================================================ boot */
  function boot(){
    loadReading();
    if(liveMode && LIVE && typeof LIVE === 'object'){
      if(str(LIVE.title)) TITLE = str(LIVE.title);
      if(str(LIVE.buildDate)) BUILD_DATE = str(LIVE.buildDate);
    }
    refreshDataset(RAW);
    currentSig = sigOfRaw(RAW);
    paintHeader();
    buildRail();
    initTheme();
    initFontToggle();
    initDensityToggle();
    initRailGroups();
    initQuickBar();
    initMobileTabs();
    initPeek();
    initViewer();
    bindEvents();
    var storedView = null;
    try{ storedView = localStorage.getItem('deepread-view'); }catch(e){}
    var st = parseHashState();
    adoptState(st);
    if(!/view=/.test(location.hash || '') && (storedView === 'cards' || storedView === 'table' || storedView === 'list')){
      state.view = storedView;
    }
    apply({ skipHash: true });
    syncRail();
    refreshReadingUI();
    initLive();
    if((location.hash || '') === '') syncHash();
    if(ERRORS.length){
      errBanner.hidden = false;
      errBanner.textContent = '页面遇到问题：' + ERRORS.join(' · ');
    }
    if(document.readyState === 'complete') setTimeout(writeQa, 200);
    else window.addEventListener('load', function(){ setTimeout(writeQa, 220); });
    window.__library = {
      state: state,
      apply: apply,
      writeQa: writeQa,
      openViewer: openViewer,
      closeViewer: closeViewer,
      viewer: viewerState,
      reading: reading,
      relatedOf: relOf,
      toggleStar: toggleStar,
      toggleRelated: toggleRelatedPanel,
      isLive: liveMode,
      refresh: manualRefresh,
      checkLive: function(){ fetchLibrary({ auto: true }); },
      applyPending: applyPending,
      liveInfo: liveInfo,
      setDensity: function(v){ setDensity(v); },
      setFont: function(v){ setFont(v); },
      setQuick: function(v){ setQuick(v); },
      getList: function(){ return lastRendered.slice(); }
    };
  }

  try{
    boot();
  }catch(err){
    ERRORS.push(String(err && err.message ? err.message : err));
    try{
      if(errBanner){ errBanner.hidden = false; errBanner.textContent = '文献库初始化失败：' + ERRORS[ERRORS.length - 1]; }
    }catch(e){}
    try{ writeQa(); }catch(e){}
  }
})();
</script>
