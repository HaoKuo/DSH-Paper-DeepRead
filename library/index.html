  /* ============================================================== events */
  var debounceTimer = null;
  var composing = false;
  function queueQuery(){
    if(debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function(){ debounceTimer = null; setQuery(qInput.value); }, 130);
  }
  function typingTarget(t){
    var tag = (t && t.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || (t && t.isContentEditable);
  }
  function bindEvents(){
    qInput.addEventListener('input', function(){
      qClear.hidden = !qInput.value;
      if(composing) return;
      queueQuery();
    });
    qInput.addEventListener('compositionstart', function(){ composing = true; });
    qInput.addEventListener('compositionend', function(){ composing = false; queueQuery(); });
    qInput.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){
        if(qInput.value){ e.preventDefault(); qInput.value = ''; setQuery(''); }
      }else if(e.key === 'Enter'){
        e.preventDefault();
        if(debounceTimer){ clearTimeout(debounceTimer); debounceTimer = null; }
        setQuery(qInput.value);
      }
    });
    qClear.addEventListener('click', function(){ setQuery(''); qInput.focus(); });

    $$('.seg-btn').forEach(function(b){
      b.addEventListener('click', function(){
        state.view = b.getAttribute('data-view');
        try{ localStorage.setItem(VIEW_KEY, state.view); }catch(e){}
        apply();
      });
    });
    sortSel.addEventListener('change', function(){ state.sort = sortSel.value; apply(); });
    resetBtn.addEventListener('click', resetAll);
    continueBtn.addEventListener('click', function(){
      var p = continueBtn._paper;
      if(p && p.html) openViewer(p);
    });
    if(syncBtn) syncBtn.addEventListener('click', manualRefresh);
    if(syncBadge) syncBadge.addEventListener('click', applyPending);
    filterToggle.addEventListener('click', function(){
      if(document.body.classList.contains('drawer-open')) closeRail();
      else openRail();
    });
    railClose.addEventListener('click', closeRail);
    railScrim.addEventListener('click', closeRail);

    document.addEventListener('keydown', function(e){
      if(e.defaultPrevented) return;
      if(e.key === 'Escape'){
        if(!viewer.hidden){ e.preventDefault(); closeViewer(); return; }
        if(document.body.classList.contains('drawer-open')){ e.preventDefault(); closeRail(); return; }
        return;
      }
      if(e.key === '/' && !typingTarget(e.target) && !e.metaKey && !e.ctrlKey && !e.altKey){
        e.preventDefault();
        qInput.focus();
        qInput.select();
      }
    });
    /* close the mobile drawer if the viewport grows past the breakpoint */
    if(window.matchMedia){
      var mq = window.matchMedia('(min-width: 901px)');
      var onChange = function(){ if(mq.matches) closeRail(); };
      if(mq.addEventListener) mq.addEventListener('change', onChange);
      else if(mq.addListener) mq.addListener(onChange);
    }
  }

  /* ============================================================ QA hook */
  function inScroller(node){
    for(var p = node.parentElement; p && p !== document.body; p = p.parentElement){
      var st = window.getComputedStyle(p);
      if(/auto|scroll/.test(st.overflowX || '')) return true;
    }
    return false;
  }
  function writeQa(){
    try{
      var vw = document.documentElement.clientWidth;
      var overflow = [];
      var all = $$('body *');
      for(var i = 0; i < all.length && overflow.length < 20; i++){
        var node = all[i];
        if(!node.getBoundingClientRect) continue;
        var r = node.getBoundingClientRect();
        if(r.width <= 0 || r.height <= 0) continue;
        if(r.right <= vw + 1 && r.left >= -1) continue;
        if(inScroller(node)) continue;
        if(node.hidden) continue;
        if(node.closest('.skip-link,.rail,.rail-scrim,.viewer')) continue;
        var cls = (node.className && typeof node.className === 'string')
          ? '.' + node.className.trim().split(/\s+/).slice(0, 2).join('.') : '';
        overflow.push(node.tagName.toLowerCase() + cls + ' right=' + Math.round(r.right) + ' left=' + Math.round(r.left));
      }
      var external = [];
      $$('[src]').forEach(function(node){
        var v = node.getAttribute('src') || '';
        if(/^https?:/i.test(v)) external.push(node.tagName.toLowerCase() + ': ' + v.slice(0, 100));
      });
      var qa = {
        title: TITLE,
        theme: document.documentElement.getAttribute('data-theme'),
        font: document.documentElement.getAttribute('data-font') || 'read',
        density: document.documentElement.getAttribute('data-density') || 'comfort',
        quick: state.quick,
        peekOpen: !!(peekEl && !peekEl.hidden),
        fullscreen: document.fullscreenElement === viewer,
        papers: TOTAL_PAPERS,
        cards: $$('.card').length,
        hits: $$('.hit').length,
        snippets: $$('.snip').length,
        marks: $$('mark').length,
        groups: 0,
        tableRows: $$('.lib-table tbody tr').length,
        query: state.q.trim(),
        view: state.view,
        count: lastCount,
        viewerOpen: !viewer.hidden,
        viewerSrc: viewerFrame.getAttribute('src') || '',
        railOpen: document.body.classList.contains('drawer-open'),
        stars: starredCount(),
        openedCount: openedCount(),
        lastId: reading.last ? reading.last.id : null,
        relatedOpen: relatedOpen,
        continueVisible: !!(continueBtn && !continueBtn.hidden),
        live: liveMode,
        lastSync: lastSync,
        autoUpdatesOffered: !!autoUpdatesOffered,
        pendingUpdates: pendingCount,
        overflowCount: overflow.length,
        overflow: overflow,
        externalResources: external,
        error: ERRORS.length ? String(ERRORS[0]) : null,
        hash: location.hash
      };
      var tag = document.getElementById('library-qa');
      if(!tag){
        tag = document.createElement('script');
        tag.type = 'application/json';
        tag.id = 'library-qa';
        document.head.appendChild(tag);
      }
      tag.textContent = JSON.stringify(qa).replace(/</g, '\\u003c');
    }catch(e){}
  }

  /* ============================================================ live sync */
  var LIVE = (typeof window.__LIBRARY_LIVE__ !== 'undefined') ? window.__LIBRARY_LIVE__ : false;
  var liveMode = !!LIVE;
  var currentSig = '';
  var lastSync = null;
  var fetching = false;
  var pendingRaw = null;
  var pendingCount = 0;
  var autoUpdatesOffered = false;
  var autoTimer = null;
  var syncFlashTimer = null;

  function hms(iso){
    var d = iso ? new Date(iso) : new Date();
    if(isNaN(d.getTime())) d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function setSyncChip(text, kind){
    if(!syncChip) return;
    syncChip.textContent = text;
    syncChip.className = 'sync-chip' + (kind ? ' is-' + kind : '');
  }
  function syncTimeChip(){
    setSyncChip('更新于 ' + hms(lastSync) + ' · ' + TOTAL_PAPERS + ' 篇', 'live');
  }
  function flashStatus(text){
    setSyncChip(text, 'live');
    if(syncFlashTimer) clearTimeout(syncFlashTimer);
    syncFlashTimer = setTimeout(function(){
      syncFlashTimer = null;
      syncTimeChip();
    }, 5000);
  }
  function setFetchingUI(on){
    if(syncBtn){
      syncBtn.disabled = !!on;
      syncBtn.classList.toggle('is-loading', !!on);
      syncBtn.setAttribute('aria-busy', on ? 'true' : 'false');
    }
    if(on) setSyncChip('同步中…', '');
  }
  function showBadge(text){ if(syncBadge){ syncBadge.textContent = text; syncBadge.hidden = false; } }
  function hideBadge(){ if(syncBadge) syncBadge.hidden = true; }
  function datasetIds(raw){
    var arr = (Array.isArray(raw) ? raw : (raw && Array.isArray(raw.papers) ? raw.papers : []));
    return arr.map(function(p){ return (p && p.id !== undefined && p.id !== null) ? String(p.id) : ''; });
  }
  function sigOfRaw(raw){
    var arr = (Array.isArray(raw) ? raw : (raw && Array.isArray(raw.papers) ? raw.papers : []));
    var ids = arr.map(function(p){ return (p && p.id !== undefined && p.id !== null) ? String(p.id) : ''; });
    var upd = (raw && raw.stats && typeof raw.stats === 'object') ? str(raw.stats.updated) : '';
    return arr.length + '|' + ids.join('\u0001') + '|' + upd;
  }
  function changedCount(nextRaw){
    var oldIds = Object.create(null);
    PAPERS.forEach(function(p){ oldIds[p.id] = true; });
    var nextIds = datasetIds(nextRaw);
    var nextSet = Object.create(null);
    var added = 0, removed = 0;
    nextIds.forEach(function(id){
      if(!id) return;
      nextSet[id] = true;
      if(!oldIds[id]) added++;
    });
    PAPERS.forEach(function(p){ if(!nextSet[p.id]) removed++; });
    return Math.max(1, added + removed);
  }
  function pruneFilters(){
    Object.keys(state.cats).forEach(function(k){ if(!CAT_MAP[k]) delete state.cats[k]; });
    Object.keys(state.tags).forEach(function(k){ if(!TAG_MAP[k]) delete state.tags[k]; });
    if(state.year && !YEAR_MAP[state.year]) state.year = '';
    if(state.journal && !JOURNAL_MAP[state.journal]) state.journal = '';
  }
  function applyLiveData(data, opts){
    var y = window.scrollY || window.pageYOffset || 0;
    var wasViewerOpen = !viewer.hidden;
    var currentId = viewerState.paper ? viewerState.paper.id : null;
    pendingRaw = null;
    pendingCount = 0;
    hideBadge();
    refreshDataset(data);
    currentSig = sigOfRaw(RAW);
    pruneFilters();
    paintHeader();
    renderFacetData();
    var np = currentId ? paperById(currentId) : null;
    if(wasViewerOpen){
      if(!np) closeViewer();
      else {
        viewerState.paper = np;
        if(relatedOpen) refreshViewerRelated(np);
      }
    }
    apply();
    syncRail();
    refreshReadingUI();
    lastSync = new Date().toISOString();
    if(opts && opts.initial) syncTimeChip();
    else flashStatus('已更新 · ' + TOTAL_PAPERS + ' 篇');
    if(y) requestAnimationFrame(function(){ window.scrollTo(0, y); });
  }
  function onFetchError(){
    fetching = false;
    setFetchingUI(false);
    setSyncChip('离线快照', 'error');
  }
  function fetchLibrary(opts){
    opts = opts || {};
    if(fetching) return;
    if(typeof window.fetch !== 'function'){ onFetchError(); return; }
    fetching = true;
    setFetchingUI(true);
    var p;
    try{ p = window.fetch('/api/library', { cache: 'no-store' }); }
    catch(e){ onFetchError(); return; }
    Promise.resolve(p).then(function(resp){
      if(!resp || !resp.ok) throw new Error('HTTP ' + (resp ? resp.status : '?'));
      return resp.json();
    }).then(function(data){
      if(!data || typeof data !== 'object' || !Array.isArray(data.papers)) throw new Error('bad payload');
      fetching = false;
      setFetchingUI(false);
      if(sigOfRaw(data) === currentSig){
        lastSync = new Date().toISOString();
        syncTimeChip();
        return;
      }
      if(opts.auto) autoUpdatesOffered = true;
      if(opts.auto && !viewer.hidden){
        pendingRaw = data;
        pendingCount = changedCount(data);
        showBadge('有 ' + pendingCount + ' 篇更新 · 刷新');
        return;
      }
      applyLiveData(data, opts);
    }).catch(function(){ onFetchError(); });
  }
  function manualRefresh(){ fetchLibrary({ manual: true }); }
  function applyPending(){
    if(!pendingRaw) return;
    var data = pendingRaw;
    applyLiveData(data, { manual: true });
  }
  function initLive(){
    if(!liveMode){
      if(syncWrap) syncWrap.hidden = true;
      if(staticHint) staticHint.hidden = false;
      return;
    }
    if(syncWrap) syncWrap.hidden = false;
    if(staticHint) staticHint.hidden = true;
    setSyncChip('同步中…', '');
    fetchLibrary({ initial: true });
    autoTimer = setInterval(function(){
      fetchLibrary({ auto: true });
    }, 20000);
  }
  function liveInfo(){
    return { live: liveMode, lastSync: lastSync, fetching: fetching, pending: pendingCount, autoUpdatesOffered: autoUpdatesOffered };
  }

  /* ========================================= preferences / quick / peek / tabs */
  var FONT_KEY = 'deepread-font';
  var DENSITY_KEY = 'deepread-density';
  var VIEW_KEY = 'deepread-view';
  var RAIL_GROUPS_KEY = 'deepread-rail-groups';

  function paintFontBtn(){
    if(!fontToggle) return;
    var mono = document.documentElement.getAttribute('data-font') === 'mono';
    fontToggle.setAttribute('aria-pressed', mono ? 'true' : 'false');
    fontToggle.setAttribute('aria-label', mono ? '切换阅读字体' : '切换等宽字体');
    fontToggle.setAttribute('title', mono ? '等宽字体（点击切回阅读字体）' : '阅读字体（点击切换等宽字体）');
  }
  function setFont(mode){
    var next = mode === 'mono' ? 'mono' : 'read';
    document.documentElement.setAttribute('data-font', next);
    try{ localStorage.setItem(FONT_KEY, next); }catch(e){}
    paintFontBtn();
  }
  function initFontToggle(){
    if(!fontToggle) return;
    fontToggle.addEventListener('click', function(){
      setFont(document.documentElement.getAttribute('data-font') === 'mono' ? 'read' : 'mono');
    });
    paintFontBtn();
  }

  function paintDensityBtn(){
    if(!densityBtn) return;
    var compact = document.documentElement.getAttribute('data-density') === 'compact';
    densityBtn.textContent = compact ? '紧凑' : '舒适';
    densityBtn.setAttribute('aria-pressed', compact ? 'true' : 'false');
    densityBtn.setAttribute('title', (compact ? '当前紧凑密度' : '当前舒适密度') + '，点击切换');
  }
  function setDensity(mode){
    var next = mode === 'compact' ? 'compact' : 'comfort';
    document.documentElement.setAttribute('data-density', next);
    try{ localStorage.setItem(DENSITY_KEY, next); }catch(e){}
    paintDensityBtn();
  }
  function initDensityToggle(){
    if(!densityBtn) return;
    densityBtn.addEventListener('click', function(){
      setDensity(document.documentElement.getAttribute('data-density') === 'compact' ? 'comfort' : 'compact');
    });
    paintDensityBtn();
  }

  function initRailGroups(){
    var details = $$('.rail-acc');
    if(!details.length) return;
    var stored = null;
    try{ stored = JSON.parse(localStorage.getItem(RAIL_GROUPS_KEY) || 'null'); }catch(e){}
    var dense = CATEGORIES.length > 6 || TAGS.length > 6;
    var defaults = { my:true, cats:true, meta:!dense, tags:!dense };
    details.forEach(function(dt){
      var key = dt.getAttribute('data-group');
      var open = (stored && typeof stored === 'object' && typeof stored[key] === 'boolean') ? stored[key] : defaults[key];
      dt.open = !!open;
      dt.addEventListener('toggle', function(){
        var map = {};
        details.forEach(function(x){ map[x.getAttribute('data-group')] = !!x.open; });
        try{ localStorage.setItem(RAIL_GROUPS_KEY, JSON.stringify(map)); }catch(e){}
      });
    });
  }

  function setQuick(value){
    var valid = { all:1, unread:1, star:1, recent:1 };
    state.quick = valid[value] ? value : 'all';
    apply();
  }
  function initQuickBar(){
    if(!quickBar) return;
    quickBtns.forEach(function(b){
      b.addEventListener('click', function(){
        var target = b.getAttribute('data-quick') || 'all';
        if(target === 'all'){ setQuick('all'); return; }
        setQuick(state.quick === target ? 'all' : target);
      });
    });
  }
  function initMobileTabs(){
    if(!mobileTabs) return;
    $$('.mtab', mobileTabs).forEach(function(b){
      b.addEventListener('click', function(){
        var tab = b.getAttribute('data-tab');
        if(tab === 'library'){ setQuick('all'); }
        else if(tab === 'unread'){ setQuick(state.quick === 'unread' ? 'all' : 'unread'); }
        else if(tab === 'star'){ setQuick(state.quick === 'star' ? 'all' : 'star'); }
        else if(tab === 'continue'){
          var p = reading.last ? paperById(reading.last.id) : null;
          if(p && p.html) openViewer(p);
        }
      });
    });
  }

  /* ------------------------------------------------------------- quick peek */
  var peekHideTimer = null;
  function canPeek(){
    return state.view === 'cards' && !!(window.matchMedia && window.matchMedia('(min-width: 1024px)').matches);
  }
  function peekCancelHide(){
    if(peekHideTimer){ clearTimeout(peekHideTimer); peekHideTimer = null; }
  }
  function peekHideSoon(){
    if(!peekEl) return;
    peekCancelHide();
    peekHideTimer = setTimeout(function(){
      peekHideTimer = null;
      if(peekEl && !peekEl.matches(':hover')) peekEl.hidden = true;
    }, 160);
  }
  function hidePeek(){ if(peekEl) peekEl.hidden = true; peekCancelHide(); }
  function renderPeek(p){
    clear(peekEl);
    var top = el('div', 'peek-top');
    top.appendChild(el('div', 'peek-title', p.title));
    var close = el('button', 'peek-close', '×');
    close.type = 'button';
    close.setAttribute('aria-label', '关闭快速预览');
    close.addEventListener('click', hidePeek);
    top.appendChild(close);
    peekEl.appendChild(top);
    if(p.title_zh) peekEl.appendChild(el('p', 'peek-zh', p.title_zh));
    var meta = [p.journal, p.year, p.updated ? ('更新 ' + p.updated) : ''].filter(Boolean).join(' · ');
    if(meta) peekEl.appendChild(el('p', 'peek-meta', meta));
    if(p.tldr) peekEl.appendChild(el('p', 'peek-tldr', p.tldr));
    var chips = el('div', 'peek-chips');
    p.categories.forEach(function(c){ chips.appendChild(el('span', 'cat-chip ' + catClass(c), c)); });
    p.tags.forEach(function(t){ chips.appendChild(el('span', 'tchip', t)); });
    if(chips.childNodes.length) peekEl.appendChild(chips);
    var counts = el('div', 'peek-counts');
    [[p.figures, '图表'], [p.claims, '证据'], [p.sectionsN, '章节']].forEach(function(pair){
      if(pair[0] === null) return;
      var sp = el('span');
      sp.appendChild(el('b', null, String(pair[0])));
      sp.appendChild(document.createTextNode(' ' + pair[1]));
      counts.appendChild(sp);
    });
    if(counts.childNodes.length) peekEl.appendChild(counts);
    var acts = el('div', 'peek-acts');
    if(p.html){
      var read = el('button', 'btn-read', '阅读');
      read.type = 'button';
      read.setAttribute('aria-label', '阅读报告：' + p.title);
      read.addEventListener('click', function(){ hidePeek(); openViewer(p); });
      acts.appendChild(read);
    }
    if(p.raw) acts.appendChild(actionLink('查看原文', p.raw, null, { target: true, ext: true, title: '在新标签查看原文 PDF：' + p.title }));
    if(acts.childNodes.length) peekEl.appendChild(acts);
  }
  function positionPeek(card){
    if(!peekEl || !card) return;
    var rect = card.getBoundingClientRect();
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var w = peekEl.offsetWidth || 340, h = peekEl.offsetHeight || 320;
    var left = rect.right + 12;
    if(left + w > vw - 12) left = rect.left - w - 12;
    if(left < 12) left = Math.max(12, Math.min(vw - w - 12, rect.left));
    var top = Math.max(12, Math.min(vh - h - 12, rect.top));
    peekEl.style.left = Math.round(left) + 'px';
    peekEl.style.top = Math.round(top) + 'px';
  }
  function peekShowFor(card){
    if(!canPeek() || !card || !peekEl) return;
    var p = paperById(card.getAttribute('data-id'));
    if(!p) return;
    renderPeek(p);
    peekEl.hidden = false;
    peekEl.style.visibility = 'hidden';
    positionPeek(card);
    peekEl.style.visibility = '';
    peekEl.scrollTop = 0;
  }
  function initPeek(){
    if(!peekEl) return;
    document.addEventListener('pointerover', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      if(t.closest('.peek')){ peekCancelHide(); return; }
      if(!canPeek()){ hidePeek(); return; }
      var card = t.closest('.card');
      if(card){ peekCancelHide(); peekShowFor(card); }
    });
    document.addEventListener('pointerout', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      var card = t.closest('.card'), peek = t.closest('.peek');
      if(!card && !peek) return;
      var rt = e.relatedTarget;
      if(rt && rt.closest){
        if(card && rt.closest('.card') === card) return;
        if(rt.closest('.peek')) return;
      }
      peekHideSoon();
    });
    document.addEventListener('focusin', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      if(t.closest('.peek')){ peekCancelHide(); return; }
      if(!canPeek()) return;
      var card = t.closest('.card');
      if(card){ peekCancelHide(); peekShowFor(card); }
    });
    document.addEventListener('focusout', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      if(t.closest('.card') || t.closest('.peek')){
        var rt = e.relatedTarget;
        if(rt && rt.closest && (rt.closest('.card') || rt.closest('.peek'))) return;
        peekHideSoon();
      }
    });
    peekEl.addEventListener('pointerenter', peekCancelHide);
    peekEl.addEventListener('pointerleave', peekHideSoon);
    peekEl.addEventListener('focusin', peekCancelHide);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && peekEl && !peekEl.hidden){ e.preventDefault(); hidePeek(); }
    });
    window.addEventListener('scroll', function(){ if(peekEl && !peekEl.hidden) peekEl.hidden = true; }, { passive: true });
    window.addEventListener('resize', function(){ if(peekEl && !peekEl.hidden) peekEl.hidden = true; });
  }

  /* ------------------------------------------------------- viewer fullscreen */
  function initFullscreen(){
    if(!viewerFull) return;
    var supported = !!(document.fullscreenEnabled && viewer.requestFullscreen);
    if(!supported){ viewerFull.hidden = true; return; }
    viewerFull.hidden = false;
    function paint(){
      var on = document.fullscreenElement === viewer;
      viewerFull.setAttribute('aria-pressed', on ? 'true' : 'false');
      viewerFull.setAttribute('aria-label', on ? '退出全屏' : '全屏阅读');
      viewerFull.setAttribute('title', on ? '退出全屏（Esc）' : '全屏阅读');
    }
    viewerFull.addEventListener('click', function(){
      if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); }
      else if(viewer.requestFullscreen){
        try{
          var pr = viewer.requestFullscreen();
          if(pr && pr.catch) pr.catch(function(){});
        }catch(e){}
      }
    });
    document.addEventListener('fullscreenchange', paint);
    paint();
  }

  /* ================================================================ boot */
  function boot(){
    loadReading();
    if(liveMode && LIVE && typeof LIVE === 'object'){
      if(str(LIVE.title)) TITLE = str(LIVE.title);
      if(str(LIVE.buildDate)) BUILD_DATE = str(LIVE.buildDate);
    }
    refreshDataset(RAW);
    currentSig = sigOfRaw(RAW);
    paintHeader();
    buildRail();
    initTheme();
    initFontToggle();
    initDensityToggle();
    initRailGroups();
    initQuickBar();
    initMobileTabs();
    initPeek();
    initViewer();
    bindEvents();
    var storedView = null;
    try{ storedView = localStorage.getItem('deepread-view'); }catch(e){}
    var st = parseHashState();
    adoptState(st);
    if(!/view=/.test(location.hash || '') && (storedView === 'cards' || storedView === 'table' || storedView === 'list')){
      state.view = storedView;
    }
    apply({ skipHash: true });
    syncRail();
    refreshReadingUI();
    initLive();
    if((location.hash || '') === '') syncHash();
    if(ERRORS.length){
      errBanner.hidden = false;
      errBanner.textContent = '页面遇到问题：' + ERRORS.join(' · ');
    }
    if(document.readyState === 'complete') setTimeout(writeQa, 200);
    else window.addEventListener('load', function(){ setTimeout(writeQa, 220); });
    window.__library = {
      state: state,
      apply: apply,
      writeQa: writeQa,
      openViewer: openViewer,
      closeViewer: closeViewer,
      viewer: viewerState,
      reading: reading,
      relatedOf: relOf,
      toggleStar: toggleStar,
      toggleRelated: toggleRelatedPanel,
      isLive: liveMode,
      refresh: manualRefresh,
      checkLive: function(){ fetchLibrary({ auto: true }); },
      applyPending: applyPending,
      liveInfo: liveInfo,
      setDensity: function(v){ setDensity(v); },
      setFont: function(v){ setFont(v); },
      setQuick: function(v){ setQuick(v); },
      getList: function(){ return lastRendered.slice(); }
    };
  }

  try{
    boot();
  }catch(err){
    ERRORS.push(String(err && err.message ? err.message : err));
    try{
      if(errBanner){ errBanner.hidden = false; errBanner.textContent = '文献库初始化失败：' + ERRORS[ERRORS.length - 1]; }
    }catch(e){}
    try{ writeQa(); }catch(e){}
  }
})();
</script>
