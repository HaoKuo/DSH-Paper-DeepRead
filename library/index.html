<!--
================================================================================
  PAPER-DEEPREAD-HTML · LIBRARY / INDEX PAGE SHELL  (v2 — library-app layout)
================================================================================
  One self-contained index for MANY paper deep-read reports: compact app header,
  left sticky filter rail, dense card/table views, full-text search and an
  in-page iframe reader for the report HTML. All CSS and vanilla JS are inline.
  No external fonts, no CDN, no network requests; opens from file://, offline.

  --------------------------------------------------------------------------
  BUILD CONTRACT — the builder replaces each double-brace token exactly ONCE
  (each token appears exactly once below; do not add copies):
    LIBRARY_TITLE token -> plain text. Sits in a hidden div#libraryTitleSrc;
                          JS hydrates <h1>, <title>, and the QA summary.
    BUILD_DATE token    -> plain text build date ("2026-10-28"). Hidden
                          div#buildDateSrc; appears in the header stats/footer.
    LIBRARY_VERSION token -> plain text version ("1.2.0"). Lives in
                          <meta name="library-version">; JS also shows it as the
                          header chip, the footer badge and in <title>.
    LIBRARY_JSON token  -> raw JSON inside the script#library-data element
                          (type="application/json"). Schema (all best-effort):
                            { "papers": [ {
                                id, dir, html, raw, raw_name,
                                title, title_zh, journal, year, authors[], doi,
                                tags[], tldr, metrics[], figures, claims, sections,
                                categories[], updated, thumb, text[{id,h,t}],
                                readme, pdf            (both ignored by the UI)
                              } ],
                              "stats": {n, years[], journals, categories, updated} }
                          IMPORTANT: when serialising the JSON, escape any "<"
                          as \u003c so stray "</script>" text in a paper cannot
                          terminate the data element. (json.dumps then
                          .replace("<", "\\u003c") stays valid JSON.)

  LINKS: paper links are relative paths with spaces; they are assigned through
  DOM properties so the browser encodes them. Card clicks open the in-page
  iframe reader (report HTML); the "在新标签打开" links are the fallback when a
  browser refuses to frame a file:// document. RAW-*.pdf links: 查看原文 opens
  in a new tab. README is not linked.

  QA HOOK: on load + 250ms the script#library-qa element (application/json)
  receives {title, theme, papers, cards, hits, snippets, marks, groups,
  tableRows, query, view, count, viewerOpen, viewerSrc, railOpen, stars,
  openedCount, lastId, relatedOpen, overflowCount, overflow[],
  externalResources[], error, hash}. It is also callable through
  window.__library.writeQa().

  LIVE MODE (optional): when a local stdlib server injects
  window.__LIBRARY_LIVE__ (true, or {title, buildDate}) into <head>, this page
  fetches GET /api/library (cache: no-store), re-renders in place while keeping
  query/filters/sort/view, polls a cheap signature every 20 s, defers updates
  while the reader is open, and falls back to the embedded snapshot on errors.
  A plain file:// snapshot never fetches; it shows "静态快照" instead.

  PREFERENCES (client-side): localStorage "deepread-theme" (light/dark),
  "deepread-font" (read|mono), "deepread-density" (comfort|compact),
  "deepread-view" (cards|table|list) and "deepread-rail-groups" (rail accordions)
  are applied before first paint where possible; ?theme= / ?font= override.

  READING STATE (client-side only): localStorage "deepread-library-state" holds
  {opened:{id:ISO}, stars:{id:true}, last:{id,at}}; missing/corrupt JSON is
  tolerated. Related papers are computed in the browser from category overlaps
  (weight 2) + tag overlaps (weight 1) — the builder injects no extra data.
================================================================================
-->
<script>
/* Theme bootstrap before first paint (avoids FOUC):
   ?theme= > localStorage > OS preference. Shared key with the report shell so the
   report loaded inside the reader follows the same preference on next open. */
(function(){try{
  var sp=null; try{ sp=new URLSearchParams(location.search); }catch(e){}
  var q=sp?sp.get('theme'):null;
  var s=null; try{s=localStorage.getItem('deepread-theme');}catch(e){}
  var t=(q==='dark'||q==='light')?q:(s||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));
  document.documentElement.setAttribute('data-theme',t);

  var f=sp?sp.get('font'):null;
  var fs=null; try{fs=localStorage.getItem('deepread-font');}catch(e){}
  var font=(f==='mono'||f==='read')?f:(fs==='mono'?'mono':'read');
  document.documentElement.setAttribute('data-font',font);

  var dn=null; try{dn=localStorage.getItem('deepread-density');}catch(e){}
  document.documentElement.setAttribute('data-density',dn==='compact'?'compact':'comfort');
}catch(e){
  document.documentElement.setAttribute('data-theme','light');
  document.documentElement.setAttribute('data-font','read');
  document.documentElement.setAttribute('data-density','comfort');
}})();
</script>

/* ==========================================================================
   1. RESET + BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  overflow-x:clip;
  scrollbar-gutter:stable;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.65;
  font-synthesis-weight:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img,svg{max-width:100%}
img{height:auto}
button{font:inherit;color:inherit}
a{color:var(--teal-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--teal) 48%,transparent)}
a:hover{text-decoration-color:var(--teal)}
::selection{background:var(--amber-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.hidden{display:none!important}
.nw{white-space:nowrap}

.skip-link{
  position:fixed;left:14px;top:-60px;z-index:900;
  padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--bg);
  font-size:13px;text-decoration:none;transition:top .18s ease;
}
.skip-link:focus{top:12px}
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
html.viewer-open,html.viewer-open body,
html.drawer-lock,html.drawer-lock body{overflow:hidden}

/* ==========================================================================
   2. COMPACT APP HEADER (title + inline stats + search + theme)
   ========================================================================== */
.app-head{
  position:sticky;top:0;z-index:120;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  backdrop-filter:blur(14px) saturate(1.1);
  border-bottom:1px solid var(--rule-soft);
}
.app-head::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:1;
  background:linear-gradient(90deg,var(--teal),transparent 38%,transparent 62%,var(--amber));
  opacity:.7;
}
.head-main{
  max-width:var(--maxw);margin:0 auto;
  padding:9px clamp(16px,3vw,32px);
  display:flex;align-items:center;gap:18px;min-height:var(--head-h);
}
.head-brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 1 auto}
.brand-mark{
  width:32px;height:32px;flex:none;display:grid;place-items:center;
  border-radius:9px;background:var(--navy);color:var(--bg);
}
.brand-mark svg{width:18px;height:18px;display:block}
.brand-text{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.brand-row{display:flex;align-items:center;gap:9px;min-width:0}
.brand-row h1{
  margin:0;font-family:var(--font-serif);
  font-size:clamp(17px,1.5vw,20px);font-weight:600;letter-spacing:-.005em;
  color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32ch;
}
.brand-ver{
  flex:none;display:inline-flex;align-items:center;white-space:nowrap;
  font-family:var(--font-mono);font-size:10.3px;font-weight:600;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
  color:var(--teal-ink);background:var(--teal-soft);
  border:1px solid color-mix(in srgb,var(--teal) 26%,transparent);
  border-radius:999px;padding:1.5px 7px;
}
.head-stats{
  margin:2px 0 0;
  font-family:var(--font-mono);font-size:10.3px;line-height:1.5;
  letter-spacing:.01em;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60ch;
  font-variant-numeric:tabular-nums;
}
.head-stats b{color:var(--ink-2);font-weight:600}
.head-stats .sep{opacity:.45;padding:0 4px}

.head-search{
  display:flex;align-items:center;gap:8px;min-width:0;
  flex:1 1 280px;max-width:520px;margin-left:auto;
  height:38px;padding:0 9px 0 12px;
  border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
.head-search:focus-within{
  border-color:var(--teal);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 14%,transparent);
  background:var(--surface);
}
.search-ico{flex:none;width:15px;height:15px;color:var(--ink-3);display:block}
.head-search:focus-within .search-ico{color:var(--teal-ink)}
#q{
  flex:1 1 auto;min-width:0;height:100%;
  appearance:none;-webkit-appearance:none;border:0;background:transparent;outline:none;
  color:var(--ink);font-family:var(--font-sans);font-size:13.5px;letter-spacing:.005em;
}
#q::placeholder{color:var(--ink-3);opacity:1}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search-kbd{
  flex:none;display:inline-grid;place-items:center;
  min-width:20px;height:20px;padding:0 5px;
  border:1px solid var(--rule);border-radius:5px;
  font-family:var(--font-mono);font-size:10px;line-height:1;color:var(--ink-3);
  background:var(--surface-2);
}
.search-clear{
  flex:none;appearance:none;cursor:pointer;
  width:23px;height:23px;border:1px solid var(--rule);border-radius:50%;
  display:grid;place-items:center;background:var(--surface-2);
  color:var(--ink-2);font-size:13px;line-height:1;
}
.search-clear:hover{background:var(--teal-soft);color:var(--teal-ink);border-color:var(--teal)}
.theme-toggle{
  flex:none;appearance:none;cursor:pointer;
  width:38px;height:38px;display:grid;place-items:center;
  border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);color:var(--ink-2);
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.theme-toggle:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.theme-toggle svg{width:16px;height:16px;display:block}
.theme-toggle .i-moon{display:none}
html[data-theme="dark"] .theme-toggle .i-sun{display:none}
html[data-theme="dark"] .theme-toggle .i-moon{display:block}

/* ==========================================================================
   3. LAYOUT: sticky rail + main column
   ========================================================================== */
.app-layout{
  max-width:var(--maxw);margin:0 auto;
  padding:clamp(18px,2.4vw,26px) clamp(16px,3vw,32px) 8px;
  display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);
  gap:clamp(20px,2.6vw,34px);align-items:start;
}
.rail{
  position:sticky;top:calc(var(--head-h) + 18px);
  align-self:start;min-width:0;
  max-height:calc(100vh - var(--head-h) - 36px);
  overflow-y:auto;overscroll-behavior:contain;
  padding-right:6px;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:var(--rule);border-radius:99px}
.rail-head{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.rail-h{
  margin:0;font-family:var(--font-mono);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
}
.rail-clear{
  margin-left:auto;appearance:none;cursor:pointer;border:0;background:transparent;
  padding:3px 4px;border-radius:5px;
  font-size:11px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;
}
.rail-clear:hover{color:var(--bad)}
.rail-clear[disabled]{opacity:.4;cursor:not-allowed;text-decoration:none}
.rail-close{
  display:none;appearance:none;cursor:pointer;
  width:28px;height:28px;border:1px solid var(--rule);border-radius:8px;
  background:var(--surface);color:var(--ink-2);font-size:15px;line-height:1;
}
.rail-close:hover{background:var(--surface-2);color:var(--ink)}

.rail-group{margin:0 0 16px;padding:0 0 15px;border-bottom:1px dashed var(--rule-soft)}
.rail-group:last-of-type{border-bottom:0}
.rail-title{
  margin:0 0 8px;
  font-family:var(--font-mono);font-size:9.8px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
.rail-list{display:flex;flex-direction:column;gap:1px}
.rail-opt{
  appearance:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  width:100%;min-width:0;padding:4px 6px;margin:0 -6px;
  border:0;border-radius:7px;background:transparent;
  text-align:left;font-size:12.5px;line-height:1.5;color:var(--ink-2);
  transition:background .14s ease,color .14s ease;
}
.rail-opt:hover{background:var(--surface-2);color:var(--ink)}
.opt-box{
  flex:none;width:13px;height:13px;border:1px solid var(--rule);border-radius:4px;
  background:var(--surface);display:grid;place-items:center;
  transition:background .14s ease,border-color .14s ease;
}
.opt-box::after{content:"";width:6px;height:3px;border-left:1.6px solid transparent;border-bottom:1.6px solid transparent;transform:rotate(-45deg) translateY(-1px)}
.opt-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-n{flex:none;font-family:var(--font-mono);font-size:9.8px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail-opt[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.rail-opt[aria-pressed="true"] .opt-box{background:var(--teal);border-color:var(--teal)}
.rail-opt[aria-pressed="true"] .opt-box::after{border-color:var(--surface)}
.rail-opt[aria-pressed="true"] .opt-n{color:var(--teal-ink);opacity:.75}
.rail-empty{margin:2px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-3)}
.rail-select{
  width:100%;height:31px;padding:0 7px;
  border:1px solid var(--rule);border-radius:8px;background:var(--surface);
  color:var(--ink);font-family:var(--font-sans);font-size:12.5px;line-height:1;
  cursor:pointer;
}
.rail-select:hover{border-color:var(--ink-3)}
.rail-more{margin:0 0 14px;border-bottom:1px dashed var(--rule-soft);padding-bottom:12px}
.rail-more summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
  padding:3px 0;font-size:12.5px;color:var(--ink-2);
}
.rail-more summary::-webkit-details-marker{display:none}
.rail-more summary::after{
  content:"▾";margin-left:auto;font-size:9px;color:var(--ink-3);
  transition:transform .15s ease;
}
.rail-more[open] summary::after{transform:rotate(180deg)}
.rail-more summary:hover{color:var(--ink)}
.rail-more-n{
  display:none;align-items:center;justify-content:center;
  min-width:16px;height:16px;padding:0 4px;border-radius:999px;

.rail-more-n.is-on{display:inline-grid}
.rail-more-body{padding:9px 0 0}
.rail-tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 7px}
.tag-chip{
  appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;

  border:1px solid var(--rule);background:var(--surface);
  font-family:var(--font-sans);font-size:10.6px;line-height:1.65;color:var(--ink-3);
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
.tag-chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:15ch}
.tag-chip:hover{border-color:var(--ink-3);color:var(--ink)}
.tag-chip[aria-pressed="true"]{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 40%,var(--rule));color:var(--teal-ink);font-weight:600}
.rail-tag-more{
  appearance:none;cursor:pointer;border:0;background:transparent;padding:2px 0;

}
.rail-tag-more:hover{color:var(--teal-ink)}

  display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:2px 0;font-size:12.2px;color:var(--ink-2);

  margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-soft);

/* ==========================================================================
   4. TOOLBAR + ACTIVE FILTER BAR

.main{min-width:0}

/* ==========================================================================
   5. CARDS (dense)
   ========================================================================== */
.cards{

/* rail accordions */
.rail-head{margin-bottom:9px}
.rail-acc{margin:0;padding:0;border-bottom:1px solid var(--rule-soft)}
.rail-acc:last-of-type{border-bottom:0}
.rail-acc-head{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;
  padding:6px 0;
}
.rail-acc-head::-webkit-details-marker{display:none}
.rail-acc-title{
  font-family:var(--font-mono);font-size:9.8px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}
.rail-acc-head:hover .rail-acc-title{color:var(--ink-2)}
.rail-acc-n{
  margin-left:auto;min-width:0;max-width:52%;
  font-family:var(--font-mono);font-size:9.2px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;
}
.rail-acc-chev{flex:none;position:relative;width:10px;height:10px;font-size:0;color:var(--ink-3)}
.rail-acc-chev::before{content:"";position:absolute;left:1px;top:2px;width:5px;height:5px;border-right:1.4px solid var(--ink-3);border-bottom:1.4px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s ease,top .15s ease}
.rail-acc[open] .rail-acc-chev::before{transform:rotate(-135deg);top:4px}
.rail-acc-body{padding:0 0 9px}
.rail-sub{display:flex;flex-direction:column;gap:3px;margin:0 0 7px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rail-sub:last-child{margin-bottom:0}
.rail-sub .rail-select{letter-spacing:0;text-transform:none;margin-top:2px}
.rail-pdf{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule-soft)}

/* quick peek popover */
.peek{
  position:fixed;z-index:420;width:min(360px,92vw);max-height:min(72vh,620px);overflow:auto;
  padding:13px 14px;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;box-shadow:var(--shadow-2);font-size:12px;color:var(--ink);
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
}
.peek[hidden]{display:none!important}
.peek-top{display:flex;align-items:flex-start;gap:8px}
.peek-title{flex:1;min-width:0;font-family:var(--font-serif);font-size:14.5px;line-height:1.38;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.peek-close{appearance:none;cursor:pointer;flex:none;width:22px;height:22px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink-3);font-size:12px;line-height:1}
.peek-close:hover{background:var(--surface-2);color:var(--ink)}
.peek-zh{margin:4px 0 5px;font-size:11.5px;line-height:1.5;color:var(--ink-2);overflow-wrap:anywhere}
.peek-meta{margin:0 0 7px;font-family:var(--font-mono);font-size:9.4px;line-height:1.5;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek-tldr{margin:0 0 9px;font-size:12px;line-height:1.66;color:var(--ink-2);overflow-wrap:anywhere}
.peek-chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.peek-counts{display:flex;flex-wrap:wrap;gap:3px 9px;margin:0 0 9px;font-family:var(--font-mono);font-size:9.4px;color:var(--ink-3)}
.peek-counts b{color:var(--ink-2)}
.peek-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--rule-soft)}
.peek-acts .btn-read{height:26px;font-size:11px}

/* mobile bottom tabs */
.mobile-tabs{display:none}
@media (max-width:760px){
  .mobile-tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:150;
    display:grid;grid-template-columns:repeat(4,1fr);
    background:color-mix(in srgb,var(--surface) 97%,transparent);

    border-top:1px solid var(--rule);
    padding:3px 6px calc(3px + env(safe-area-inset-bottom));

  }
  .mtab{
    appearance:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;
    padding:4px 2px 3px;border:0;border-radius:8px;background:transparent;

  }

  html.viewer-open .mobile-tabs,body.drawer-open .mobile-tabs{display:none}
  .app-layout{padding-bottom:76px}
  .site-foot{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
}

/* reader: breadcrumb, loop, fullscreen, compact mobile bar */
.vcrumb{margin:0 0 1px;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.viewer:fullscreen{padding:0}

@media (max-width:760px){

    grid-template-areas:"close title full" "acts acts acts";
    align-items:center;gap:5px 8px;padding:6px 8px;
  }

  .vacts{grid-area:acts;width:auto;margin-left:0;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:2px}
  .vacts .vbtn{flex:none}
  .vsep{display:none}
  .vcrumb,.vsub{display:none}
  .vtitle{font-size:13px}
  .viewer-bar .vbtn{height:28px}
  .viewer-bar #viewerFull{order:0}
}
.card-title{line-height:1.38}

   12. PRINT — a plain card list

@media print{
  @page{margin:14mm}
  /* print always uses the light token set, even when the reader is in dark mode */
  :root,html[data-theme="dark"],html[data-theme="light"]{
    --bg:#fff;--bg-2:#fff;--surface:#fff;--surface-2:#fff;
    --ink:#111;--ink-2:#333;--ink-3:#555;--rule:#bbb;--rule-soft:#ddd;
    --teal:#0f6f67;--teal-ink:#0a5b55;--teal-soft:#eef6f4;
    --amber:#a4610b;--amber-ink:#8a5108;--amber-soft:#faf1e2;
    --navy:#0d2b44;--navy-soft:#eee;--focus:#0f6f67;
    --shadow-1:none;--shadow-2:none;--shadow-pop:none;
  }
  html,body{background:#fff!important;color:#111!important}
  .app-head{position:static;background:#fff!important;border-bottom:2px solid #111}
  .app-head::before{display:none}
  .head-search,.theme-toggle,.rail,.rail-scrim,.toolbar,.active-bar,.site-foot,
  .viewer,.err-banner,.card-foot,.head-stats,.skip-link,.card-link{display:none!important}
  .app-layout{display:block;max-width:none;padding:8px 0 0}
  .main{padding:0}
  .cards{display:block}
  .card{
    break-inside:avoid;page-break-inside:avoid;
    margin:0 0 9pt;border:1px solid #bbb!important;box-shadow:none!important;
    display:block;
  }
  .card:hover{transform:none}
  .card-media{display:none!important}
  .card-body{padding:8pt 10pt 3pt}
  .card-catrow,.card-tags{display:none!important}
  .card-title{font-size:12pt;-webkit-line-clamp:unset;display:block;overflow:visible}
  .card-title-zh{white-space:normal;display:block;font-size:9.5pt}
  .card-meta{white-space:normal;font-size:8pt}
  .card-tldr{-webkit-line-clamp:unset;display:block;overflow:visible;font-size:9.5pt}
  .card-counts{font-size:8pt;color:#444}
  .card::after{
    content:attr(data-print-url);display:block;
    padding:0 10pt 4pt;font-family:monospace;font-size:7.5pt;color:#666;overflow-wrap:anywhere;
  }
  .hit{break-inside:avoid;box-shadow:none!important;border:1px solid #bbb!important;margin-bottom:8pt}
  .table-wrap{overflow:visible;border-color:#bbb}
  .lib-table{font-size:9pt}
  a{color:#111!important;text-decoration:none!important}
  .quick-bar,.mobile-tabs,.peek,.font-toggle,.tb-mini,.sync-wrap{display:none!important}
  .lib-list{display:block;border:0;box-shadow:none}
  .list-row{display:block;padding:6pt 0;border-bottom:1px solid #ddd}
  .list-thumb,.list-acts,.list-state,.list-open{display:none!important}
  .list-title{font-size:11pt;white-space:normal}
  .list-zh{font-size:9pt;white-space:normal}
  .list-meta,.list-counts{display:block;font-size:8pt}
  .list-cat{display:none}
}

白难表达\"，而是三件事叠在一起：受体只有 40–50 kDa、大部分体积埋在膜里，颗粒对齐缺少参考质量；细胞表达 + 去垢剂增溶会破坏构象与配体结合；而从构建到上样往往要几周到几个月。过去几年的解法是\"加质量\"——接 G 蛋白、接纳米抗体、或者在胞内环 3（ICL3）里插一个刚性融合模块当基准（fiducial）。这篇预印本换的是 上游 ：把表达、增溶、筛选、纯化全部改到无细胞（cell-free）体系里，用 PURE 体系 + 共翻译插入脂质纳米盘 + 数字微流控纳升级筛选，把\"基因到电镜\"压到四天 原文 p.16 。 \n\n 技术上它是一个 组合创新的产线论文 ，而不是新生物学：结构本身（拮抗剂结合的 A 2A R–β-内酰胺酶–BLIP-II 复合物，MSP1E3D1 DOPG 纳米盘， 3.38 Å ）与 2026 年 Shah 等人用昆虫细胞 + 去垢剂得到的参考结构（PDB 9T9P，3.22 Å）几乎重合——跨膜螺旋 Cα RMSD 仅 0.85 Å ，配体重原子 RMSD 1.7 Å 。真正的新意有三条： (1) 作者称这是首次用 PURE 体系（而非大肠杆菌裂解液）产出可用于高分辨冷冻电镜的 GPCR； (2) 复合物里每一个组分都是无细胞合成的，因此能拿到 G 蛋白路线拿不到的拮抗剂结合态； (3) 用数字微流控在纳升级把\"构建 × 脂质配方\"筛完再放大，把试错成本压到最低。 \n\n \n 3.38 Å 整体分辨率 A 2A R 拮抗剂结合态 \n 47,986 最终颗粒数 参考结构用了 597,000（≈12×） \n 4 天 基因 → 上样 原文未给出逐日计时 \n 12 受体面板 4×Class A · 1×B · 1×C · 6 孤儿 \n \n\n \n 表 A 　五条核心主张与证据强度（本报告判读，非原文表述） \n \n \n 主张 原文数字 证据位置 本报告判读 \n \n PURE 无细胞体系能产出\"电镜级\"GPCR 3.38 Å；47,986 颗粒；TM 螺旋 Cα RMSD 0.85 Å（对 9T9P） p.9–10、图 3 原文 p.10 结论成立，但只有一个结构、一个靶点。 3.38 Å 属\"中等分辨\"，作者自认配体尾巴与水分子不可分辨 \n 共翻译插入纳米盘是增溶/纯化的必要条件 无纳米盘时两种受体\"纯化不到有意义的量\"；有纳米盘时 52.5 / 60.0 µg/mL（效率 18% / 23%） p.6–7、图 1 原文 p.6 证据直接、对照干净。 \"共翻译\"是从\"翻译时必须有纳米盘\"推断的，没有核糖体层析等直接证据 \n 全流程四天，可做 DBTL 循环 \"从构建生成与芯片筛选、放大、FSEC 到上样共四天\" p.16 讨论 说法合理但不可复核。 原文没有逐日计时，且起点是已到手的线性 DNA（gBlocks 的合成/运输时间未计） \n 可泛化到 12 个 Class A/B/C 与孤儿受体 12 个受体全部表达、插入、纯化；GPR61/146/151 近单分散 p.11–14、图 4 原文 p.13 最有价值的一条，但只有 FSEC。 没有配体结合、活性或结构；\"结构级质量\"是相对 A 2A R 基准的推断 \n 纳米盘环境比去垢剂更接近天然 基准模块相对受体刚性倾斜 ~3°，BLIP-II 位移 ~3.7 Å p.9–10、图 3c–d 提示性。 作者自己说不同数据收集/处理\"不允许直接比较\"；3.7 Å 的差别也可能来自拟合与分辨率差异 \n \n \n \n 数字均转录自原文；\"本报告判读\"为解读而非原文结论，正文中以 [推断] / [背景] 标出推断与文献背景。 \n \n\n \n 一句话定位 \n 把它读成 \"Nuclera 平台的技术验证 + 流程宣言\" 最准确：科学上它确认了\"无细胞合成的 GPCR 在纳米盘里与细胞来源的受体结构等价\"，工程上给出了一个可复制的四天流程。它 不是 一篇新的 GPCR 生物学论文——没有一个新构象、新配位点或新机制被揭示。"}, {"id": "sec-problem", "h": "问题：小、软、慢——GPCR 冷冻电镜的三重瓶颈", "t": "[背景] 单颗粒冷冻电镜在 2015 年后把\"结晶\"这道门槛拆掉了，但对 GPCR 这类膜蛋白仍然吃力：受体本身只有约 40–50 kDa，而它最具特征的结构（七次跨膜束）埋在膜或去垢剂胶束里，胞外只有很小的结构域可供对齐。业界的标准解法是\"把复合物做大\"——接异源三聚体 G 蛋白、再接一段纳米抗体或 Fab 提供刚性参考 原文 p.3 。代价是：这类复合物只能捕获激动剂结合的活性态；无配体（apo）或拮抗剂结合的受体因为缺少稳定化伴侣，在去垢剂里往往构象不均一。 \n\n 第二条路线是 刚性基准模块（rigid fiducial） ：GPCR 的 ICL3 位于 TM5 与 TM6 之间，长度与序列容忍度高，历史上在 X 射线晶体学里就被用来插入 T4 溶菌酶等融合伴侣以产生晶格接触。近年把同样的插入用在冷冻电镜上——融合蛋白本身就是一块\"额外的刚性质量\"，再结合一个高亲和力伴侣（如 β-内酰胺酶 + BLIP-II）进一步加质量。Shah 等 2026 年用这条路线在昆虫细胞表达、去垢剂增溶的 A 2A R 上拿到 3.2 Å；Collu 等 2026 年在 β 1 -肾上腺素受体上拿到 4.2 Å 原文 p.3 。 \n\n 第三条路线是 无细胞表达 + 共翻译插入纳米盘 ：纳米盘是\"磷脂双分子层 + 工程化膜支架蛋白（MSP）\"围成的盘状颗粒，能在完全没有去垢剂的情况下把膜蛋白包进类天然脂环境。Köck 等与 Merino 等用大肠杆菌裂解液体系做过 GPCR 的冷冻电镜结构，但那些工作里 G 蛋白仍然来自昆虫细胞，而且捕获的是激动剂结合态 原文 p.4 。 \n\n \n 本文的赌注：把三条路线的优点拼起来 \n 作者组合了三件事： PURE 体系 （重组纯化的转录/翻译组分，背景干净、重复性好，但此前没有被证明能产出电镜级 GPCR）+ β-内酰胺酶/BLIP-II 刚性基准 （解决对齐）+ 共翻译纳米盘插入 （解决增溶与构象）。再往上加一层：用数字微流控（DMF）在纳升级做条件筛选，先证明\"能纯化出来\"，再决定放大。 \n \n\n [推断] 这条组合路线真正的卖点不是分辨率，而是 消除了三个\"外部依赖\" ：不依赖细胞（表达）、不依赖去垢剂（增溶）、不依赖 G 蛋白或抗体（对齐）。三者同时去掉之后，\"设计→构建→测试→学习\"的循环才有可能在几天内闭合——这正是作者反复强调 DBTL 的原因，也是这篇论文更接近\"平台论文\"而非\"结构论文\"的地方。"}, {"id": "sec-screening", "h": "第一步：在纳升级把\"构建 × 脂质配方\"筛完", "t": "无细胞反应最贵的不是时间而是试剂，所以正确的顺序是 先用最小的体积证明\"这个受体能在这个配方里被纯化出来\"，再决定放大 。作者的筛选平台是 Nuclera 的 eProtein Discovery——一台数字微流控（DMF）设备，在芯片上以纳升级分配液滴，自动完成表达与链霉亲和素/Strep 纯化，并用 split-GFP 荧光互补定量 原文 p.5 。 \n\n 筛选空间被压成两个维度： 脂质配方 上选了三种——不带电的 POPC/POPS、加胆固醇的 POPC/POPS/cholesterol、以及带负电的 DOPG（负电脂质被认为能通过吸引蛋白 N 端的正电荷促进转位子非依赖的膜插入）； 纳米盘尺寸 上选了两种 MSP——MSP1D1（约 9.5 nm）与 MSP1E3D1（约 13 nm）。再加上两个对照（只有缓冲液、只加 CaCl 2 ），一张图上就是 8 种条件 × 2 种受体构型（野生型 A 2A R 与 ICL3 融合了 β-内酰胺酶的版本）。 \n\n 另外两个细节决定了这类实验能不能成： (1) 二硫键 ——GPCR 胞外有保守的二硫键，而无细胞体系没有内质网的氧化折叠机器，所以所有含纳米盘的反应都补了 PDI + 氧化型谷胱甘肽（GSSG）以建立氧化还原缓冲； (2) 检测标签 ——构建体带 C 端 split-GFP（DET）标签用于定量，带 Strep-tag II 用于单步亲和纯化，两者都不需要抗体。 \n\n Figure 1 原文 Figure 1 · p.6 · 图像块裁切 · 来自 PDF 原始页面 · 1567×901 px 原文 p.6 ↗ 放大 原文图注 · p.6 “Figure 1. eProtein Discovery screen of wild-type A2AR (gray) and A2AR-β-lactamase (orange) expression (a), purification (b), and purification efficiency (c) in the absence and presence of nanodiscs. Soluble control (BLIP-II) expression and purification data are provided in Figure S1. All nanodisc reactions contained PDI + GSSG mix.” \n 逐面板解读 \n \n a 表达量（µg/mL） ：灰＝野生型 A 2A R，橙＝A 2A R-β-内酰胺酶融合体。两个对照（Buffer、CaCl 2 ）都在 150–220 µg/mL，六种纳米盘条件升到 250–320 µg/mL。 读法：加了纳米盘只是\"中等幅度\"提高表达，说明纳米盘的价值不在翻译效率，而在后面的可溶性 。 原文 p.6 \n b 纯化产量（µg/mL） ：分水岭在这里——两个对照组几乎贴地，六种纳米盘条件跳到 44–70 µg/mL。野生型平均 52.5 、融合体平均 60.0 µg/mL 。 这是\"共翻译插入是必要条件\"的核心证据 ：同样的构建、同样的表达量，只是在翻译时缺了纳米盘，就纯化不出来。 原文 p.7 \n c 纯化效率（%） ＝纯化产量/表达量：野生型 18% 、融合体 23% 。这个数字要记住——它意味着 每五份合成出来的受体里只有约一份是可纯化的 ，这也是为什么后面做电镜必须把反应从 100 µL 放大到 2 mL。 原文 p.7 \n 横轴 前两组是 Controls；后六组按 MSP 尺寸分成 MSP1D1（~9.5 nm）与 MSP1E3D1（~13 nm）两簇，每簇内依次是 POPC/PS、POPC/PS/CHOL、DOPG。 读图注意：所有纳米盘条件都含 PDI + GSSG ，所以这里比较的不是\"有无氧化还原缓冲\"，而是脂质与尺寸。 \n \n \n \n 读图注意 \n 这张图的数据全部来自 芯片上的纳升级反应 （nanoliter-scale），它回答的是\"哪个配方值得放大\"， 不是 定量结论：绝对产量会随放大而变（下一节的图 2a 就是对照）。另外图中没有误差棒——原文没有报告芯片筛的重复次数与离散度，这一栏的\"显著差异\"要打折扣地读。 \n \n\n \n \n AI 重绘示意图（非原文图） \n 流程重绘自第 5 节、方法部分与讨论 · 悬停各阶段查看释义 \n \n \n \n \n 这条流水线的关键设计不是任何单步，而是 顺序 ：先用纳升级证明\"能纯化\"，再用 100 µL 放大做 FSEC，最后才投入 2 mL 的反应做电镜。 每一步都在花更贵的钱之前回答一个更便宜的问题 ——这是它能压到四天的真正原因。 \n \n\n \n 表 B 　可复现参数（转录自方法部分 p.19–22） \n \n \n 环节 设定 \n \n 构建 eGene 线性 DNA：5′ 启动子/RBS/翻译增强子 + 5′ 3C、3′ TEV 位点 + DET tag（split-GFP）+ Strep-tag II；gBlocks/HiFi 片段经 PCR 装配（Linear eGene Prep Kit Flexivariant NC3008） \n 芯片筛选 eProtein Discovery + Membrane Protein 试剂盒（NC3013）；添加剂：Additive Buffer、CaCl 2 、PDI + GSSG Mix、GPCR Nanodisc Panel（NC3023） \n FSEC 放大反应 100 µL：60 µL Scale-Up Core + 7.5 µL PDI/GSSG + 7.5 µL MSP1E3D1 DOPG + 25 µL DNA（纳米盘终浓 75 µM，DNA 5 nM）；29 °C 过夜；RNase A 0.2 mg/mL 30 min \n 纯化 Strep Beads 磁珠单步捕获，100 µL 洗脱；split-GFP 定量（eProtein Quantification Kit NC3014） \n FSEC 25 °C，ACQUITY Premier UPLC + Protein SEC 柱（250 Å, 1.7 µm, 4.6×150 mm）；缓冲液 20 mM 磷酸氢二钠 + 250 mM NaCl + 100 mM 精氨酸，pH 7.5；10 µL 进样、0.25 mL/min；Ex280/Em350，15 min \n 电镜样品 A 2A R-β-内酰胺酶 2 mL 反应、BLIP-II 1 mL 反应；分别浓缩到 ~100 µL（1.25 / 0.77 mg/mL）；8 µM : 9.6 µM（1:1.2）+ 15 µM ZM241385，冰上过夜 \n 上样 Quantifoil R1.2/1.3 Cu 300 目；辉光放电 25 mA × 60 s/面；Vitrobot 4 °C、95% RH、blot 3 s、force −5 \n 数据收集 Titan Krios 300 kV + Selectris X 能量过滤（10 eV 狭缝）+ Falcon 4i 计数模式；165,000×；像素 0.729 Å；31,799 部电影；AFIS；离焦 −1.8 至 −0.6 µm \n 处理与建模 WARP 实时预处理（增益/运动/CTF）→ BoxNet2 自动拾取 → 384 px 框提取 → cryoSPARC 5.0.6 二维/三维分类；模型：ChimeraX 手动就位 9T9P → Coot 0.9.8.95 → Phenix 1.21 精修 \n \n \n \n \n\n \n 这张快照里缺什么 \n 方法部分给了大量可复现细节（试剂货号、缓冲液配方、上样参数），但 缺三样关键的东西 ：① 没有 Table S3 里的模型/地图质量统计（FSC 曲线、B-factor、map-model CC、局部分辨率）——正文只给了一个\"整体 3.38 Å\"；② 没有说明是否做了金标准 FSC 与方向分辨率；③ 坐标与密度图\"准备中\"，未被沉积。对一篇结构论文来说，这三项在评审时会被直接追问。"}, {"id": "sec-scaleup", "h": "第二步：放大、纯化、证明复合物真的组成了", "t": "芯片筛只回答\"哪个配方值得放大\"。接下来的关键问题是 放大会不会失真 ，以及 融合了 β-内酰胺酶的受体是否真的能和 BLIP-II 结合 。作者的顺序是：先用 100 µL 管式放大做 FSEC，再把产量与芯片值对照，最后才把反应推到 2 mL 做电镜。 \n\n 结果是三者一致：BLIP-II 芯片 0.16 vs 放大 0.11 mg/mL，野生型 A 2A R 0.05 vs 0.07，融合体 0.06 vs 0.06。野生型与融合体在 FSEC 上都早于空纳米盘出峰，落在\"MSP1E3D1 DOPG 纳米盘里单体受体\"的预期分子量区间； 但同时检出相当比例的聚集体——分别占总荧光的 35% 与 36% 。这个数字值得记住：后面能做成功结构，靠的不是\"没有聚集体\"，而是\"单体峰足够干净、聚集体被 SEC 分开了\"。 \n\n 复合物形成的证据做得干净：把 A 2A R-β-内酰胺酶与 BLIP-II 预混后再跑 FSEC，主峰向高分子量方向位移、峰高增加、游离 BLIP-II 峰同时减少；而 把没有 β-内酰胺酶插入的野生型 A 2A R 与 BLIP-II 预混，则完全不位移、强度也不变 。这一对正反实验同时排除了\"BLIP-II 与纳米盘或受体非特异黏附\"的可能。 \n\n Figure 2 原文 Figure 2 · p.8 · 图像块裁切 · 来自 PDF 原始页面 · 1594×874 px 原文 p.8 ↗ 放大 原文图注 · p.8 “Figure 2. Scaled-up purification and FSEC confirmation of A2AR-β-lactamase-BLIP-II complex formation. (a) Purified yields of BLIP-II, A2AR, and A2AR-β-lactamase after strep-tactin purification. (b) FSEC traces for A2AR (red, dashed), BLIP-II (cyan), and A2AR with BLIP-II (blue). (c) FSEC traces for A2AR-β-lactamase (orange, dashed), BLIP-II (cyan), and A2AR-β-lactamase with BLIP-II (blue). Dotted gray traces indicate molecular weight standards (Waters, BEH200 SEC Test Mix) corresponding to 660 kDa, 150 kDa, 66.4 kDa, and 17 kDa.” \n \n 逐面板解读 \n \n a 三个组分的纯化产量 ：BLIP-II 最高（约 110 µg/mL），A 2A R 约 70，融合体约 60。 BLIP-II 单独表达是为了后续按化学计量加进去 ，所以它必须单独放大；三根柱子的高度也解释了为什么 2 mL 反应要按不同比例配置。 原文 p.8 \n b 野生型 A 2A R 的 FSEC（阴性对照） ：青＝BLIP-II，红虚线＝A 2A R，深蓝＝两者预混。 红与深蓝几乎重合 ——没有 β-内酰胺酶就没有结合位点，峰位与峰高都不变。这一步是整篇论文里最关键的对照。 原文 p.8 \n c 融合体的 FSEC（阳性） ：橙虚线＝融合体，青＝BLIP-II，深蓝＝预混。 预混后主峰左移（更高分子量）、峰高上升，同时游离 BLIP-II 峰被消耗 ，直接证明 1:1 复合物形成。左侧 0.8–1.0 mL 的小峰是聚集体/空盘区，右侧 1.6–1.8 mL 的尖峰是 BLIP-II。 原文 p.8 \n 标准品 灰色点线是 Waters BEH200 标准品：660、150、66.4、17 kDa。 读法：受体-纳米盘复合物（约 200 kDa 量级）应落在 660 与 150 之间 ；图上主峰的位置对得上，而 BLIP-II（约 36 kDa 二聚体量级）落在 17–66 之间。 \n \n \n \n 这一节最容易被低估的信息 \n 聚合体占总荧光 35–36% 并不低，但作者没有回避。对做结构的人来说这里有两层含义： (1) 无细胞 + 纳米盘的产物并不是\"纯净的单体\"，单步亲和纯化后仍有三分之一是聚集体； (2) 结构能成功，说明对冷冻电镜而言\"单体的绝对量 + SEC 可分性\"比\"总纯度\"更关键。 如果照这个流程迁移到别的靶点，FSEC 的单体峰高度应该成为放大的硬性 gate，而不是产量。 \n \n \n\n \n 两处需要留意的方法细节 \n \n FSEC 的分辨率有限。 它与 SEC 同原理但用荧光检测，分子量是\"对标准品推断\"而不是绝对测量；文中所有\"单体/聚集体\"的判定都基于峰位区间，没有 SEC-MALS 或质量光度法做正交确认。 \n \"纯化效率\"是把芯片读数和放大读数混在一起算的。 Fig. 1c 的 18%/23% 来自纳升级芯片，Fig. 2a 的产量来自 100 µL 放大；两者数量级一致，但不是同一个测量的重复。"}, {"id": "sec-structure", "h": "第三步：3.38 Å 的结构读出了什么", "t": "电镜样品是 2 mL 的融合体反应 + 1 mL 的 BLIP-II 反应，各自单步亲和纯化、浓缩到约 100 µL（1.25 与 0.77 mg/mL），按 1:1.2 摩尔比混合并加 15 µM 拮抗剂 ZM241385，冰上过夜后上样。数据收集到 31,799 部电影，自动拾取 5,477,692 个颗粒，经过二维与三维分类后保留 47,986 个，得到整体 3.38 Å 的重建 原文 p.9 。 \n\n 结构本身最值得注意的是 它\"没有新东西\" ——这恰恰是作者要证明的。把高分辨参考模型 PDB 9T9P（Shah 等，昆虫细胞 + 去垢剂）直接放进密度图后几乎不需要改：跨 803 个残基的 Cα RMSD 为 0.99 Å ，跨 227 个跨膜螺旋残基仅 0.85 Å ；配体 ZM241385 的重原子 RMSD 1.7 Å ，并且 9T9P 的配体构象放回本图的密度里同样贴合。差异只出现在三处：ECL1 附近 TM2/TM3 的胞外端、ECL2/ECL3（Cα 偏差最大约 2.3 Å）、以及 β-内酰胺酶–BLIP-II 模块相对受体约 3° 的刚性倾斜（使 BLIP-II 位移约 3.7 Å）。作者推测最后一项可能源于膜模拟环境的差异——去垢剂胶束 vs 脂质纳米盘 原文 p.9 。 \n\n 密度质量呈明显的 梯度 ：β-内酰胺酶与 BLIP-II 最好；受体内部与融合螺旋直接连续的 TM5、TM6 次之，侧链清晰；TM2、TM3、TM7 沿全长也不错；最差的是朝脂质的外周螺旋 TM1、TM4 与胞外环，很多侧链无法解析。这个梯度不是缺陷，而是这套设计的 必然结果 ：颗粒对齐主要由基准模块驱动，离它越远的部件分辨率越低。 \n\n Figure 3 原文 Figure 3 · p.10 · 图像块裁切 · 来自 PDF 原始页面 · 1534×1350 px 原文 p.10 ↗ 放大 原文图注 · p.10 “Figure 3. Structure of A2AR-β-lactamase in complex with BLIP-II in MSP1E3D1 DOPG nanodiscs. All panels are shown in side view. (a) Cryo-EM map of A2AR–β-lactamase at 3.38 Å resolution. (b) Reference model (PDB 9T9P; Shah et al.) manually fitted into the map; nanodisc density was removed for clarity. (c) Superposition of the reference model (pink/steel blue) and the A2AR–β-lactamase model refined in this study (tomato/cadet blue). The models agree closely, with the main differences in TM2–TM4. (d) Close-up of TM2–TM4. (e) Close-up of the ligand fitted into the cryo-EM density.” \n \n 逐面板解读 \n \n a 3.38 Å 的密度图 ：可以看到\"倒置的 T 形\"——上方是 β-内酰胺酶–BLIP-II 基准模块（一块大的、刚性的质量），下方插在纳米盘里的才是受体。 这张图本身就说明了策略：颗粒对齐靠上面那一块，不是靠受体。 原文 p.10 \n b 把参考模型塞进密度 ：作者把 9T9P 手动就位（为了清晰移除了纳米盘密度）。 读法：如果模型与密度大面积不符，这里会立刻看出来 ；实际上几乎处处吻合，说明折叠一致。 原文 p.10 \n c 两个模型叠合 ：粉/钢蓝＝9T9P，番茄红/蓝灰＝本研究。整体高度一致，差异集中在 TM2–TM4（即 ECL1/ECL2 一侧）与基准模块的倾角。 注意：跨膜束的 0.85 Å 与整体的 0.99 Å 是两个不同分母，引用时别混。 原文 p.10 \n d TM2–TM4 特写 ：能看到螺旋的轻微弯折与侧链差异。作者提示这部分可能反映膜模拟环境不同，也可能是分辨率与拟合带来的表观差异—— 3.38 Å 下二者的区分度有限 。 原文 p.10 \n e 配体密度 ：ZM241385 的三唑并三嗪核心与呋喃环密度与周围侧链相当，但 伸向溶剂暴露胞外前庭的 4-羟基苯乙氨基尾巴密度更弱 。作者据此只说\"结合模式与既有结构一致\"，没有声称新的相互作用。 原文 p.10 \n \n \n \n 3.38 Å 能说什么、不能说什么 \n 能说 ：整体折叠、跨膜束的排布、配体在正构口袋中的位置与朝向、基准模块相对受体的取向。 不能说 ：氢键网络、有序水、侧链的精细构象、以及任何依赖 2 Å 以内精度的\"结构导向设计\"结论。作者自己在讨论里承认\"在这个分辨率下，配体构象与先前结构一致，但氢键网络与有序水无法解析\"—— 这句话应该被引用者原样保留 ，因为很多二次引用会把\"3.38 Å 结构与 3.22 Å 一致\"读成\"精度相当\"。 \n \n \n\n \n \n AI 重绘示意图（非原文图） \n 机制重绘自第 3–4 节、结果 p.9–10 与图 3 · 结构形状为示意 \n \n \n \n \n 这套设计的逻辑链条很短： 受体自己不够大 → 造一块刚性的、额外的质量并让它与受体硬连接 → 颗粒对齐由它主导 。代价同样直接：分辨率会沿着\"基准模块 → 受体\"的距离衰减，所以 TM5/TM6（与融合螺旋连续）最清楚、外周 TM1/TM4 最模糊。理解这一点，就理解了后面所有局限（配体尾巴弱、ECL 模糊、水分子不可见）的物理来源。 \n \n\n \n 表 C 　冷冻电镜数据与建模：原文报告了什么、没报告什么 \n \n \n 项目 原文给出 说明 \n \n 显微镜 / 检测器 Titan Krios 300 kV、Selectris X（10 eV）、Falcon 4i 计数模式 方法 p.21 \n 像素 / 放大 0.729 Å·px⁻¹（标定），标称 165,000× 方法 p.21 \n 电影数 31,799 方法 p.21 \n 拾取颗粒 5,477,692（BoxNet2，384 px 框） 方法 p.21 \n 最终颗粒 47,986 结果 p.9；约为拾取量的 0.88% \n 整体分辨率 3.38 Å 未说明是 gold-standard FSC 0.143 还是 0.5 \n 对称性 未报告 按惯例应为 C1，但原文未写明 \n FSC 曲线 / 方向分辨率 / 局部分辨率图 未报告（指向 Table S3，本 PDF 未含补充） 结构论文的关键质量证据缺失 \n B-factor / 锐化 / map-model CC 未报告 同上 \n 模型覆盖 A 2A R 8–146、163–214、220–303；β-内酰胺酶全长；BLIP-II 41–311；ZM241385 ECL2 147–162 与 C 端 303 之后未解析，与柔性一致 \n 坐标 / 密度图 未沉积 （\"准备中，待同行评审后公开\"） 数据可用性声明 p.23 \n \n \n \n \"未报告\"一栏是核对该 PDF 正文后的判断；补充材料（Table S3）不在本文件内，因此无法确认是否在补充中给出。 \n \n\n \n \n 数据重绘自 p.9–10、p.21 \n 数据转录自原文，未重新分析 · 颗粒数取对数轴 \n \n \n \n \n \n 这张图要读的是\"同一分辨率的代价变了\" ：两组数据里，本研究的最终颗粒数少了一个数量级，分辨率只差 0.16 Å。但作者自己指出，数据收集与处理流程不同\"不允许直接比较\"——所以这张图是 提示 而不是 证明 。 \n 数据转录自原文 p.9（47,986 颗粒、3.38 Å）、p.10（9T9P 为 597,000 颗粒、3.22 Å）、p.21（31,799 电影、5,477,692 拾取）；未重新分析。 \n \n \n\n \n \"少 12 倍颗粒\"这件事该怎么读 \n 作者的解释是\"纳米盘包埋的无细胞材料足够均一，因而电镜分析效率更高\"。 [推断] 这个解释至少有三个替代来源 ：① 基准模块（β-内酰胺酶 + BLIP-II）比 9T9P 使用的对应模块质量更大或更长程刚性，对齐本身更强；② 数据收集条件（Krios + Selectris X + Falcon 4i、AFIS、0.729 Å 像素）可能优于参考工作；③ 处理流程（WARP 实时预处理 + cryoSPARC）与分类策略不同。 在 3.38 vs 3.22 Å 这样接近的分辨率下，\"颗粒效率\"同时受样品、仪器与流程影响，单靠论文给出的信息无法把功劳分配给\"无细胞合成\"。"}, {"id": "sec-panel", "h": "第四步：把流程推到 12 个受体，包括 6 个孤儿 GPCR", "t": "单个 A 2A R 结构只能证明\"这条路能走通\"，不能证明\"这条路能复制\"。作者因此做了一个 12 个受体的面板：4 个已有配体/结构的 Class A（CCR10、CXCR1、ADRB2、CB2）、1 个 Class B（GCGR）、1 个 Class C（RAI3/GPRC5A），以及 6 个孤儿受体（GPR61、GPR85、GPR88、GPR146、GPR151、GPR174）。这些全部是 无配体（apo）状态 ——孤儿受体没有已知天然配体，本来就不可能靠小分子热稳定化或用 G 蛋白复合物来稳定，所以它们恰好是这套\"无去垢剂、共翻译插入\"路线最有说服力的用例。 \n\n 针对每个靶点，作者做了三种 N 端构建变体： (1) 天然无标签； (2) N 端融合 BRIL（一种来自细胞色素 b 562 的\"可溶性折叠伴侣\"，常用于稳定 GPCR 的 N 端）； (3) N 端融合二氢乳清酸脱氢酶（DHODH）的双亲性膜锚定螺旋，用来促进初始的纳米盘结合。三种变体 × 不同纳米盘配方在芯片上快速筛一遍，取每个靶点产量最高的条件放大，再做 FSEC 原文 p.12 。 \n\n 结果：12 个受体全部表达了、都插进了纳米盘、都能在 apo 状态下纯化，产量\"与 A 2A R 相当或更高\"；非孤儿面板（Class A/B/C）都给出对应单体受体–纳米盘复合物的清晰主峰，聚集体水平虽各有差异但整体很低；6 个孤儿受体都给出尖锐对称的洗脱峰，其中 GPR61、GPR146、GPR151 接近单分散、几乎没有高分子量物种。 \n\n Figure 4 原文 Figure 4 · p.13 · 图像块裁切 · 来自 PDF 原始页面 · 1574×1787 px 原文 p.13 ↗ 放大 原文图注 · p.13 “Figure 4. Analytical FSEC analysis of cell-free expressed and affinity-purified GPCRs in nanodiscs. Tested constructs span Class A receptors including CCR10 (a), CXCR1 (b), ADRB2 (c), and CB2 (d); Class B receptor GCGR (e); Class C receptor RAI3 (GPRC5A) (f); as well as orphan GPCRs GPR61 (g), GPR85 (h), GPR88 (i), GPR146 (j), GPR151 (k), and GPR174 (l). Reconstructed receptor–nanodisc assemblies are plotted in solid black traces. Dotted gray traces show molecular weight standards (Waters, BEH200 SEC Test Mix) corresponding to 660 kDa, 150 kDa, 66.4 kDa, 17 kDa, and 112 Da.” \n 逐面板解读 \n \n a–d Class A 的四个非孤儿靶点 ：CCR10、CXCR1、ADRB2、CB2，全部在 apo 状态下纯化。注意纵轴量程不同（ADRB2 只有 150 a.u.，CCR10 到 400）—— 荧光强度不能直接跨面板比较 ，能比较的是\"主峰位置\"与\"肩峰相对高度\"。 原文 p.13 \n e–f Class B（GCGR）与 Class C（RAI3/GPRC5A） ：这两类受体的胞外域更大、折叠更复杂，是最能考验\"共翻译插入\"是否通用的样本。 两者都给出单峰 ，说明这套流程不是只对 Class A 的\"小受体\"有效。 \n g–l 六个孤儿受体 ：全部 apo、没有配体稳定化。 GPR61（g）、GPR146（j）、GPR151（k）接近单分散 ，峰形尖锐对称；GPR85（h）、GPR88（i）、GPR174（l）在主峰左侧有可见肩峰，说明有部分聚集体或空盘。 这是本文\"可泛化\"主张的核心证据，但证据类型只有 FSEC。 \n 共同点 每个面板都叠了同一套灰色标准品，所以读者可以逐格判断主峰落在哪个分子量区间。 原文没有给每个受体的纯化产量数字 ，只说\"与 A 2A R 相当或更高\"，也没有重复次数与误差——这是这张图最大的信息缺口。 原文 p.14 \n \n \n \n \"FSEC 合格\"能证明什么 \n FSEC 只能说明： 该受体在去垢剂-free 的纳米盘里以一个尺寸接近\"单受体 + 单纳米盘\"的可溶物种存在，且没有大量聚集 。它 不能 说明：受体是正确折叠的（错折叠也可能单分散）、能结合配体（这些靶点大多没有做结合实验）、有功能活性、或者其构象均一。 因此\"12 个受体都达到结构级质量\"是一个以 A 2A R 为单点标定的外推 ——A 2A R 的 FSEC 质量确实足以解出 3.38 Å，但这不保证其他 11 个受体同样可以。 \n \n\n \n 表 D 　12 个受体的面板（转录自图 4 与正文 p.11–14） \n \n \n 面板 受体 类别 原文给出的质量描述 有无功能/结构验证 \n \n a CCR10 Class A（趋化因子） 主峰对应单体受体–纳米盘；有少量聚集体 无 \n b CXCR1 Class A（趋化因子） 同上；0.9 mL 附近肩峰较明显 无 \n c ADRB2 Class A（β 2 -肾上腺素） 主峰清晰；荧光强度最高（150 a.u. 量程内） 无 \n d CB2 Class A（大麻素） 主峰对应单体；峰形对称 无 \n e GCGR Class B（胰高血糖素） 单峰，主峰前有聚集体肩 无 \n f RAI3 / GPRC5A Class C 单峰，肩峰很低 无 \n g GPR61 孤儿（Class A） 近单分散 ，峰尖锐对称 无 \n h GPR85 孤儿（Class A） 主峰 + 明显左肩（聚集体/空盘） 无 \n i GPR88 孤儿（Class A） 主峰 + 左肩 无 \n j GPR146 孤儿（Class A） 近单分散 ，荧光强度高（400 a.u.） 无 \n k GPR151 孤儿（Class A） 近单分散 ，峰形最干净之一 无 \n l GPR174 孤儿（Class A） 主峰 + 左肩 无 \n \n \n \n \"原文给出的质量描述\"来自正文 p.12–14 与图 4 的目视判读；原文未逐靶点报告纯化产量、重复次数或误差。3 种 N 端变体（native / BRIL / DHODH 螺旋）的筛选结果见补充 Table S1（本 PDF 未含）。 \n \n\n \n 表 E 　与三条既有路线的定位（据原文引言 p.3–4 与讨论 p.15–17 整理） \n \n \n 维度 Shah et al. 2026（9T9P） Collu et al. 2026 Köck 2024 / Merino 2025 本研究 \n \n 表达体系 昆虫细胞 （单链 β 1 AR 融合，细胞体系） 大肠杆菌裂解液无细胞 PURE 无细胞 \n 增溶方式 去垢剂 去垢剂 共翻译插入纳米盘 共翻译插入纳米盘 \n 对准策略 ICL3 β-内酰胺酶 + BLIP-II AmpC β-内酰胺酶融合 G 蛋白复合物（G 蛋白来自昆虫细胞） ICL3 β-内酰胺酶 + BLIP-II \n 可及的配体态 拮抗剂结合 未强调 激动剂结合（活性态） 拮抗剂结合（全无细胞） \n 分辨率 3.22 Å（共识） 4.2 Å 高分辨（具体值见各自文献） 3.38 Å \n 最终颗粒数 597,000 未在本文引用 未在本文引用 47,986 \n 流程时长 数周（细胞表达 + 去垢剂纯化） 未给出 数天（但仍需昆虫细胞产 G 蛋白） 约 4 天 \n \n \n \n 表中\"未在本文引用\"指原文没有转述这些数值；跨研究的数字不可直接比较（数据收集、处理、样品状态均不同）。 \n \n\n \n 这张面板图真正的价值在哪 \n 不在\"12 个都成功\"，而在 它把\"孤儿受体\"变成了这套流程的天然领地 。孤儿受体没有已知配体，因此：不能靠小分子热稳定化、不能靠 G 蛋白复合物捕获活性态、也很难用细胞体系稳定表达。 如果无细胞 + 纳米盘能让它们在 apo 状态下稳定且单分散，那么它们就是冷冻电镜最纯粹的\"先有蛋白、再找结构\"的靶点类别。 这条论证比\"12 个靶点都纯化出来了\"更有分量，也是本文最值得被后续工作接住的地方。"}, {"id": "sec-appraisal", "h": "批判性评估：一条可信的产线，一个还不完整的故事", "t": "强项 \n \n 对照设计干净。 三项关键比较都有正反两面：有/无纳米盘的纯化对比（图 1b）、野生型/融合体对 BLIP-II 的结合对比（图 2b vs 2c）、以及与本领域独立结构 9T9P 的叠合（图 3c）。这不是\"做了就成\"的叙述，而是每一步都能被反驳的设计。 \n 用别人的结构验证自己的蛋白。 作者没有声称发现新构象，而是把参考模型直接放进自己的密度图，报告 Cα RMSD（0.99 / 0.85 Å）与配体重原子 RMSD（1.7 Å），甚至做了\"把 9T9P 的配体构象放回本图密度\"的互换检验。 对一篇\"只证明等价\"的论文，这是最有说服力的写法。 \n 不利数据照登。 纯化后聚集体占荧光 35–36%、TM1/TM4 侧链大多不可解析、配体尾巴密度弱、ECL2 与 C 端未解析、两种升温/收集条件不可直接比较——这些都写在正文里，没有被藏进补充材料。 \n 打开了一个此前难及的态。 复合物全部由无细胞体系合成，因此不需要 G 蛋白，能拿到拮抗剂结合（乃至 apo）状态。这是方法层面的真实能力扩展，而不是数字上的改进。 \n 可复现性高。 试剂货号、缓冲液配方、上样参数、数据收集设置、处理软件版本都给了。按方法部分可以把流程重搭起来。 \n \n \n \n 不确定处 \n \n 一个结构、一张网格、一个比例。 没有重复的重建，没有第二个脂质配方或第二个摩尔比的结构对照。因此\"3.38 Å\"是单点观测，而不是可重复的规格。 \n 关键质量统计不在正文。 没有 FSC 曲线、没有说明 3.38 Å 是哪个阈值、没有 B-factor / map-model CC / 局部分辨率图。正文说统计在 Table S3，但补充材料不在本 PDF 里。 这使\"3.38 Å\"无法被独立评估。 \n \"少 12 倍颗粒\"的归因不唯一。 样品均一性、基准模块质量、数据收集配置（Krios + Selectris X + Falcon 4i + AFIS）、处理流程都可能贡献。作者自己也写了\"数据收集与处理的不同不允许直接比较\"，但摘要与讨论仍然强调了 12 倍。 \n 12 个受体的面板只有 FSEC。 没有配体结合、没有热稳定性、没有活性、也没有任何一个新结构。\"结构级质量\"是从 A 2A R 这一个点外推的。 \n 摘录与正文的面板数字对不上。 摘要写\"an expanded panel of 12 wild-type GPCRs spanning Classes A, B, and C, as well as six orphan receptors \"，读起来是 12 + 6 = 18 个；正文与图 4 实际是 12 个总数 （4 个 Class A + 1 个 B + 1 个 C + 6 个孤儿）。引言也写\"a wider set of 12 Class A-C GPCRs\"。 这是审稿一定会抓的不一致。 \n \"四天\"不可复核。 原文只给总时长，没有逐步计时；起点是\"基因构建生成\"，而 DNA 片段由 IDT 合成交付，这段时间是否计入没说明。PURE 试剂的成本与 2 mL 放大的线性度也没有报告。 \n \n \n \n 薄弱点 / 不能外推的地方 \n \n 这是一篇公司平台论文。 9 位作者里 5 位是 Nuclera 雇员并持有股票期权，平台（eProtein Discovery、PURE Core、纳米盘面板）全部是自家产品。结论\"这套流程可行\"与作者利益同向；没有独立实验室复现。 \n 数据尚未公开。 坐标与密度图\"准备中，待同行评审后公开\"。在沉积之前，结构层面的任何核对都无法进行。 \n \"共翻译插入\"是推断，不是直接观测。 证据是\"翻译时没有纳米盘就纯化不出来\"。这可以有别的解释（例如无纳米盘时受体在翻译后立即聚集、且被磁珠非特异吸附损失），要直接证明共翻译需要核糖体-新生链保护、蛋白酶可及性等实验。 \n 纯化效率只有 18–23%。 也就是每五份合成蛋白只有一份可纯化。对 A 2A R 而言这已经够用（2 mL 反应），但对表达更差的靶点，放大会线性放大试剂成本——原文没有讨论这个上限在哪里。 \n 没有与\"大肠杆菌裂解液 CF\"做头对头。 作者论证 PURE 优于裂解液（背景更干净、重复性更好），但这是文献层面的说法，本研究没有在同一样品、同一靶点上比较两种体系。因此\"PURE 对电镜更友好\"仍是未检验的假设。 \n 孤儿受体\"折叠正确\"未验证。 单分散只能说明尺寸行为，不能说明构象正确。对没有配体可用的孤儿受体，这一步验证尤其重要，却被留给了未来工作。 \n \n \n \n\n 三个必须自己回答的问题 \n \n \"3.38 Å\"和参考结构的 3.22 Å 差 0.16 Å，但为什么值得单独发表？ 如果结构本身没有新信息，那么价值必须全部落在\"更快、更便宜、更可及\"上。这三项里只有\"更快\"（四天）被部分记录，\"更便宜\"完全没有数据，\"更可及\"（不需要 G 蛋白/细胞）是定性论证。 读者应该把这篇当成\"流程可行性研究\"，而不是\"结构生物学发现\"。 \n 12 个受体里，有几个能真的解出结构？ 论文证明了它们能纯化、能单分散，但没有一个被推到电镜。历史上\"FSEC 漂亮\"与\"能出 3.5 Å\"之间的落差很大（尤其是 Class B/C 与孤儿受体）。 本文最需要后续补的，就是至少 2–3 个非 A 2A R 靶点的结构。 \n 如果换成更小的刚性模块，质量梯度会改善吗？ 当前设计里 β-内酰胺酶 + BLIP-II 提供了质量，也让\"离它越远越模糊\"成为固有问题。用更靠近胞外的模块、或者双向对称的双模块，可能改善受体本身的密度——这是这套策略真正的方法学改进方向，本文没有探索。 \n \n\n [推断] 最稳妥的读法： 这是一篇\"产线可行性\"论文，价值在流程而不在结构 。它成功的地方是把三个独立的技术（PURE 表达、共翻译纳米盘、ICL3 刚性基准）串成一条能在四天内闭合的流水线，并用一个 3.38 Å 的结构证明终点可达；它没做的事情，恰恰是把\"可达\"升级为\"可重复、可泛化、可比较\"——那需要多个靶点的结构、公开的坐标、以及与现有体系的头对头数据。"}, {"id": "sec-relevance", "h": "与我相关：四件可以立刻借走的事", "t": "一、\"先便宜问题、后贵问题\"的筛选阶梯 \n 这是全文最可迁移的工程思想： 纳升级芯片筛（几十纳升/条件）→ 100 µL 管式放大 + FSEC → 2 mL 电镜级制备 。每一级只回答一个问题，且成本比下一级低一到两个数量级。任何\"高价值、低通量、试剂昂贵\"的实验闭环都可以照搬这个结构： 先在最便宜的尺度上把\"能不能\"变成\"值不值得\" 。 \n\n 二、用独立参考结构做交叉验证 \n 当你的工作\"没有新发现、只是换了一条路\"时，最有力的证据不是分辨率，而是 与既有高分辨结构的逐原子一致性 ：Cα RMSD、跨膜段 RMSD、配体重原子 RMSD、以及\"把对方的配体放回我的密度图\"这种互换检验。这套写法可以直接搬到任何\"方法替代\"型论文（新表达体系、新纯化路线、新固定方法）。 \n\n 三、警惕\"单点标定 → 面板外推\" \n 本文用 A 2A R 一个点证明\"FSEC 质量足以解结构\"，再把同样的 FSEC 标准套到 11 个受体上，得出\"都达到结构级质量\"。 这是一个单点标定的外推 ，在方法学上很常见也很危险。读到\"整个面板都合格\"时，第一个要问的问题是： 合格这个判定，是用什么读出定义的？那个读出被验证过的靶点有几个？ \n\n 四、刚性基准模块是一个通用解法 \n \"给小的、软的、缺参考的蛋白硬接一块质量\"这个思路，不限于 GPCR：单域抗体、小膜蛋白、病毒衣壳亚基、乃至冷冻电镜里的核酸-蛋白小复合物都适用。可迁移的三条经验： (1) 插入位点选在天然柔性环（容忍度高）； (2) 连接处要与相邻二级结构\"连续\"（本文 TM5→N 端螺旋、C 端螺旋→TM6）以获得刚性； (3) 再结合一个高亲和力伴侣加质量。 代价是密度质量的梯度 ——离模块越远越模糊，这一点在选题时就要预判。 \n\n \n 一个可检验的假设（如果你要做后续工作） \n [推断] 如果\"无细胞 + 共翻译纳米盘\"真的是一种通用的膜蛋白稳定化手段，那么它对 热稳定性差、且没有配体可用的孤儿受体 的相对优势应该最大——因为其他所有路线（去垢剂、G 蛋白、小分子热稳定化）在这类靶点上都失效。可检验的写法：选 3 个 FSEC 近单分散的孤儿受体（如 GPR61、GPR146、GPR151），在相同流程下尝试 3.5 Å 以内重建；若其中至少 2 个成功，则\"通用\"成立；若全部失败，则本文的\"结构级质量\"只是 A 2A R 的特例。"}, {"id": "sec-glossary", "h": "术语表", "t": "GPCR G 蛋白偶联受体，七次跨膜的最大膜蛋白家族，约三分之一 FDA 批准药物的靶点。 \n cryo-EM / 单颗粒分析 把蛋白快速冷冻成玻璃态冰、拍大量电子显微照片、再通过二维/三维分类与平均重建出三维密度图的方法。 \n CFPS cell-free protein synthesis，无细胞蛋白合成：在试管里用裂解液或纯化组分完成转录翻译。 \n PURE 体系 Protein synthesis Using Reconstituted Elements：只用重组纯化的转录/翻译组分，背景干净、重复性好、无宿主蛋白污染。 \n 纳米盘（nanodisc） 由磷脂双分子层 + 两圈膜支架蛋白（MSP）围成的盘状颗粒，直径由 MSP 长度决定，可在无去垢剂条件下包埋膜蛋白。 \n MSP1D1 / MSP1E3D1 两种膜支架蛋白，直径分别约 9.5 nm 与 13 nm；后者更常用于较大或需要更多脂质的受体。 \n DOPG / POPC / POPS 常用磷脂：DOPG 带负电，POPC 中性，POPS 带负电；脂质电荷影响膜插入效率与受体构象。 \n ICL3 第三个胞内环，位于 TM5 与 TM6 之间。长度与序列容忍度高，是插入融合伴侣的经典位点。 \n 刚性基准（rigid fiducial） 与目标蛋白刚性连接、用于提供颗粒对齐参考的模块；本文用的是 β-内酰胺酶 + BLIP-II。 \n BLIP-II β-内酰胺酶抑制蛋白 II，与 β-内酰胺酶高亲和结合，用来给基准模块再加质量。 \n 共翻译插入 在蛋白还在核糖体上合成时就插入脂双层/纳米盘，而不是先表达再 reconstitute；本文声称这是增溶的关键。 \n FSEC fluorescence-detection size-exclusion chromatography：用荧光检测的尺寸排阻色谱，判断膜蛋白是否单分散、有无聚集。 \n DMF / 数字微流控 digital microfluidics：用介电润湿在电极阵列上移动纳升级液滴，做分液、混合、反应与纯化。 \n split-GFP（DET tag） 把 GFP 拆成两半、分别挂在目标蛋白与检测试剂上，只有两者靠近才发光——用于定量表达与纯化。 \n BRIL 来自细胞色素 b 562 的稳定化融合伴侣，常加在 GPCR 的 N 端以改善折叠与表达。 \n DHODH 螺旋 二氢乳清酸脱氢酶的 N 端双亲性膜锚定螺旋，本文用它促进受体与纳米盘的初始结合。 \n FSC / gold standard 傅里叶壳层相关；冷冻电镜分辨率的标准判据，常用 0.143 阈值（gold standard）。 \n Cα RMSD 叠合后主链碳原子的均方根偏差，衡量两个结构的几何一致性。 \n apo 状态 无配体（未结合激动剂/拮抗剂）的受体状态，构象通常更柔性、更难稳定。 \n DBTL Design–Build–Test–Learn，合成生物学常用的迭代闭环。 \n ZM241385 A 2A 受体的高亲和力拮抗剂，本文用于锁定拮抗剂结合态。"}, {"id": "sec-refs", "h": "引用与延伸阅读", "t": "本报告页码均指该 PDF 的页码（29 页）。原文是 bioRxiv 预印本，未同行评审。 \n\n \n Guilliam, T. A., Jakimowicz, A. K., Manni, M. M., Gaber, Z. B., Paris, G., Hardwick, S. W., Cooper, L., Chirgadze, D. Y., & Ost, T. W. B. Rapid Production and Cryo-EM Structure Determination of GPCR-Nanodisc Complexes via Cell-Free Synthesis . bioRxiv (2026-10-23). doi:10.64898/2026.10.21.760646 —— 本文。 \n Shah, N. R. et al. A novel fusion tool to enable G protein-coupled receptor structure determination. Acta Cryst. D82(6), 655–663 (2026). doi:10.1107/S2059798326003785 —— 9T9P 的来源；本文的构建策略与对照结构。 \n Collu, G. et al. Cryo-EM structure of a single-chain β1-adrenoceptor-AmpC β-lactamase fusion protein. J. Struct. Biol. 218(3), 108349 (2026). doi:10.1016/j.jsb.2026.108349 —— 同策略在 β 1 AR 上 4.2 Å。 \n Singh, S. K., Agrawal, M., Pattanayak, A., Baidya, M., & Kumari, P. Strategic advances for cryo-EM structural studies of small (\u003c100 kDa) GPCRs. Commun. Biol. 9, 237 (2026). doi:10.1038/s42003-026-09516-y —— 小 GPCR 电镜策略综述。 \n Köck, Z. et al. Biochemical characterization of cell-free synthesized human β1 adrenergic receptor cotranslationally inserted into nanodiscs. J. Mol. Biol. 434(16), 167687 (2022). doi:10.1016/j.jmb.2022.167687 —— 共翻译纳米盘插入的方法学根基。 \n Köck, Z. et al. Cryo-EM structure of ... (2024); 与 Merino, F. et al. Cryo-EM structure of a cell-free synthesized full-length human β1-adrenergic receptor in complex with Gs. Structure 33(11), 1867–1877.e5 (2025). doi:10.1016/j.str.2025.07.020 —— 大肠杆菌裂解液 CF + 纳米盘的两个里程碑结构。 \n Shimizu, Y. et al. Cell-free translation reconstituted with purified components. Nat. Biotechnol. 19(8), 751–755 (2001). doi:10.1038/90802 —— PURE 体系原始论文。 \n Bayburt, T. H., Grinkova, Y. V., & Sligar, S. G. Self-assembly of discoidal phospholipid bilayer nanoparticles with membrane scaffold proteins. Nano Lett. 2(8), 853–856 (2002); Denisov, I. G. et al. JACS 126(11), 3477–3487 (2004) —— 纳米盘与 MSP 的原始文献。 \n Kawate, T., & Gouaux, E. Fluorescence-detection size-exclusion chromatography for precrystallization screening of integral membrane proteins. Structure 14(4), 673–681 (2006). doi:10.1016/j.str.2006.01.013 —— FSEC 方法原始论文。 \n Mendoza-Hoffmann, F., Guo, C., Song, Y., Feng, D., Yang, L., & Wüthrich, K. 19 F-NMR studies of the impact of different detergents and nanodiscs on the A2A adenosine receptor. J. Biomol. NMR 78(1), 31–37 (2024). doi:10.1007/s10858-023-00430-7 —— 去垢剂 vs 纳米盘对 A 2A R 构象平衡的影响，作者用来解释 3° 倾角。 \n \n\n \n 原文最值得记住的两句 \n \"Crucially, microfluidic screening confirmed that co-translational insertion into nanodiscs was strictly required for A2AR solubilization and affinity purification, de-risking reaction scale-up before committing higher reagent volumes.\"（p.16） \n \"At the current resolution, the ligand pose is consistent with previous structures, but detailed interactions such as hydrogen-bonding networks and ordered water molecules, which are important for structure-based drug design, cannot be resolved.\"（p.17）"}]}, {"id": "2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement", "dir": "2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement/", "html": "2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement/2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement.html", "pdf": "2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement/2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement.pdf", "raw": "2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement/RAW-2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement.pdf", "raw_name": "RAW-2026-Anthropic · BigHat Biosciences-Reasoning in the loop antibody lead optimization by probing mechanism and measurement.pdf", "title": "Reasoning in the loop: antibody lead optimization by probing mechanism and measurement", "title_zh": "在闭环里推理：通过追问机制与测量，优化抗体先导分子", "journal": "Anthropic · BigHat Biosciences", "year": "2026", "authors": ["Samuel Stanton", "Aaron Solomon", "Emily Delaney", "Melanie Montgomery", "Timothy Acker", "Ryan Henrici", "Cha
