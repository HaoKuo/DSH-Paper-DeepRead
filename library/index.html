ECqYe+fc3AiAgi3Pm7TsRlJbzff8vd1K5SqIidwwY8GpoeFrnu/xU7oHq+BocGgKJ234V/W/Cv615IVpLuwzvwr+tVlWZLi/WmOStdzgSnTVW8cl1CdWfx51UHoIPcZcGoGZQb3nLxn8G/Cv634V/W/Cv634V/WmXxRAI/YEAjxNnXGC+PRAfXQqHohEOLI8DjizQ25gHGFKe/ProXkGyPP8PzsgQR1VyN6T4d5YgFMAOnXN7XpoiGjsIVOe+NPyaiIHqZDGPXRhXoriHL1qgeusAGlmDGDcS8BYjyrl57ROuNVCFnWKWHYKfh0cJGrXYcc4zNCqWGcy8vae10Yg4IOR5Z6EPfbVda8BmY6+fM2HjabScaGppULOp3orOBORHM6N0ZuEEIrniHfrodI0UhC5WwyHvcaOssch4Er0/jz9BA4siunTGgbx4cp36nJsNw6AoLnHaVvPGjBZkEUFMdqtcY3FFouQO7q3SlCzZHvqqo9tgCFJ4caXAhAYXmKigztOuGIbCuQABX3bw8bdj0NGzBzpgAVfTXpthpS4ntK6ZcTARIAz0tfB9Jf1QBG8uOD/wDF1b0Ugxxgw851dkAYmoC9XKw8eurwFAMIHK4zczpOuzXJCHLHLOM9ennaB0E0V/8Aof/Z", "text": [{"id": "sec-tldr", "h": "结论先行：这篇论文优化的不是分子，是\"测量\"", "t": "绝大多数\"机器学习 + 湿实验\"闭环（lab-in-the-loop）的隐含前提是：仪器报出来的那个数字就是要优化的目标。本文把这条前提拆开： 仪器只记录信号，\"指标\"是分析程序在若干假设之下把信号算出来的结果 ；一旦指标名不副实，更聪明的模型和更多的数据都无法补救，因为模型学到的是一个错误的函数 原文 p.2 。 \n\n 作者用两个真实的抗体 lead optimization 战役（一个抗白蛋白 VHH，一个抗间皮素 scFv，2026 年 6 月 29 日到 9 月 4 日，7 轮、约 1,010 个设计、1,232 个设计孔）证明：一个通用 AI agent（Claude，在 Claude Code 中，主要由 S.S. 指挥）与研究团队一起，可以在战役进行中 审计自己的评价指标 ——回到每一根毛细管的原始曲线、建一个两种物理过程的模型、把\"表观熔解温度\"和\"聚集起始温度\"换成真正对应物理过程的量，并用 预注册的扰动实验 （改蛋白浓度、改升温速率）来检验模型。两个 lead 在亲和力、热稳定性、聚集三方面同时超过亲本。 \n\n \n 9× VHH 亲和力提升 K D 10.3 → 1.15 nM \n +8.4 °C VHH 已辨识熔点 T̂ m 62.2 → 70.6 °C \n +17.9 °C scFv 坍缩温度 T collapse 56.3 → 74.2 °C \n 1,232 设计孔（7 轮） 约 1,010 个设计变体 \n \n\n \n 表 A 　五条主结论与证据强度（本报告判读，非原文表述） \n \n \n 主结论 原文数字 证据位置 本报告判读 \n \n 两个\"热稳定性指标\"在各自 scaffold 上都没有测量它名字所指的东西 VHH：T agg 与熔解温度相关系数 ρ = −0.11（n = 129 孔）；scFv：T app m 与坍缩温度 ρ = 0.78、偏移仅 −0.2 °C p.9、图 4b–c、附录 D.3–D.4 原文 p.23 最强的一条。 不是在报告值上做统计，而是回到原始曲线用物理模型分解，证据链完整 \n 换指标后，模型可以跨轮预测新指标，却预测不了旧指标 VHH pK off ：ρ = 0.59（DR0→DR1）；T app m /T agg ：7 个模型全部 ≤ 0.07 p.8、附录 F.3 原文 p.8 诊断力有限但方向对。 \"不可预测\"既可能是标签概念错配，也可能是标签噪声大，作者用 QC 与原始曲线补了旁证 \n 模型能预言\"哪些量该动、哪些该不动\"，并在盲态数据上大体兑现 VHH 熔点：+0.08 °C（半载）/ +0.09 °C（快升温），预测 |Δ| \u003c 1 °C；scFv 坍缩：+2.0 °C（预测 2.8）/ +4.7 °C（预测 3–4） p.8 图 5c–e、附录 E 表 E1 原文 p.24 本文方法学上最硬的一步。 7 条预测里 4 条 confirmed、3 条 Failed，且失败被完整报告 \n 两个 lead 全面优于亲本 VHH：K D 1.15 nM、熔解 70.6 °C、无散射起始至 85 °C；scFv：K D 0.63 nM、坍缩 74.2 °C 表 1、图 6、附录 H 原文 p.5 数字成立但精度有限。 lead 值多基于 1–2 个孔，VHH 的聚集指标只有 1 个孔 \n 通用 agent 的直接推理优于现成专门模型 共折叠打分对 decoy 的 AUROC 0.13；IgBert \"自然度\" 与结合 AUROC 0.28（反相关）；NanoMelt 从 89 个设计中筛掉 0 个却高估 +5.5 °C p.10、附录 F 表 F1 原文 p.27 证据方向明确但外推要小心。 失败部分是任务设定所致（近亲变体、单一浓度、低 n），不等于\"专门模型无用\" \n \n \n \n 数字均转录自原文页面；\"本报告判读\"一栏为解读而非原文结论，已在正文用 [推断] 标出。 \n \n\n \n 为什么值得认真读 \n 这不是一篇\"我们用 AI 设计了更好的抗体\"的故事。它的真正贡献是给\"闭环优化\"补上了一块通常缺失的组件： 对目标函数本身的审计 。作者把这个张力写得很清楚—— 优化需要一个固定的靶，而科学需要改变成功判据的自由 。任何做 AI-for-science 闭环的人都会撞上这个问题，而这篇文章给出了一个可操作（虽然昂贵）的解法：预注册 + 可失败的检验 + 变更日志。"}, {"id": "sec-problem", "h": "问题：闭环优化的是\"标签\"，不是分子", "t": "Lead optimization 要在一个亲本序列 x 0 附近、用很少几轮找到满足\"规格（specification）\"的序列。规格由目标函数与约束函数组成，而这些函数几乎都写在 体外读出 上：一个几小时的热稳定性读数被当作\"数年货架期\"的代理，一个解离常数被当作\"药效\"的代理 原文 p.1 。问题是，规格通常在第一个设计轮之前就写死了，于是整个战役都押在\"代理指标与真实目标对齐\"这个假设上。 \n\n 作者给出的形式化很朴素但有用：优化环看到的既不是信号也不是物理，只是一个标签 y i = f ( x i ; ω) + ε i ，其中 ω 是协议（仪器、样品浓度、升温速率）。 重复测量能平均掉 ε，但无法纠正一个报告了另一种量的 f ——这就是计量经济学意义上的\"设定错误（misspecification）\" 原文 p.4 。 \n\n [背景] 同一个问题在临床试验方法学里有一个更古老的名字—— 替代终点（surrogate endpoint） ：严格的判据要求代理量捕获干预与终点的全部关系（Prentice, 1989），而这几乎无法用替代指标自身收集到的数据来验证；实践中只要求\"对代理量的效应能预测对终点的效应\"，但仅有相关性并不够，因为干预可以经由无关机制推动代理量（Fleming & DeMets, 1996）。作者把抗体 developability 指标接到这条文献线上，是本文少见但重要的一个理论定位。 \n\n更关键的是，作者给出了一个可在战役内部使用的 诊断判据 ：lead optimization 里每个设计都紧贴亲本，序列分布逐轮变化很小，所以如果标签反映了序列的一个稳定属性，用一轮数据训练的模型就应该能预测下一轮； 预测不了，更可能是标签的问题，而不是模型的问题 。这条判据后来成了整篇文章的引信（见第 5 节）。 \n\n Figure 1 原文 Figure 1 · p.2 · 图像块裁切 · 来自 PDF 原始页面 · 1397×757 px 原文 p.2 ↗ 放大 原文图注 · p.2 “Figure 1: How the binding and thermal signals are produced. Numbers link each state to a point on its curve. (a) Biolayer interferometry. White light sent down a sensor tip reflects from the tip surface and from the protein layer, and the two reflections interfere, so more bound antibody moves the reflected peak to longer wavelength. One peak is drawn for clarity. Fitting a kinetic model to the curve gives the on-rate 𝑘on, the off-rate 𝑘off and 𝐾𝐷. (b) nanoDSF with light scattering. UV light is absorbed by tryptophan, which fluoresces, and scattered by particles. Tryptophan emits at a longer wavelength when unfolding exposes it to water, and larger particles scatter far more, until aggregates settle out of the light path and the signal falls. The order of events is illustrative.” \n \n 逐面板解读 \n \n a BLI（生物层干涉） ：白光沿传感器尖端向下传播，从\"尖端表面\"和\"蛋白层\"两处反射并干涉；结合的抗体越多，反射峰越向长波移动。曲线上升段给出 k on 、下降段给出 k off 、二者之比给出 K D 。这里的关键是 \"整条曲线 + 1:1 动力学模型\" 才产生指标，指标不是仪器直接读出来的。 原文 p.2 \n b nanoDSF（差示扫描荧光 + 静态光散射） ：同一根毛细管里同时记录两条信号。色氨酸被 280 nm 激发后发光，展开把它暴露给水，发射波长红移 → 荧光峰位随温度上升；颗粒散射 266 nm 光，颗粒越大散射越强 → 散射强度随聚集上升。右下曲线里 ② 是荧光最陡点（T app m 的定义），另一条曲线上的 ② 是散射离开基线的点（T agg 的定义）。 原文 p.2 \n 图 灰点 = 抗原，蓝 = 折叠抗体，蓝螺旋 = 未折叠抗体，橙团 = 聚集体，紫色锯齿 = UV，橙色波浪 = 荧光。 注意图注最后一句\"事件先后顺序只是示意\" ——这句话是全篇的伏笔：一旦\"先熔后聚\"的教科书顺序不成立，两个指标就各自漂移了。 \n \n \n \n 读图注意 \n Fig. 1 不含任何数据，它是\"物理链\"的示意图，价值在于让人看清每个指标背后有多少假设。图 a 的干涉峰只画了一个（图注承认\"为清晰起见只画一个\"），真实的 BLI 是一条随时间变化的信号曲线；图 b 底部曲线在高温处的 下降 （聚集体沉降离开光路）是整篇 scFv 论证的物理前提——如果颗粒不沉降，\"坍缩温度\"这个概念就不存在。 \n \n \n\n \n 本文的核心赌注 \n 不在\"设计更好的序列\"，而在\"确认自己在优化什么\"。作者的说法是： 这不是 AI 在 lead optimization 中通常被设想的角色 ——最近的 agentic 战役主要用通用模型去编排已有的专用工具、把\"测什么、怎么读\"留给人；本文问的是，当人 + agent 一起对 活着的战役 做这件事时，能做成什么样。"}, {"id": "sec-setup", "h": "战役设置：7 轮、1,232 个孔、两个 scaffold", "t": "两个战役都在 BigHat Biosciences 的 Milliner 平台上运行：无细胞（cell-free）表达变体，然后高通量测结合、热稳定性、聚集、纯度与产量。所有实验与计算都在同一个系统记录（Reccy）里，agent 通过 MCP 连接器访问； 原始仪器曲线就存在汇总指标与 QC 标记旁边 ——这一条是后面所有分析的前提 原文 p.5 。 \n\n VHH 战役从 Ablynx 的 Alb8（115 残基抗白蛋白单域）出发，scFv 战役从 Medarex clone 7B1 衍生的抗间皮素片段（259 残基）出发。VHH 跑了 4 轮（DR0–DR3），scFv 跑了 3 轮（DR0–DR2），每轮 176 个设计孔（两块 96 孔板）外加 16 个端到端对照，数据周转中位 10 天（9–14 天，主要受 Twist 基因合成制约）。 \n\n \n 表 B 　可复现参数（转录自附录 A 与正文第 4 节） \n \n \n 项目 设定 出处 \n \n 亲本 / 长度 VHH：Alb8（115 aa）；scFv：7B1 衍生（259 aa，VL–linker–VH） p.5、附录 C.1 \n 轮次与规模 VHH DR0–DR3，scFv DR0–DR2；每轮 176 设计孔 + 16 端到端对照；共 1,232 设计孔 p.5、附录 A.2 \n 日程 2026-06-29 → 2026-09-04；周转 9–14 天（中位 10） 附录 A.2 \n 表达 E. coli 抽提物体外表达，亲和捕获，定量 附录 A.2 \n 结合 Octet BLI，单次 100 nM 分析物注射，1:1 动力学拟合，899 s 解离窗（scFv 末轮 2,400 s） 附录 A.3、I.1 \n 热稳定性 nanoDSF（UNcle），25 → 85 °C，0.3 °C/min；同时记录 BCM 荧光与 266 nm 静态散射 附录 A.3、D.1 \n 纯度 / 聚集 SEC-HPLC（day 0）+ 非还原毛细管电泳 附录 A.2 \n 原始规格 VHH：K D ≤ 1.6 nM、T app m ≥ 70 °C、T agg ≥ 70 °C、产量 > 10 µg/mL；scFv：K D ≤ 1.5 nM、T app m ≥ 65 °C、T agg ≥ 65 °C、产量 > 10 µg/mL 表 1、附录 A.1 \n 修订规格 VHH：pK agg ≥ 1.72、T̂ m ≥ 70 °C、HMW ≤ 5%；scFv：T collapse ≥ 70 °C、K D ≤ 1 nM、HMW ≤ 3%、纯度 ≥ 95% 附录 E.5、H \n \n \n \n \n\n Table 1 原文 Table 1 · p.5 · 矢量图形裁切 · 来自 PDF 原始页面 · 1464×389 px 原文 p.5 ↗ 放大 原文图注 · p.5 “Table 1: Original specifications, supplied baselines, in-campaign parent values, and the two leads. Yield is purified protein per volume of cell-free reaction. VHH melt values are identified melts ( ̂𝑇𝑚) and scFv values are as reported (𝑇app 𝑚), for reasons given in Section 7. The VHH lead shows no scattering onset across the thermal ramp, so its 𝑇agg is a bound. scFv parent values come from design rounds 0 and 1 (DR0, DR1), and comparisons in the text use DR1. Full tables with 𝑛are in Appendix H.” \n \n 怎么读这张表 \n \n 规格 前两行黑体是\"要达成的数\"，后面是\"实测到的数\"。注意 VHH 的 T agg 规格 ≥ 70 °C 而亲本只有 40–45 °C ——这条约束在战役开始时高出亲本 25–30 °C，几乎不可能通过\"在亲本附近做点突变\"达到，这是后面必须换指标的现实压力之一。 原文 p.5 \n supplied baseline vs in-campaign BigHat 交来的基线值与战役内重新测的亲本值不同，差异最大的是 scFv 的亲和力（15.2 → 3.7 nM）。作者两列都给出，比较时统一用 DR1。这本身是一个容易被忽略的方法学细节： 同一个亲本在不同批次里可以差 4 倍 。 \n bound 的写法 VHH lead 的 T agg 写作 \"no onset to 85\"，即右删失（right-censored）到升温上限之外；scFv lead 的 T app m 75.1 °C 是\"报告值\"而非辨识熔点——因为在这个 scaffold 上它测的是一个坍缩事件（第 6 节）。 \n 数字对不上是正常的 正文说 VHH lead \"melts 8 °C higher\"，表里是 62.2 → 70.6 = +8.4 °C；说 scFv \"precipitates 18 °C higher\"，表里 56.3 → 74.2 = +17.9 °C（坍缩温度，不在表 1 里，见附录 H 表 H2）。 摘要用的是约数，具体数在附录。 \n \n \n \n 这张表隐藏的矛盾 \n 表 1 里 scFv 的 lead 同时写着\"T app m 75.1 ≥ 65（过）\"和\"T agg 57.7 ≥ 65（不过）\"。按原始规格，这个分子 两个热稳定性约束里有一个没过 ；它之所以算成功，是因为战役中途把这两个约束换成了一个坍缩温度约束。这是全文最需要读者自己判断的地方，我们在第 10 节展开。 \n \n \n\n \n \n AI 重绘示意图（非原文图） \n 结构重绘自第 4–6 节叙述 · 悬停各阶段查看释义 \n \n \n \n \n 常规 lab-in-the-loop 是 01→02→03→04→05→01 的一条直线循环。本文的全部新意集中在 03 与 04 之间那个虚线框： 在把曲线压成标签之前，先问这个标签在量什么 ，并因此改动了 02（协议）与 04（指标）。这也是为什么这篇文章的结果不能只读成\"更好的抗体\"——闭环的形状本身变了。"}, {"id": "sec-design", "h": "设计库：像抗体工程师那样推理，用组合库检验推理", "t": "常规 lab-in-the-loop 用专门训练的模型提出\"预测分数最高\"的变体。本文换了一条路： 先建立关于分子在工作什么的假设，再把假设写成可以相互对照的文库 。每块板由四类 block 组成： 锚点（anchors） 是已知分子（谱系成员、文献变体、亲本），既是探索的质心，也是整块板的比较基准； 扫描（scans） 每次只改一个位置，因此每一孔都是亲本背景下的一次主效应； 假设块 用几孔检验一个明确说法； 格子样本与全因子 则系统采样若干突变的组合空间 原文 p.18 。 \n\n 第一步是 谱系先验 。战役第一天，agent 就把 VHH 匹配成 Ablynx 的 Alb8（115 个位置全同），把 scFv 追溯到 Medarex clone 7B1（相差 8 个位置）。这带来三样免费的东西：一个专利家族、一组已发表的后继替换（Alb23 的六个替换）、以及一个同家族 VHH 与白蛋白复合物的晶体结构。DR0 板上的谱系 block 每一孔都结合 ，其中最优的 round-0 读数 1.42 nM（亲本在 10 nM 量级），而整个战役最大的单点亲和力杠杆 E1A 直接来自 Alb1 原文 p.6 。 \n\n 第二步是 把替换当成化学问题 。氨基酸之间的差异是已知的，所以一个精心挑选的替换可以问出一个精确的问题。最漂亮的一例是 scFv CDR-H3 上的酪氨酸扫描：把 8 个酪氨酸分别换成苯丙氨酸（保留苯环、去掉羟基）和丝氨酸（保留羟基、去掉苯环）。结果 8 个 Phe 变体全部结合，8 个 Ser 变体只有 1 个结合 ——说明这里靠的是芳香环，不是羟基 原文 p.6 。同类的丙氨酸扫描还找到了两个\"打包修补\"Q91A 与 S245A，各自值 6–7 °C 的坍缩温度。 \n\n 第三步是 分离一个突变到底在动什么 。这是全文最关键的推理转折。作者最初的\"电荷假说\"是：往表面加正电荷可以加速与带负电的白蛋白结合。结果 在所有仍然结合的变体里，没有一个变体的结合变快 ——假说当场失败。但原始曲线指向了别处：E1A 与 S30R 合在一起几乎不动熔点，却把散射上升砍掉约 6 倍。于是新的解释成形：VHH 亲本在 低于自身熔点约 20 °C、仍处于折叠态 时就开始聚集，所以这里的电荷机制不是\"稳定折叠\"，而是\"让折叠的分子互相避开\"——这与单域抗体领域已知的、依赖 scaffold 的电荷策略一致。 \n\n 第四步是 把机制当作可组合的模块 。作用于不同物理过程的突变可以分别增益，让一处的收益抵消另一处的代价。scFv 上的例子很干净：回复到 germline 的稳定化突变会同时损失结合，把它们当作一个模块时， 不含 G230Y 与 Y238A 的 7 个设计里 0 个结合，含这两者的 15 个设计里 14 个结合 （G230Y 收紧结合，Y238A 抵消它在聚集上的代价）。同一轮里，一个只把 G230Y、Y238A 与两个打包修补组合起来的\"简单对照\"P， 打败了所有按新假设设计的变体 ，包括几个设计出来的二硫键 原文 p.7 。 \n\n Figure 3 原文 Figure 3 · p.6 · 图像块裁切 · 来自 PDF 原始页面 · 1469×784 px 原文 p.6 ↗ 放大 原文图注 · p.6 “Figure 3: Evidence for each design strategy. (a) Published relatives of Alb8. Dots mark substitutions (E1A in teal), shading marks the CDRs, and the right panel gives each molecule’s round-0 off-rate. (b) Schematic of the tyrosine scan on the scFv, with the fraction of variants that bound. (c) The six mutations of the VHH final-round factorial on the Alb8:albumin structure (PDB 8Z8V; Mima et al., 2024), colored by the property each moves most (teal off-rate, orange melt, purple aggregation), and the effect of adding each one, ±2𝜎(𝑛= 63, 52 and 57 designs). (d) The scFv final-round factorial on the base design (the round 1 control), by collapse temperature (where the sample falls out of solution) and off-rate. Triangles have p𝑘off ≥4.3. (e) Effect of reverting each somatic mutation to germline on the probability of binding, ±2𝜎(𝑛= 58). Positions that carry binding are in teal.” \n 逐面板解读 \n \n a 谱系即第一个文库 ：左列是 Alb8 及其亲属的序列（点=替换，阴影=CDR），右列每个分子的 round-0 off-rate。这条证据的价值在于 \"零失败率的假设\" ——所有谱系 block 都结合，说明用一个已被免疫系统与专利文献筛选过的家族作为起点，命中率远高于从头设计。 原文 p.6 \n b 酪氨酸扫描 ：Tyr（亲本，8/8 结合）→ Phe（去掉羟基，8/8 结合）→ Ser（去掉苯环，1/8 结合）。三个小图示把\"一个官能团一个官能团地拆\"的逻辑画得极清楚： 结论是\"这里需要一个环\"，而不是\"这里需要酪氨酸\" 。 \n c 六个突变的 2⁶ 全因子 ：左是结构（按\"它主要驱动哪个性质\"上色），右是三栏主效应森林图（±2σ）。读法：E1A 只动 off-rate（+0.60 pK off ），N16G 与 T77N 只动熔点（+3.9、+6.0 °C），E1A/S30R/V93R 各贡献 +0.4–0.7 的 pK agg 。n = 63、52、57 个设计。 这就是\"库是按机制设计\"的直接证据 ——同一个位置不会同时出现在三栏里。 原文 p.6 \n d 代价是可见的 ：scFv 末轮全因子画在坍缩温度 vs off-rate 平面上，三角形表示 off-rate 已触到测定下界（≥ 4.3）。黑色实心点是基准设计 P，空心方块是亲本。稳定化带来的横向移动（坍缩温度）与纵向移动（off-rate）方向相反，这就是 lead 只能取\"两个较温和的稳定化突变\"（T187Y、V196A）的原因。 原文 p.6 \n e 五个\"免费\"位置 ：把每个体细胞突变逐个回复到 germline，对结合概率的影响（±2σ，n = 58）。只有三个位置显著（ΔP(bind) −0.36、−0.30、−0.19，各 ±0.08），其余五个与零一致。 如果只看边缘结合率，会误以为\"几乎每个体细胞突变都必要\" ；在 Walsh 基下才看清只有三个承担功能。 原文 p.6 \n \n \n \n 读图注意 \n 面板 c 的结构图用 颜色编码\"这个突变主要影响什么\" ，这是结论的可视化而不是证据本身——真正的证据是右侧的效应量。另外注意 d 面板的三角形是 拟合下界 ，不是测量值：把它们当成\"更慢的解离\"来比较会给 scFv 前沿的亲和力端一个虚假的精度。最后，整张图的效应量都来自设计层的贝叶斯回归（附录 C.3），不是孔级 t 检验，因此\"±2σ\"是后验标准差。 \n \n\n \n 为什么用布尔格子 + Walsh 回归 \n 全因子在 k 个突变上有 2 k 个格子；96 孔板放不下 k = 8。作者的做法是用一个 scramble 的 Sobol 序列在 [0,1] k 里取 n ≪ 2 k 个点、以 0.5 为阈值二值化，得到一个\"每个突变都接近 50% 出现率、每对突变也接近 50%\"的低差异样本，从而把设计矩阵的条件数控制在 110.8（VHH DR0：13 个突变、37 个孔）。然后在 奇偶校验基（parity basis） 上做贝叶斯线性回归：把每个突变编码成 s j = 2 x j − 1 ∈ {−1,+1}，基函数是子集的乘积。这个基下\"加一个突变 j 的平均效应\"正好是 2 w { j } ，而且在一阶/二阶模型里它同时是 Banzhaf 值与 Shapley 值 ——也就是说报告的主效应天然就是一个可加归因。模型阶数由 MacKay 证据框架的边缘似然选，删失值（触底的 off-rate、触界的聚集速率）用 Tobit 形式的 EM 补齐 原文 p.19 。 \n \n\n 这套方法最实在的产出是一个 反直觉的修正 ：scFv 的 63 孔样本只覆盖了 8 个突变全部 256 种组合的四分之一，Walsh 回归显示只有 3 个位置承担结合，另外 5 个位置的边缘差异与噪声一致——而这 5 个里就有 4 个是后来的稳定化杠杆（S178N、A182D、T187Y、V196F，各估 +0.8 到 +1.6 °C 的报告 T agg ）。 如果按\"边缘结合率\"排序，这 5 个位置会被全部排除"}, {"id": "sec-diagnosis", "h": "诊断：一个指标什么时候是坏的", "t": "第 2 节那条判据在这里兑现。VHH 第一个设计轮之后，用序列、结构、蛋白语言模型特征构建的 七个 模型，从 round 0 预测 round 1 的 pK off 时 Spearman ρ = 0.59；同样的七个模型预测报告的 T app m 与 T agg 时， 没有一个超过 ρ = 0.07 。作者把这读作设定错误的signature：序列分布逐轮几乎不变，如果标签是序列的稳定属性，模型没有理由完全学不动 原文 p.8 。 \n\n 这不是孤证。BigHat 自己也独立提出了同样的疑问：在 916 个 VHH 孔中，质控把 491 个 标记为\"在 T app m 判定之前就已经聚集，或只有聚集\"；他们的科学家还提醒，T app m 高于 T agg 可能反映的是 聚集体的熔化 ，而 T agg 本身依赖蛋白浓度。round 1 之后 BigHat 交出了原始曲线，这些 QC 标记被证实。同时， 同一批曲线的简单摘要却可以跨轮预测（ρ = 0.38） ——说明信号确实在曲线里，只是被报告的指标丢掉了。 \n\n [背景] 聚集之所以不能用\"一个温度\"概括，是因为它是一个 不可逆 过程（Lumry–Eyring 图景）：聚集体很少解离，所以\"在某个温度上聚了多少\"取决于样品在这个温度上待了多久、以及有多少蛋白在场。热力学上这会让表观转变温度 下移而不只是变噪 （Lepock et al., 1992），而标准检验就是看它是否随升温速率或浓度变化（Sánchez-Ruiz et al., 1988）。本文的扰动实验正是这条经典判据的一次完整执行。 \n\n 于是问题从\"模型不够好\"变成\"这个指标在量什么\"。作者回到物理：一个被加热的蛋白能做两件事——快速、可逆地展开/复折叠（平衡过程，只取决于当前温度），以及与其他分子粘在一起（动力学过程，取决于它在每个温度上待了多久、有多少蛋白在场）。前者有一个自然的温度 T m ，后者没有。 \n\n Figure 2 原文 Figure 2 · p.3 · 图像块裁切 · 来自 PDF 原始页面 · 1397×366 px 原文 p.3 ↗ 放大 原文图注 · p.3 “Figure 2: How 𝑇app 𝑚 and 𝑇agg are computed, and how they respond to the protocol. Schematic of the textbook expectation, with shifts exaggerated. 𝑇app 𝑚 (orange dot) is the steepest point of the fluorescence shift. 𝑇agg (purple dot) is where the scattered light departs from its baseline, drawn here at an illustrative level. Halving the protein or heating faster moves 𝑇agg to higher temperature and leaves 𝑇app 𝑚 in place. Gray dashed curves repeat the reference conditions. The fluorescence is an equilibrium signal, so it has no memory of how the sample got there, while the scattering is kinetic and depends on the path.” \n \n 逐面板解读 \n \n 左 教科书期望 ：橙色是荧光（平衡信号），紫色是散射（动力学信号）；T app m 取荧光位移最陡点，T agg 取散射离开基线的点。灰虚线是参考条件。 原文 p.3 \n 中 蛋白减半 ：只有散射曲线右移（紫点 moves），荧光曲线不动。 这是\"用浓度扰动来判别指标类型\"的原始模板 ——本文末轮的预注册检验就是这条推理的直接执行。 \n 右 升温更快 ：同样只有散射右移，荧光不动。图注明确写了\"位移被夸大\"，所以这是示意图，不是任何一次实验的数据。 \n \n \n \n 读图注意 \n Fig. 2 描述的是 教科书期望 ，而本文的发现恰恰是：这个期望在两个 scaffold 上以两种不同方式失败了。在 VHH 上，散射起始 根本不跟随熔点 （\"moves\" 的是别的东西，是折叠态聚集的速率）；在 scFv 上，两个指标是 同一个事件 的两个读数，所以谁都不会\"stays\"。把 Fig. 2 当成数据图来读会正好错过全文的重点。 \n \n \n\n Figure D2 原文 Figure D2 · p.23 · 图像块裁切 · 来自 PDF 原始页面 · 1452×477 px 原文 p.23 ↗ 放大 原文图注 · p.23 “Figure D2: The thermal metrics across the final-round populations. (a) VHH DR3, standard-condition wells (n = 69): scattering onset against the identified melting temperature; onset sits near 40 °C regardless of the melt, the parent (open diamond) among the designs. (b) VHH DR3 load pairs (n = 41 designs): log10 κN at the neat loading against the same design at half loading; the dotted line is the first-order expectation (+0.30), the dashed line identity. (c, d) scFv DR2 (n = 101 and 108): reported Tapp_m and reported Tagg against the collapse temperature; both are summary statistics of the same event, about 10 °C apart.” \n \n 逐面板解读 \n \n a 散射起始与熔点无关 ：VHH DR3 标准条件孔（n = 69），横轴已辨识熔点（跨度 53–82 °C），纵轴拟合的散射起始。 所有点的高度几乎水平挤在 40 °C 附近 ，相关系数仅 0.08；空心菱形是亲本。这就是\"T agg 在斜坡上是一个伪装成温度的时间\"这句话的全部证据。 原文 p.23 \n b 速率是一阶的 ：同一块板上 41 个设计各测两种载量，横轴半载的 log 10 κ N 、纵轴标准载量。点云贴着\"一阶预期\"（+0.30）的虚线，中位下降 0.27。这意味着 κ N ∝ c，所以 κ N /c = k agg 在半载下应当不变——这正是末轮把\"pK agg 在半载下不动\"写进预注册预测的依据。 \n c–d scFv 的两个指标是同一事件的两次读数 ：报告的 T app m 对坍缩温度 ρ = 0.78、中位偏移 −0.2 °C；报告的 T agg 对坍缩温度 ρ = 0.74、中位偏移 −9.8 °C。也就是说 两个\"独立\"的规格实际是同一个阈值写了两次 ，而在 scFv 上哪条约束更严是 T agg （≥65 °C）——因为它比 T app m 低约 10 °C。 原文 p.23 \n \n \n \n 这张图为什么有说服力 \n 它不依赖任何模型：面板 a 是一张纯粹的散点图，任何人拿原始数据都能重画。面板 b 的\"一阶\"检验也不是拟合出来的，而是把同一块板上的同一批设计放在两个载量下对照。真正需要模型的是把 κ N 从散射曲线里提出来那一步，而作者在后面（附录 D.4）自己拆了这一步的可替代性。 \n \n \n\n \n \n AI 重绘示意图（非原文图） \n 判定规则重绘自第 6 节与附录 D · 每个分支给出该 scaffold 的实际选择 \n \n \n \n \n 这张判定树是全文的\"操作手册\"： 指标的合法性来自样品处在哪个物理区制，而不是来自仪器的默认输出 。三个分支对应三个不同的量纲（温度、速率的对数、温度），也正是为什么\"换指标\"不能只是换个软件设置，而要连带改协议（加浓度序列、加升温速率）。 \n \n\n \n 这条诊断逻辑的五处软肋 \n \n 不可迁移 ≠ 概念错配。 标签噪声大、重复性差、批次间漂移都会让跨轮预测失败。作者补了两条独立证据（BigHat 的 QC 标记、原始曲线摘要 ρ=0.38），这让结论比单靠 ρ 值更硬，但\"七个模型全部 ≤0.07\"本身仍不是决定性判据。 \n 跨轮比较里混着\"外推难度\"的变化。 附录 C.2 说 DR0\"大多是扫描\"（亲本背景上的单点突变），而 DR1–DR3\"大多是格子样本与全因子\"。也就是说模型不仅面对\"标签是否稳定\"，还要跨越\"突变数目\"的外推；而作者自己测到跨底盘边界的加性假设会崩掉约 5 °C。这两件事在 ρ ≤ 0.07 里是分不开的。 \n 散射强度的跨轮可比性本身有问题。 附录 A.3 明说 UV-266 衰减在不同仪器、不同半板之间是 0.50 / 0.25 / 0.13， 绝对散射强度不可跨 run 比较 。那么\"T agg"}, {"id": "sec-model", "h": "物理模型：把整条曲线读成两个过程", "t": "结合测定给了作者一个模板：不去看软件给的 k off ，而是把 1:1 动力学模型拟合到 整条 BLI 曲线，拟合出的速率才描述分子的内禀属性。为什么不用同样的方式读 developability？于是他们把每条热曲线建模成第 2 节里的两个过程。 \n\n 荧光报告发射峰的位置，折叠与未折叠分子发射在不同波长，所以观测峰是两个布居的平均： \n\n F(T) = (a N + s N T)·φ N (T) + (a U + s U T)·[1 − φ N (T)]　　(3) \n\n 每个状态有自己的缓慢漂移基线（截距 a、斜率 s），两个基线的差就是展开时的位移。 只有当前温度出现在式 (3) 里，所以 F 没有记忆 。把式 (1) 的 φ N 代入，拟合基线与 T m 、ΔH——T m 决定曲线在何处从一个基线跨到另一个，ΔH 决定跨得多陡。作者把模型给出的估计写成 T̂ m （已辨识熔点），以区别于软件报的 T app m 。 \n\n 散射报告的是颗粒，按式 (2) 累积，所以建模的对象是它 在仪器基线上的斜率 ： \n\n dS/dT = κ N ·φ N (T)² + κ U ·[1 − φ N (T)]²　　(4) \n\n 熔点以下 φ N ≈ 1，斜率就是 κ N （折叠态造成的增长）；熔点以上 φ N ≈ 0，斜率是 κ U （未折叠态造成的增长）。 平方项来自一个平均场论证 ：两个随机相遇的分子都为折叠态的概率是 φ N ²。S 在任一温度上的值是\"沿途累积的一切\"，也就是样品的历史—— 如果在 φ N 还接近 1 时散射就在上升，那么只有折叠态能负责 。这就是把两个过程分开的操作性判据。 \n\n 当样品在展开完成之前就沉淀时，没有熔点可报。散射曲线随聚集体长大而上升、随它们离开光路而下降，在某个温度 T peak 见顶，而这个峰温随蛋白浓度移动。把它校正到参考浓度： \n\n T collapse = T peak − γ c ·ln(c / c ref )　　(5) \n\n 斜率 γ c 在配对浓度上拟合（scFv 的末轮设计给出 γ c = −2.6 ± 0.4 °C 每 e 倍，c ref = 350 ng/µL），得到 坍缩温度 ——样品离开溶液的温度，标准化到参考载量。 \n\n Figure 4 原文 Figure 4 · p.7 · 图像块裁切 · 来自 PDF 原始页面 · 1469×565 px 原文 p.7 ↗ 放大 原文图注 · p.7 “Figure 4: Reading whole curves. Gray points are one well and colored lines are fits. (a) The VHH parent in the binding assay, with the fitted 1:1 kinetic model. (b) The VHH parent in the thermal assay, with Equations 3 and 4 fit to fluorescence (top) and 266 nm scattered light (bottom). Shading splits the scattering fit above the instrument baseline into the two terms of Equation 4. The dashed line is the reported 𝑇agg, which in this well (49.6 °C) falls later than the parent’s usual 40–45 °C, after the scattering has already tripled. (c) The scFv parent in round 1, fit the same way up to the scattering peak. 𝑇peak is shown before correction for concentration, and the dashed and dotted lines are the reported 𝑇agg and 𝑇app 𝑚. The fluorescence fit in (c) is descriptive, since the sample leaves solution before an unfolded baseline is reached, so its midpoint is not a melt (Appendix D.4). Numbers link the cartoons to the scattering curves.” \n \n 逐面板解读 \n \n a 把结合读成一条曲线 ：灰点是单孔原始信号，青线是 1:1 动力学拟合，阴影区分 association 与 dissociation。 拟合值 k off = 3.0×10⁻³ s⁻¹、K D = 9.2 nM 与表 1 里 10.3 nM 同量级（这是另一孔/另一轮）。要点是： 指标来自整条曲线，而不是一个斜率读数 。 原文 p.7 \n b VHH 亲本：先聚集，后熔化 。上排荧光在 60 °C 之后才有一个干净的两态转变（T̂ m = 62.3 °C），下排散射从约 40 °C 就开始爬。 关键在读法：这个散射上升发生在 φ N 仍接近 1 的区间，因此只能用 κ N （折叠态）项来解释。 图里虚线标的是软件报的 T agg = 49.6 °C——它落在这个孔的散射已经翻了三倍之后，说明这个\"起始温度\"完全取决于阈值设定。 原文 p.7 \n c scFv 亲本：一个事件 。荧光没有上基线（因为样品已经不在溶液里），散射先峰后落。 软件报的 T agg 与 T app m 两条竖线就夹着这个峰 ，峰温 T peak = 57.8 °C。这里对荧光的两态拟合是 描述性 的（图注明说\"its midpoint is not a melt\"），所以不能把它的中点当 T m 用。 原文 p.7 \n 1–3 小图把状态与曲线上的位置连起来：①折叠、②开始粘连/parting、③展开/unfolded 或沉淀/precipitate。注意 b 面板的 ③ 在散射曲线的峰后 （样品开始沉降），这是\"散射信号下降\"的物理原因。 \n \n \n \n 这张图是全文的转折点 \n Fig. 4b 与 4c 放在一起看，才能理解为什么\"同一个指标在两个 scaffold 上含义不同\"： b 里两个过程在温度上分离（40 °C vs 62 °C），c 里它们重合 。作者的整个指标替换方案（VHH 用 T̂ m + pK agg ，scFv 用 T collapse ）都是这一张图的两个分支。 \n \n \n\n \n \n AI 重绘示意图（非原文图） \n 曲线为定性示意（形状据 Fig. 4b–c 重绘，非数据）· 标注数字转录自原文 p.7 \n \n \n \n \n 同一台仪器、同一个测定、同一套软件输出，在两个分子上读出的物理完全不同： VHH 上两个过程在温度上分开了约 20 °C，scFv 上它们重叠成一个事件 。一旦看清这一点，\"哪个指标该保留\"就不再是口味问题——VHH 上 T agg 与熔点无关（所以它不是稳定性），scFv 上 T app m 与 T agg 是同一件事（所以不能算两条约束）。右图散射峰之后的信号回落，是聚集体离开光路的结果——这也是\"没有上基线\"与\"中点不是熔点\"的物理原因。 \n \n\n \n 作者自己拆掉的部分（读这篇论文最容易漏） \n \n 平方项不是机制。 作者明说这是\"现象学拟设（phenomenological ansatz）而不是导出的速率律\"：它忽略了混合相遇与聚集体的后续生长；用 对 φ N 线性 的形式拟合效果一样好（中位 R² 0.85 对 0.83，κ N 的 Spearman 0.91）。 \n 散射对浓度的依赖接近一阶，不是二阶。 字面上的\"两个折叠分子相遇\"应给出二阶，而实测 log 10 κ N 在半载下只降 0.27（一阶预期 0.30）。所以平方项只是让 φ N 的形状进入拟合，不能当成分子机制。 \n κ U 不可辨识。 加入混合项 φ N (1−φ N ) 会让 κ U 变得很差，所以 没有任何指标建立在 κ U 上 。 \n κ N 的\"温度依赖\"不稳。 59% 的 VHH 孔被 BIC 偏好一个温度依赖的 κ N ，但表观活化能不是分子的稳定属性（组内相关系数 ICC = 0.38），所以只报告窗口平均速率。 \n 拟合质量一般。 散射拟合在 590 个有 pK agg 的孔上中位 R² 0.76，平坦轨迹更低，作者自己说\"单孔的速率只是近似\"。"}, {"id": "sec-test", "h": "判决性检验：把预测写在板子跑之前", "t": "模型若要值得相信，必须做出 可能失败 的预测。这里的预测非常尖锐： 平衡量应该无视样品浓度与升温速率，动力学的量不应该 。一个\"因为可以被预测所以被选中\"的指标，没有任何理由通过这个检验——这句话是全文方法论的支点 原文 p.8 。 \n\n 于是协议本身要改。标准测定每根毛细管只有一个浓度、一个升温速率， 用它根本检验不了模型的预测 。两个战役的末轮都跑了：同一批设计在两种载量（标准与半载）于一块板，两种升温速率（0.3 与 1.0 °C/min）于另一块板。BigHat 提议放慢第二个速率，agent 要求放快——理由是快升温会跑赢聚集、可能在坍缩之前露出展开转变——BigHat 同意了。等温保持（isothermal hold）被推迟到有哺乳动物材料之后，因为无细胞材料浓度不到 1 mg/mL；四分之一载量也太稀。为提供额外毛细管， 合成规模翻倍 。协议记录写在 2026-08-12，预测文件写在 2026-08-19，两块板跑完之前 原文 p.24 。 \n\n \n 表 C 　预注册预测的记分卡（转录自附录 E 表 E1；判定栏为原文判定） \n \n \n 预测 指标 预注册值 实测（配对中位 [IQR]） 判定 \n \n 半载下熔点不变 VHH T̂ m |Δ| \u003c 1 °C +0.08 [−0.25, +0.60]，n = 74 确认 \n 快升温下熔点不变 VHH T̂ m |Δ| \u003c 1 °C +0.09 [−0.25, +0.60]，n = 55 确认 \n 半载下聚集速率不变 VHH pK agg ≈ 0 −0.03 [−0.28, +0.24] log，n = 41 确认 \n 散射起始随载量移动 VHH onset 应当移动 −4.8 [−8.0, −2.0] °C，n = 49 未通过（符号相反） \n 散射起始随升温速率移动 VHH onset 应当移动 +6.7 [+4.1, +8.9] °C，n = 49 移动，但与日效应混淆 \n 半载下坍缩温度 +2.8 °C scFv T collapse +2.8 °C +2.0 [+0.6, +2.7]，n = 74 方向确认，幅度约 70% \n 快升温下坍缩温度 +3–4 °C scFv T collapse +3–4 °C（评分时写为 +2 至 +6 区间） +4.7，n = 42（45 对毛细管为 4.45） 高于预注册区间，落在事后区间内 \n κ N 在半载下减半 scFv log 10 κ N 未预注册；一阶预期 −0.30 −0.41 [−0.64, −0.04]，n = 51（第二估计量 −0.32） 与 IQR 一致 \n 报告的 T agg 跟随坍缩 scFv T agg 随坍缩移动 +1.8（载量）、+6.2（速率） 确认 \n 报告的 T app m 在两种扰动下都乱 scFv T app m 应当乱 −1.1（载量， 与坍缩方向相反 ）；+1.6（速率，与坍缩同向） 载量确认，速率未通过 \n 可解的两态中点不变 scFv 两态 T̂ m |Δ| \u003c 1 °C −1.4（载量，n = 20）；+2.4（速率，n = 21） 未通过 \n \n \n \n 原文把最后两行与 VHH onset 半载那一条一并列为\"三条失败的预测\"，并明确指出快升温组的移位受日效应污染。 \n \n\n Figure 5 原文 Figure 5 · p.8 · 图像块裁切 · 来自 PDF 原始页面 · 1397×411 px 原文 p.8 ↗ 放大 原文图注 · p.8 “Figure 5: Parents and leads, and the test of the model. (a) VHH and (b) scFv fluorescence (top) and 266 nm scattered light (bottom) against temperature, averaged over each molecule’s wells in one round. The scFv parent is from round 1 and its lead from round 2. (c–e) Paired shifts per design at half the protein concentration (half load) and at the faster ramp, for the VHH identified melt, the VHH scattering onset and the scFv collapse temperature. An equilibrium quantity should hold and a kinetic one should move. Bars are medians, gray bands are predicted ranges (in d, the predicted direction), the dotted line is a predicted value, and points beyond the axes are drawn at the edge (𝑛= 74 and 55, 49 and 49, 74 and 42).” \n \n 逐面板解读 \n \n a VHH：lead 几乎不散射 。上排荧光里 lead（橙）的转变比亲本（灰）晚约 8 °C，下排散射里亲本从 40 °C 起就一路爬升到 1.2×10 5 ，而 lead 的曲线贴着基线（几乎是一条 0 线）。 这是\"lead 的 T agg 只能是下界\"的视觉依据 ：没有起始可叫。 原文 p.8 \n b scFv：lead 在溶液里多待 18 °C 。上排荧光里亲本的曲线在 55 °C 附近开始下折（样品离开溶液导致），lead 的转折点推到 74 °C 附近；下排散射峰从约 57 °C 移到约 75 °C。 注意亲本的荧光在坍缩后是下降的 ——这正是\"没有上基线、中点不是熔点\"的图形证据。 原文 p.8 \n c VHH 熔点：不动 。每个点是一个设计在半载（或快升温）下的配对位移，柱子是设计中位数。两个条件下中位都压在 0 附近， 灰带是预注册的 ±1 °C 范围 。这是\"平衡量\"的定义性行为。 \n d VHH 散射起始：动了，但半载方向反了 。快升温下中位 +6.7 °C（预期方向），半载下中位 −4.8 °C（反方向）。 这个\"失败\"是全文最诚实的一处 ：作者没有把它解释掉，而是明确写成 refuted on sign，并指出日效应没有被分离。 \n e scFv 坍缩：动，且幅度接近预测 。半载 +2.0 °C（预测 +2.8），快升温 +4.7 °C（预测 +3–4）。柱子右侧的灰带就是预注册区间；注意点数在 y 轴上被截断（超出坐标轴的点画在边缘）。 \n \n \n \n 这组图不能证明什么 \n 三种比较的质量不同。 scFv 的载量对 相隔约两小时； VHH 的载量对 共用板设计但相隔约 19 小时，journal 里记录了 onset 对比上的\"run-day\"项； 两种升温速率 在两个战役里都跑在不同的天，没有仪器对照，因此一个约 +5 到 +7 °C 的日效应与速率对比 一比一地混在一起（aliased） 。作者据此把速率移位与由它推出的浓度次序、活化能一并标为\"混杂\"。熔点结论不受影响，因为熔点在跨日之间也保持稳定——这恰好也是\"平衡量\"的又一个定义性表现。 \n \n \n\n \n 为什么说这是\"判决性\"的 \n 如果模型错了，最可能的失败模式是\"什么都动\"或\"什么都不动\"。实际结果是有结构的： 平衡量精确不动（+0.08 / +0.09 °C），动力学的量按预测的量级移动（2.0 vs 2.8；4.7 vs 3–4），而被替换掉的那些报告指标行为混乱 （T app m 在载量下朝坍缩的反方向走）。三条失败预测里，两条（VHH onset 半载、scFv 两态中点）恰恰都是模型本来就没有承重的那部分。这是\"通过了一个尖锐检验\"而不是\"没有反例\"。 \n \n\n \n 但预注册这一步也没有完全守住 \n \n 评分时两次放宽。 半载坍缩预注册是 +2.8 °C ，实测 2.0 [0.6, 2.7]——点预测 落在报告的 IQR 之外 ，却被记为\"confirmed in sign, 70% of size\"。快升温预注册是 +3 至 +4 °C ，实测 4.7，评分时把区间改写成\"+2 至 +6\"然后记为落在区间内。作者把改写写在了表 E1 里（这一点值得肯定），但形式上这就是事后调整评分规则。 \n VHH 的\"熔点不动\"几乎是必然的。 预测区间是 |Δ| \u003c 1 °C，而熔点本身的重复标准差约 0.6 °C、实测位移只有 0.08–0.09 °C。这是一个很容易通过的零假设， 信息量低于两条\"动了\"的确认 。 \n 真正干净的确认是零假设那几条。 11 行记分卡里，3 条失败、1 条日效应混淆；通过得最漂亮的是\"平衡量不动\"，而它的先验概率本来就高。读这篇论文时， 不要把\"通过预注册\"直接等同于\"模型被证实\" 。"}, {"id": "sec-results", "h": "结果：两个 lead 与它们所在的前沿", "t": "两个 lead 都在亲和力、热稳定性与聚集三项上超过亲本，并保持产量与纯度 原文 p.9 。 \n\n \n 表 D 　两个 lead 对亲本与原始/修订规格（转录自表 1 与附录 H 表 H1、H2） \n \n \n 指标 VHH 亲本 Alb8 VHH lead CAND_L45P_S31R scFv 亲本（DR1） scFv lead P_dose_010A \n \n off-rate，pK off 2.49（4 孔） 3.39（2 孔） 2.95（4 孔） 3.96（2 孔） \n K D 10.3 nM 1.15 nM 3.7 nM 0.63 nM \n 熔点（VHH 用 T̂ m ，scFv 用报告值） 62.2 °C 70.6 °C 54.6 °C 75.1 °C \n 聚集 / 坍缩 T agg 40–45 °C；pK agg −0.39 无起始至 85 °C（右删失）；pK agg +2.00 （1 孔） T agg 50.5 °C；T collapse 56.3 °C T agg 57.7 °C；T collapse 74.2 °C \n HMW / 回收 2.8% / 70% 未检出 / 57% 4.2% / 59% 2.3% / 74% \n 产量 43 µg/mL 51 µg/mL 16 µg/mL 41 µg/mL \n 原始规格 K D ≤ 1.6 nM、T app m ≥ 70、T agg ≥ 70、产量 > 10 K D ≤ 1.5 nM、T app m ≥ 65、T agg ≥ 65、产量 > 10 \n 修订规格 pK agg ≥ 1.72、T̂ m ≥ 70、HMW ≤ 5%、K D ≤ 1.6 T collapse ≥ 70、K D ≤ 1 nM、HMW ≤ 3%、纯度 ≥ 95% \n \n \n \n 括号内为原文给出的孔数 n。VHH 的 pK agg 修订阈值 1.72 等于\"底盘（chassis）\"设计的实测值（3 个已辨识孔）。 \n \n\n VHH lead 带 8 个突变：一个同时降低聚集的亲和力杠杆（E1A）、三个熔点杠杆（N16G、T77N、L45P）、两个边缘电荷聚集杠杆（S30R、V93R）、一个对聚集影响很小的边缘电荷（S103R）、以及一个来自 6 孔扫描的界面残基（S31R）。它的 off-rate 慢 0.90 log，K D 1.15 nM；T̂ m 70.6 °C，高出约束 0.6 °C，约等于一个重复的标准差；K D 相对约束的余量只有 0.14 log ，而该 run 在 DR2→DR3 之间的参考漂移有 0.20 log ——按不同参考，lead 的 K D 会是 1.0、1.15 或 1.6 nM。 \n\n scFv lead 在 P（亲本 + Q91A、G230Y、Y238A、S245A）上再加两个稳定化残基（T187Y、V196A）。它的坍缩温度 74.2 °C 对亲本 56.3 °C（+17.9 °C），但对 P 只高 2.3 °C，落在 1.2 个重复标准差之内 。作者给出的选择理由很坦率：P 在所有 9 个 DR2 孔上都超出测定底噪，所以它的亲和力只是上界；lead 是\"被测量到的那一个\"。P 有更好的亲和力界，另有两个设计的某单项热指标更好，而 T187Y 花了 0.32 log 的 off-rate 换一个未被分辨的坍缩收益。 \n\n Figure 6 原文 Figure 6 · p.9 · 图像块裁切 · 来自 PDF 原始页面 · 1355×460 px 原文 p.9 ↗ 放大 原文图注 · p.9 “Figure 6: Final-round designs against the revised specifications. (a) VHH: off-rate against the aggregation metric p𝑘agg. (b) scFv: off-rate against 𝑇collapse, where the sample falls out of solution. Dashed lines are two of the constraints and shading marks designs that clear them. Open circles are aggregation rates at a fitting bound, and open triangles have p𝑘off ≥4.3. The scFv parent is from round 1. Gray points fail a constraint not plotted (melt, high-molecular-weight species, purity or yield). Of the 26 scFv designs that pass, 7 have a measured 𝐾𝐷 and 19 have p𝑘off ≥4.3. Labeled designs mark the ends of each frontier (Section 7).” \n \n 逐面板解读 \n \n a VHH 的通过区 ：横轴 pK agg （越大越慢），纵轴 pK off （越大越慢）。虚线是两条约束（pK agg ≥ 1.72、pK off ≥ 3.12），青色区同时满足。实心黑点是 lead （2.0, 3.39）。空心菱形是亲本（−0.39, 2.49）。灰色点违反一条未画出的约束（熔点、HMW、纯度或产量）。 原文 p.9 \n b scFv 的通过区 ：横轴 T collapse ，纵轴 pK off 。三角形是 pK off ≥ 4.3 的 下界 （不是测到的值），这一栏里挤着 51 个设计。标出的两个端点是前沿的两头：3.3 nM / 81.2 °C（3 孔）与 77.0 °C 且 pK off ≥ 4.3（1 孔）。 原文 p.9 \n n 26 个 scFv 设计通过修订规格 ，其中 7 个有实测 K D 、19 个靠 pK off ≥ 4.3 计入。而对 原始 规格，113 个末轮设计里 0 个 在\"有实测 K D \"的口径下通过（15 个过 K D 、84 个过 T app m 、17 个过 T agg ，但三个一起时为零）。 \n \n \n \n 读图注意 \n 这张图是 前沿（frontier）而非排序 ：作者提名的是\"每个轴上都测干净\"的设计，而不是某个轴上走得最远的设计。 三角形不是更强的结合，而是测不出更弱的解离 ——把三角形与实心点混在一起排\"最强亲和力\"会得到错误的结论。另外，青色区是事后画的（阈值来自修订规格），它不构成对新分子的盲态预测。 \n \n \n\n [推断] 这张图真正说明的是 \"优化没有单一最优解，只有一条权衡前沿\" 。两个战役结束时都停在一条前沿上：一侧是亲和力的极限（受测定分辨率约束），另一侧是热稳定性的极限（受可变域的固有稳定性约束）。lead 的位置是 一个治理决定 ——选\"每个轴都测干净\"而不是\"某个轴最极端\"——这恰好是研究者而非 agent 的职责，也印证了第 9 节的分工叙述。 \n\n \n \"提升几倍\"取决于拿谁当基线 \n 摘要里的\"约 9 倍\"（VHH）与\"约 6 倍\"（scFv）是相对 战役内重测的亲本 说的（10.3 → 1.15；3.7 → 0.63）。若改用 BigHat 最初交来的基线值，同样的 lead 分别是 14 倍 （16 → 1.15）与 24 倍 （15.2 → 0.63）。同一份数据能讲出三倍差距的故事，原因是亲本本身在不同批次间就差了 4 倍（表 1）。HMW 也一样：scFv lead 2.3% 对 DR1 亲本 4.2% 是\"改善\"，对 DR0 亲本 2.3% 则 完全持平 （附录 H.1 自己点出）。这不是造假，而是提醒： 读这类战役的百分比时，先问基线是哪一次运行的 。"}, {"id": "sec-models", "h": "专门模型 vs 直接推理：一张难看的记分卡", "t": "作者没有回避\"为什么不用现成模型\"这个问题，而是 在战役内把每一类专门模型都跑了一遍，并且做前瞻评分 ：用早期轮次训练，在下一轮数据上按事前写好的预测文件打分 原文 p.26 。 \n\n Figure F1 原文 Figure F1 · p.27 · 图像块裁切 · 来自 PDF 原始页面 · 1452×459 px 原文 p.27 ↗ 放大 原文图注 · p.27 “Figure F1: The specialized models, scored prospectively. (a) VHH: rank correlation of the Gaussian process and the CNN trained on DR0+DR1 and scored on the 131 DR2 designs, per target, with 90% intervals; the refit metrics transfer, the reported metrics do not. (b) scFv: DR0 → DR1 (n = 50–116); reported calls for the CNN only, from the ensemble table. (c) VHH DR2: the same models inside the 120-well balanced lattice sample (light) and on the 30 designs outside it (dark). (d) The DR2 acquisition step: rank correlation between the design-time BOtied utility and its realized value on the 84 selected designs measured, for the mean of the two models, each model alone, and the corner utility (n = 98).” \n \n 逐面板解读 \n \n a VHH：重拟合的指标能迁移，报告的不能 。绿点=高斯过程，红点=CNN。off-rate、熔点、pK agg 三行的置信区间都远离 0；而 reported T m 与 reported T agg 两行贴着 0 线 ，CNN 的 reported T m 甚至到 0.13、reported T agg 到 −0.07。这张图是\"标签有问题\"最直观的可视化。 原文 p.27 \n b scFv：正好反过来 。reported T m 与 reported T agg 的 CNN 相关高达 0.78 与 0.70，坍缩温度 0.67，pK agg 只有 0.3 左右。同一个指标在两个 scaffold 上\"可学性\"完全相反——因为它在 scFv 上是坍缩事件的统计量，在 VHH 上几乎与分子属性无关。 \n c 在平衡的格子样本内部，所有模型都失灵 。浅色=格子样本内（120 孔），深色=格子外（30 个设计）。off-rate 从 0.9 掉到 0.1，pK agg 从 0.9 掉到 0.1 上下。 模型的跨轮排序能力主要来自\"整块板在动\"，而不是\"在板内分辨单个设计\" ——这是全文对专门模型最锋利的一句判断。 原文 p.27 \n d 采集函数没有排序信号 。BOtied 复合效用与它实现值之间的 ρ = −0.04（区间跨零），两个模型各自也不更好。 选出的 120 个设计整体很好 （在全历史中位于 0.95 分位），但好的是\"这一块\"，不是\"块内排序\"。 \n \n \n \n 怎样读才对得起作者 \n 这些失败不能读成\"专门模型无用\"。作者自己的解释更精确： 在近亲变体、单一浓度、低 n 的设定下，结构模型与语言模型的信号被淹没了 ；而\"格子样本内失序\"这件事，恰恰说明问题的形状是\"每个设计之间的差异太小、测量噪声太大\"，不是\"模型太弱\"。真正的教训是 先修测量，再谈模型 ——顺序反了，任何模型都会显得无能。 \n \n \n\n \n 表 E 　模型族的判决登记表（转录自附录 F 表 F1，判定为原文措辞） \n \n \n 组件 前瞻成绩 原文判定 \n \n 共折叠打分（ESMFold2 / Protenix / Boltz-2） scFv 对 decoy 的 AUROC 0.13；VHH 上 3 个模型有 2 个把 binder 排在 non-binder 之下 不能当过滤器 \n ProteinMPNN 生成 CDR-H3 3 个设计 3 个都不结合；逐位置偏好 2 对 2 错 用作生成器没帮上忙 \n IgBert 自然度 / PLM 嵌入 AUROC 0.28（回顾性），与结合 反相关 ；嵌入不如 one-hot 在这里没帮上忙 \n T m 代理（NanoMelt、pLDDT、FoldX） 89 个设计一个都没筛掉；预测 +6.5 °C 而实测 +1 °C 在这里没帮上忙 \n 高斯过程（observation-only） off-rate ρ 0.59 / 0.54；95% 区间覆盖率 0.96 / 0.99 有用；校准良好 \n 高斯过程（Tobit-EM 变体） 区间覆盖率 0.45，偏差 −0.9 log 已退役 \n CNN（16k 参数、5 种子集成） off-rate ρ 0.56；scFv 坍缩 0.67；pK agg 0.83 适合排序；未校准 \n 任何模型在平衡格子样本内 ρ 0.09–0.43 弱 \n BOtied 复合采集 ρ −0.04 [−0.22, +0.15] 选择集内无排序信号 \n 加性 Walsh 模型 底盘 off-rate 预测 3.29 vs 实测 3.15；hero block 熔点高估约 5 °C；DR3 新设计 ρ 0.95（off-rate，被 E1A 拆分抬高）、0.67（熔点）、0.78（pK agg ） 对 off-rate 与聚集有用；也用于设计下一块板 \n 谱系与文献先验 VHH 谱系 block 100% 结合；8 个 lead 突变里有 5 个来自这里 每孔产出最高 \n \n \n \n \n\n 表 E 最后一行的对比是全文最实用的结论： 在\"单位实验产出\"这个尺度上，谱系与文献先验远高于任何学习模型 。这不是说模型无用，而是说在数据极少、序列空间又极窄的 lead optimization 里，\"已经被免疫系统与专利文献筛过一遍的突变\"是信息密度最高的候选集。作者也承认这里有一个未被检验的替代解释： 增益可能来自设计的结构化（每孔都在检验一个有名字的假设），而不是来自\"推理\"这件事本身 。"}, {"id": "sec-appraisal", "h": "批判性评估：这篇论文站得住哪几条腿", "t": "强项 \n \n 问题选得准。 把\"代理指标\"当作研究对象，而不是把\"更好的模型\"当作答案。这是 AI-for-science 领域一个被系统性回避的问题。 \n 证据回到原始信号。 不是对汇总值做统计，而是对 916 + 352 根毛细管的整条曲线做拟合，并且把拟合的可替代性（线性 vs 平方、混合项、ICC）全部做了自检。 \n 预注册 + 失败报告。 11 条预测里 3 条明确写成未通过，并主动指出日效应污染。这在\"AI 做科学\"的文献里罕见。 \n 删失处理规范。 触底的 off-rate、触界的聚集速率、无起始的 T agg 全部写成 bound 而不是假装是测量值，并在表里标注 n。 \n 承认分工。 附录 G 用 journal 记录量化\"人类出现的位置\"，并明说记录只是下界（未写下的纠正看不到）。 \n \n \n \n 不确定处 \n \n 没有对照臂。 没有\"纯人\"、\"纯模型\"、\"随机库\"的并行战役，所以无法把结果归因给\"推理\"。作者在附录 I.4 明说\"我们没跑另一种方式设计的对照文库，因此说不清增益中有多少来自选择\"。 \n 规格是看到结果之后定的，而且阈值正好让 lead 过。 pK agg 定义于 7 月 30 日、T collapse 采纳于 8 月 10 日、预测归档于 8 月 13/19 日，但 最终阈值定于 9 月 3–4 日 ——在知道末轮分布之后。VHH 的门槛干脆就是\"底盘\"的实测值（pK agg ≥ 1.72，3 个已辨识孔），而 lead 以 +2.00（ 1 个孔 ）过线。作者说\"scFv 的阈值没有选择 lead（65 或 70 °C 选出同样 7 个）\"——这句话是真的，但不够：阈值是 照着让 lead 与它的祖先都能过 来定的。 \n scFv 换指标实际上放松了约束。 报告 T agg 对坍缩温度的中位偏移是 −9.8 °C，所以旧的 T agg ≥ 65 °C 大致等价于 T collapse ≥ 74.8 °C；新的门槛 70 °C 比它 松约 4.8 °C ，而 lead 的 74.2 °C 正好落在旧门槛换算值的下方约 0.6 °C——在 1.1–2.0 °C 的重复标准差之内。T collapse 的精度并不更好（作者自己说\"重复 SD 1.1–2.0 °C，不优于报告值\"），它胜在覆盖率（100% vs 80%）与跨轮漂移（−1.5 vs −8.0 °C），而这两个指标都是在 DR2——也就是选 lead 的那一轮——上测的。 \n 修订后的亲和力规格惩罚了更好的分子。 新规格是\"K D ≤ 1 nM 且 有实测量化 \"，于是 P（≤ 0.25 nM，上界，9 个孔）不合格，lead（0.63 nM，2 个孔）合格。lead 胜过 P 的理由因此是\"它被测到了\"。同时\"7/113\"（只数有实测 K D 的）与\"26/113\"（把 pK off ≥ 4.3 的下界也算进来）在同一段里并列， 读者容易把两个口径的收益加在一起 。 \n 统计精度。 lead 值基于 1–2 个孔；scFv lead 相对 P 的优势在 1.2 个重复标准差内；VHH 的聚集指标只有 1 个孔；VHH 的 K D 余量 0.14 log 小于批次参考漂移 0.20 log； 只换 γ c 先验就能让 scFv lead 移动 0.7 °C 。 \n 速率对比被日效应混淆。 两种升温速率跑在不同天、无仪器对照，日效应（VHH onset +5 到 +7 °C）与速率效应一比一 aliased；scFv 43/88 根快升温毛细管从未坍缩，因此移位只是下界。承载\"动力学的量会动\"这一结论的正是这一组被污染的数据。 \n \n \n \n 薄弱点 / 不能外推的地方 \n \n 样本 = 两个 scaffold、一个平台、一个合作方。 作者自己在附录 I.4 承认这是\"整个样本\"。 \n 关键诊断有一半是合作方先提出的。 BigHat 在 7 月 20 日的书面回答里就已经把规格表述为\"T app m 与 T agg 中更低的那一个\"，并提醒 T app m 高于 T agg 可能是聚集体熔化；他们也早就独立提出了可预测性方面的疑问。 物理模型与扰动检验是本文的新贡献，但\"指标有问题\"这个判断不是。 \n 增益可能主要由文献挖掘 + 1,232 个孔解释。 lead 的 8 个突变里有 5–6 个直接来自已发表亲属（E1A 来自 Alb1；N16G/T77N/L45P 来自 Alb23）。作者承认光谱系先验是\"每孔产出最高\"的来源——这恰好也是本文最不\"AI\"的部分。 \n 通过是在违背自家系统记录之后取得的。 lead 决策当时把 T agg 约束记为\"未达成\"；通过是后来把原始曲线读成\"右删失到 85 °C 以上\"才恢复的。方向可以辩护，但 这正是文章警告的那类动作 ：分析者用更好的模型覆盖了流水线的判定。区别在于他们把这步写下来了。 \n \"agent 的贡献\"不可复核。 \"agent 常急于分析、要靠人推才去看曲线\"是研究者的自述，journal 只能记录写下来的东西；作者也明说重定向可能没有记录。最高杠杆的几个决定（目标设定、把 DR2 从亲和力块改成降聚集块、最后一轮变\"贪婪\"以扩大 hero block）都是人做的。 \n 利益冲突与形式。 Anthropic 作者 + 自家模型 + 合作方平台 + 未同行评审的技术报告；结论\"通用 agent 的直接推理有价值\"与作者身份同向。原文没有标注期刊、DOI 或投稿/接收日期。 \n \n \n \n\n 三个必须自己回答的问题 \n \n 如果只换协议（加浓度、加升温速率序列）而不换指标，结果会差多少？ 本文把\"换指标\"与\"换协议\"打包在一起，读者无法分清哪一半带来了收益。这个消融实验没有做。 \n 谁来决定\"指标该换了\"？ 本文的答案是\"agent + 人的组合\"，但触发这个动作的前提是 平台把原始曲线开放给了 agent 。作者在讨论里点明这一点（原始数据、单一系统记录、可改的协议），并主张\"值得围绕 AI agent 重建实验数据基础设施\"——这既是最有行动价值的建议，也是最需要外部验证的论断。 \n 这套流程在小分子、细胞读出、动物实验上成立吗？ 本文的两个例子都受益于\"同一个信号里混着两个物理过程\"这个特殊结构。如果代理指标错在别的方向（例如体外活性与体内暴露无关），\"建物理模型 + 扰动检验\"这套解法的适用性会大幅下降。 \n \n\n [推断] 最稳妥的读法是把它当成 一篇方法学示范而不是一次性能基准 。它示范的不是\"Claude 能设计抗体\"，而是\"当 agent 拿到原始数据与可改协议时，它可以参与审计自己的目标函数，而且这个过程可以被记录、被预注册、被证伪\"。至于这件事是否比\"更好的生成模型\"更值，取决于你把稀缺资源投在模型上还是投在测量上——作者的立场明确（投在测量），但这一立场没有被实验直接检验。"}, {"id": "sec-relevance", "h": "与我相关：可以立刻借走的三样东西", "t": "一、指标审计清单（五个问题） \n 不需要建物理模型也能用。每当你（或你的 agent）准备优化一个实验读出时，先问： \n \n 这个数字是仪器直接输出的，还是分析程序算出来的？ 如果是后者，它的假设是什么？（本文：T app m 假设两态、可逆、平衡） \n 它依赖样品\"怎么走到这里\"吗？ 换一个浓度、换一个速率、换一个批次，它应该动吗？如果\"应该不动\"的动了、\"应该动\"的不动，就是设定错误的信号。 \n 同一批原始曲线里，还有没有被丢掉的信号？ 本文的 ρ = 0.38 说明：把曲线压成一个数，丢掉的信息仍然可以预测下一轮。 \n 两个\"独立\"约束是不是在测同一件事？ 相关系数 0.78 / 0.74 的两个指标合起来只提供一条信息。 \n 跨轮（跨批）可迁移性如何？ 如果序列分布几乎不变而模型学不动，先怀疑标签，再怀疑模型。 \n \n\n 二、预注册预测的最小模板 \n 本文的做法可以压缩成四行，成本极低： \n \n 写下 哪个量应该动、哪个量应该不动 （用\"平衡 vs 动力学\"这类物理判据，而不是\"我们希望能动\"）； \n 写下 方向与量级 （本文：半载 +2.8 °C，快升温 +3–4 °C）； \n 先归档再跑 （协议记录 8/12、预测文件 8/19，板子在之后跑）； \n 事后 逐条记分并公开失败 （本文 11 条里 3 条未通过）。 \n \n 关键不在预测有多准，而在于 它给了你一个可以说\"我错了\"的结构 。没有这个结构，\"换指标\"就会退化成\"换到能通过的那个指标\"。 \n\n 三、少孔多突变的因子设计 \n Sobol 阈值化采样 + Walsh（奇偶）基贝叶斯回归，能在 63 个孔里从 8 个突变的 256 种组合中找出\"只有 3 个位置承担功能\"。对任何\"候选组合爆炸、单次实验昂贵\"的场景（培养基配方、缓冲液、工艺参数、模型超参）都可直接照搬：先把每个因子编码成 ±1，用低差异序列保证每个因子与每对因子接近 50% 出现率，再在奇偶基上做带稀疏先验的回归。它的产出不是\"最优点\"，而是 每个因子的平均效应 + 每个交互项的系数 + 后验不确定度 ——正好是设计下一块板需要的东西。 \n\n \n 一个可检验的假设（如果你要做后续工作） \n [推断] 如果\"跨批可迁移性\"确实是代理指标错配的早期信号，那么它可以被做成一个 在线 QC 指标 ：每轮用历史数据训练一个轻量模型，监控它对最新一轮的秩相关。当某个读出的可迁移性突然掉到零、而同批次其他读出保持稳定时，应该优先怀疑那个读出的定义，而不是模型或批次。本文的 VHH 数据正好提供了这个信号的阳性样本（ρ ≤ 0.07 对 0.59），但缺少阴性对照（一个\"确实只是噪声大\"的读出）来确认特异性。"}, {"id": "sec-glossary", "h": "术语表", "t": "lab-in-the-loop 模型提设计 → 实验室测量 → 结果回训模型的闭环优化范式。本文的批判对象是它把测量值默认当成正确标签。 \n VHH / nanobody 骆驼科重链抗体的单个可变域（约 115 残基）。本文第一个 scaffold，亲本为抗人血清白蛋白的 Alb8。 \n scFv 单链可变片段，由 VL–linker–VH 组成（约 259 残基）。结构上两个可变域互相稳定，常被报道为\"难搞\"的格式。 \n T app m （reported T m ） 仪器软件报的\"表观熔解温度\"= |d(平均发射波长)/dT| 的最大点。只有在两态、可逆、平衡时才近似热力学 T m 。 \n T agg 软件报的\"聚集起始温度\"= 266 nm 散射离开基线的温度，取决于阈值算法、蛋白浓度与升温速率。 \n T̂ m （identified melt） 本文用两态模型（式 1+3）拟合整条荧光曲线得到的熔点估计，附 ΔH。 \n pK off −log₁₀(k off )，越大解离越慢、结合越紧。与 K D 通过 k on 相连。 \n κ N / κ U 式 (4) 中来自折叠态（native）与未折叠态（unfolded）的散射增长速率，单位是每 °C 斜坡的散射计数。 \n pK agg −log₁₀(k agg )，其中 k agg = κ N /c（按载量浓度标准化），越大聚集越慢。半载下应不变。 \n T collapse 散射峰温 T peak 按式 (5) 校正到参考浓度 c ref = 350 ng/µL 后的温度，即\"样品离开溶液\"的温度。 \n HMW high-molecular-weight，SEC 测到的高分子量（可溶聚集体）比例。 \n BLI bio-layer interferometry，生物层干涉。白光在传感器尖端与蛋白层两处反射并干涉，结合量改变反射峰位置。 \n nanoDSF nano differential scanning fluorimetry，微量差示扫描荧光；本文用 UNcle 仪器在 25→85 °C 以 0.3 °C/min 升温，同步测 BCM 荧光与 266 nm 静态散射。 \n 右删失（right-censored） 只知道真值超过某个界（如 T agg > 85 °C、pK off ≥ 4.3），不知道具体值。本文用 Tobit-EM 在回归中处理。 \n Walsh 基 / parity basis 布尔函数的傅里叶基。系数直接对应\"哪些突变的组合有交互\"，一阶系数 2w {j} 同时是 Banzhaf 值与（低阶时）Shapley 值。 \n 设定错误（misspecification） 用来拟合/优化的函数 f 报告的不是目标量。重复测量无法修正，只能回到原始数据与假设。 \n CAND_L45P_S31R / P_dose_010A 两个 lead 的内部编号。前者是 Alb8 + 8 个突变；后者是 P（亲本 + Q91A、G230Y、Y238A、S245A）+ T187Y + V196A。"}, {"id": "sec-refs", "h": "引用与延伸阅读", "t": "本报告引用页码均指 PDF 页面（31 页）。原文未标注期刊与 DOI，是一份 2026 年的技术报告。 \n\n \n Stanton, S., Solomon, A., Delaney, E., Montgomery, M., Acker, T., Henrici, R., Eid, C., Abrams, E. & Greenside, P. Reasoning in the loop: antibody lead optimization by probing mechanism and measurement . Anthropic / BigHat Biosciences 技术报告 (2026), 31 pp. 通讯作者 samuelstanton@anthropic.com。 \n Frey, N. C. et al. Lab-in-the-loop therapeutic antibody design with deep learning. bioRxiv (2025). doi:10.1101/2025.02.19.639050 —— 本文最直接的前作：同一个平台的\"模型驱动\"版本闭环。 \n Kotov, V. et al. In-depth interrogation of protein thermal unfolding data with MoltenProt. Protein Science 30, 201–217 (2021). —— 用拟合模型替代\"报一个 T m \"的先例。 \n Andrews, J. M. & Roberts, C. J. A Lumry–Eyring nucleated polymerization model of protein aggregation kinetics. J. Phys. Chem. B 111, 7897–7913 (2007). —— 聚集的动力学与浓度依赖。 \n Sánchez-Ruiz, J. M. Theoretical analysis of Lumry-Eyring models in differential scanning calorimetry. Biophys. J. 61, 921–935 (1992). —— \"不可逆聚集会让表观转变温度下移而不只是变噪\"的理论来源。 \n Poelwijk, F. J., Krishna, V. & Ranganathan, R. The context-dependence of mutations: a linkage of formalisms. PLOS Comput. Biol. 12, e1004771 (2016). —— Walsh 基与上位性的关系。 \n Jain, T. et al. Biophysical properties of the clinical-stage antibody landscape. PNAS 114, 944–949 (2017). —— \"red flag 数量随临床阶段下降\"，developability 代理指标的经验基础。 \n Prentice, R. L. Surrogate endpoints in clinical trials. Stat. Med. 8, 431–440 (1989); Fleming, T. R. & DeMets, D. L. Ann. Intern. Med. 125, 605–613 (1996). —— 本文把\"代理指标\"问题接到临床试验的替代终点文献上。 \n Bisht, H. et al. Agentic AI scientists are not built for autonomous scientific discovery. NeurIPS Position Paper Track (2026). —— 作者用来给自己的\"co-scientist\"定位的立场文章 盖与 ARI 0.78 的细胞分型 原文 p.4–7 ；在三例 AML 临床样本上复现了 FAB 亚型判读，并把测序成本估到 \u003c$5/样本 原文 p.7–8 。 \n\n 一句话： 它卖的不是\"更深的测序\"，而是\"更聪明的读段分配\" ——用一管引物，把测序预算从\"已经被看得太多\"的基因手里拿走，交给\"几乎没被看到\"的基因。 \n\n \n 100–140× 测序效率提升 11 M vs 140 M reads 达相近饱和度 \n 1/200× Shallow 模式深度 0.7 M reads，\u003c170 reads/cell \n 2–5× 稀有基因 UMI 提升 低丰度基因平均 1.9×，最高 5× \n $\u003c10 AML 单样本成本（作者估计） 测序 \u003c$5/样本，2–3 万细胞 \n \n\n \n 表 A 　五条主结论与证据强度（\"本报告判读\"一栏为解读，非原文表述） \n \n \n 主结论 原文数字 证据位置 本报告判读 \n \n cPCR 是一个可定量的\"分子对数编码器\" 输入 5 个 log → 输出 \u003c1 个 log（>10,000 倍压缩），端点信号 vs 输入 R²=0.99；96 重靶标中 69/96（72%）R²>0.95 p.3–4、Fig. 1j–m 原文 p.3 最硬的一环。 化学原理清楚（两相扩增）、公式可检验、在 5 个数量级上线性；但 96 重里 28% 靶标不达标，说明\"多重化成功\"仍依赖逐对引物 \n 接到 10X 3′ 文库上能压缩 1,000 倍动态范围 60 靶标试点：barcode 覆盖 >99%、动态范围 ↓1,000×；148 靶标：on-target 40%→70%，高丰度抑制 500–1,000×、稀有富集 5–10× p.4、Fig. 2c–d 原文 p.4 成立但剂量小。 这里报告的压缩/富集倍数是 10²–10³，与摘要的 \"100× efficiency\" 不是一个口径，后者混合了 panel 富集 \n 500 基因面板：读段减少 1/13 而稀有基因 UMI 增加 2–5× 11 M vs 140 M reads；低丰度读段占比 1.5%→7.4%，高丰度 43%→22%；UMI 覆盖中位数 64% vs 36%；两段模型过渡点 370 reads ≈150 UMIs p.4–5、Fig. 2e–k 原文 p.5 数字自洽且信息量最大的一张图。 两段模型把\"哪里压缩、哪里不压缩\"讲清楚了，也顺带暴露了高丰度基因 UMI 反而变少的代价 \n 2,000 基因面板在 1/3 测序深度下多检出 21% DEG，且更可重复 51 M reads；稀有基因 10.6× reads / 2.5× UMIs；UMI 覆盖 67% vs 27%；四个细胞类型合计 DEG 554→669；两供体共有的\"仅压缩检出\" DEG 占 45% vs 10X-only 21% p.6、Fig. 3 原文 p.6 论证链设计得最好的一条。 \"额外 DEG 是否假阳性\"用跨供体重复率回答（45% vs 21%），比单看 DEG 数有说服力；但 Log2FC 斜率 0.70 的衰减仍需解释 \n 1/200× 深度仍可做细胞分型与 DEG；AML 亚型可复现 0.7 M reads：barcode >96%、ARI 0.78（T+NK 合并后 0.97）、DEG 覆盖 79%（1/100× 下采样的 10X 只有 \u003c15%）；AML 600–800 reads/cell ARI 0.80–0.82，80 reads/cell 仍 85–92% 准确率 p.6–8、Fig. 4–5 原文 p.7 最有转化价值、样本最薄的一条。 PBMC 只用了 2 个供体、AML 只有 3 例，且没有独立病理/随访验证；\"复现诊断\"是 3/3 但 n 太小 \n \n \n \n 数字均转录自原文正文与图；\"本报告判读\"为解读，已在正文用 [推断] 标注。 \n \n\n \n 读这份报告前必须知道的边界 \n 本次提供的 PDF 只有 11 页主文 + 参考文献 ：Methods、Supplementary Note 1–3、Supplementary Fig. 1–4、Extended Data Fig. 1–7、Supplementary Table 5 都 不在这个文件里 。因此本报告能核对的只有正文与五张主图；凡是涉及\"反应条件怎么定、引物怎么筛、统计检验怎么做、成本怎么算\"的细节，都属于 本文件无法核实 。文中引用 Extended Data / Supplementary 的地方，本报告只能转述作者说法，不能当作已验证证据。"}, {"id": "sec-problem", "h": "问题：测序预算被一小撮高丰度基因\"征税\"", "t": "scRNA-seq 的成本结构有一个非常反直觉的形状： 真正决定\"能不能看见稀有转录本\"的不是测序仪的通量，而是丰度分布的动态范围 。作者引用的数量级是：人细胞内 mRNA 丰度跨 5–6 个 log；在典型 scRNA-seq 里，低于中位表达的基因（约占基因数 70%）合计只占 \u003c1% 的读段，dropout 率 50–100%；而 \u003c10% 的高表达基因吃掉 >95% 的读段 原文 p.2 。这意味着 你付的钱里绝大部分花在重复确认\"β-actin 还是很高的\" 。 \n\n 这个约束在\"细胞数 × 深度\"的乘积上是硬的。作者算了一笔账：10 M 细胞 × 50,000 reads/cell，仅测序就要 $120,000–250,000（UG100 或 NovaSeq X） 原文 p.2 ；而虚拟细胞模型需要的训练集是 30–100 M 细胞 原文 p.2 。所以问题不是\"测序仪不够快\"，而是\"每次读取的边际信息量在下降\"。 \n\n 已有的四条路线各自卡在不同的地方 原文 p.2 ： \n \n 靶向 panel 富集 （targeted Perturb-seq、HyPR-seq 等）：只测选中的基因，确实省，但它 不改变 panel 内部的动态范围 ——panel 里高丰度基因依然霸占读段； \n 杂交动力学归一化 （equalized cDNA library、normalized cDNA）：靠复性速率差压缩丰度，但只能削弱、不能定量，且序列依赖偏差大； \n DSN（双链特异核酸酶）消化 ：同样依赖动力学，偏差与不可控性更强； \n 直接加大深度 ：线性花钱，且在高丰度端边际收益极低。 \n \n\n \n [背景] 为什么这其实是一个\"信号处理\"问题 \n 把每个基因的丰度当成输入信号 x ，测序仪的输出是\"按 x 比例分配读段\"，等价于一个 线性 ADC ：输入动态范围 5 个 log，而读段预算只有有限的比特数，于是小信号被量化噪声（dropout）淹没。作者的做法是在采样之前插一级 对数压缩（log companding） ：把 10 5 的输入范围压到 \u003c10，再用同一套量化器去量化——这正是音频压扩、图像 gamma、HDR 编码（LogLuv）在做的事，作者也明确引了 Shannon、Huffman、Golomb 与 LogLuv 编码 原文 p.2 。区别只在于：他们不是用电路，而是用 一管限量引物 实现这个非线性。 \n \n\n 理解这一点，就能理解本文真正的主张边界： 它不增加细胞里的分子数，也不增加总读段数；它只改变读段在基因之间的分配 。所有\"更灵敏\"的说法，都必须读成\"在同样的总预算下，稀有基因分到的读段更多\"。这个区别在后面批判性评估里会反复出现。"}, {"id": "sec-idea", "h": "核心思想：用「限量引物」把指数扩增变成对数读出", "t": "cPCR 的化学基础是 非对称 PCR （asymmetric PCR / LATE-PCR） 原文 p.2 ：正向与反向引物不等量。作者的关键改动是把\"少量引物\"从\"副产品手段\"变成 定量的标尺 ，并刻意让反应进入一个很长、很稳的第二相。 \n\n 反应分两段。第一段（指数相）：两种引物都在，扩增是常规的指数增长，直到 限量引物 PL 被耗尽 。模板越多，PL 越早耗尽，留给第二段的时间越长。第二段（线性相）：只剩过量引物 PE，每一轮只延伸一条单链，产物 线性 增长。把两段接起来，终点产物是： \n\n [Amp] = [P L ]·(C + 1 − log 2 ([P L ]/[T])) = a·log 2 [T] + b 原文 p.3 Fig.1g \n\n 直觉版本： 指数相的长度本身就是 log 2 ([P L ]/[T]) 轮 ，而总循环数 C 是固定的，所以\"线性相 = C − 指数相\"对 log[T] 是线性的。作者特别强调这与常规 qPCR 的\"短暂线性相\"不同——qPCR 的线性相是试剂耗尽的副产物，而这里是被设计成 贯穿剩余全部循环 的定量区间 原文 p.2 。 \n\n \n \n AI 重绘示意图（非原文图） \n 机制重绘自 Fig. 1f–i 与公式 1g · 分步演示（← / → 或点数字切换） \n \n \n \n \n \n \n 1 先把两种引物做成不对称的 \n 过量引物 PE 决定\"线性相能跑多快\"，限量引物 PL 决定\"指数相什么时候停\"。两者的浓度比是这套方法的 唯一主旋钮 ：PE/PL 越大，压缩越狠；作者在原理验证里用 50，在高度多重化时降到 10，并进一步把 PL 降到 7.5 nM 原文 p.3–4 。 \n \n \n 2 指数相：模板越多，越早耗尽 PL \n 这一段与普通 PCR 无异。关键性质是 指数相的长度由模板浓度决定 ：起始模板越高，到达 PL 耗尽所需的循环数越少，因此剩余给线性相的循环数越少——但注意，模板高时线性相期间每轮新起的单链也更多，两个效应合并后，终点值仍单调上升，只是上升被 log 压平。 \n \n \n 3 线性相：把\"指数\"换成\"线性\"，信息就留在 log 里 \n PL 耗尽后只剩 PE，产物线性增长。四条曲线在图上变成 彼此平行、高度错开 的直线（Fig. 1i 的原始观察）：错开的距离正比于 log₂(模板浓度比)。这就是\"对数编码\"在物理上的样子——不是算出 log，而是让反应 只跑 log 那么多轮指数 。 \n \n \n 4 终点读出：产物浓度是模板对数的仿射函数 \n 公式里 a、b 是常数 原文 p.3 。作者在合成模板上实测：输入跨 5 个 log，端点信号与之线性相关 R²=0.99，整个 5 log 区间被压成 \u003c1 log 原文 p.3 。注意这个变换是 逐基因独立 的：反应不关心\"你是高表达还是低表达\"，只关心\"你和我的 PL 谁先耗尽\"。 \n \n \n 这张图要记住的一点 ：压缩不是靠\"识别高丰度基因再抑制它\"，而是靠一个 饱和机制 ——PL 被耗尽的时刻本身就是丰度的函数。因此它对所有基因一视同仁，也就不需要事先知道哪些基因该压（这正是作者强调的 \"unbiased\"） 原文 p.2 。 \n \n\n 作者把 cPCR 的性质归纳为三条 原文 p.2 ： (i) 无偏 ——压缩机制不依赖对表达水平的预设； (ii) 定量且逐基因独立 ——多重反应里每个靶标各自完成对数压缩，保留各自的定量关系； (iii) 可调 ——压缩程度由 PL 浓度等条件控制，可以在\"省测序\"与\"保灵敏度\"之间选点。这三条里，第 (ii) 条是最强的假设，也是后面批判性评估要重点查的地方： \"逐基因独立\"要求每个引物对的 a、b 足够接近，否则跨基因比较会被引物效率污染 。 \n\n \n 与既有方法的差别（读文献时最容易混淆的三点） \n ① 不是\"抑制高丰度\"（suppression），是\"重标定\"（re-scaling）。 DSN 与复性归一化是 去除 高丰度分子，会损失绝对定量；cPCR 不丢分子，只让每个分子的\"读段权重\"变成 log 函数。 ② 不是 LATE-PCR 的直接套用。 LATE-PCR 关注的是\"线性相做熔解曲线/定量\"，本文关注的是\"线性相的长度差编码了 log 丰度\"，并把它推到 >5 个数量级与几百重靶标。 ③ 与 targeted panel 是正交的两件事。 cPCR 必须靠引物才能实施（因此天然是 panel），但 panel 只是它的\"载体\"；panel 决定\"测哪些基因\"，压缩决定\"panel 内部怎么分配读段\"。这个区分在第 11 节会成为主要批评点。"}, {"id": "sec-method", "h": "方法：把一个现成的 10X 文库变成「可压缩文库」", "t": "把 cPCR 接到 scRNA-seq 上的难点非常具体： 扩增产物必须同时携带细胞身份（barcode）与分子身份（UMI） ，否则压缩之后无法回到单细胞。作者的 \"add-on\" 设计如下 原文 p.4 Fig.2a ： \n\n \n 基因特异引物 PL 落在 mRNA 转录本上、poly-A 位点上游 100–200 nt 处； \n 通用引物 PC 放在 Illumina read primer（R1）里，方向朝 barcode 一侧； \n 于是扩增子 = R1 + barcode + UMI + poly-T + 一段基因特异序列，压缩后的分子仍可被 CellRanger 按 barcode/UMI 计数； \n 嵌套 PCR（PL2/PC2） 替代原来的\"单链转双链\"步骤，把 on-target 读段占比从 40% 提到 70% 原文 p.4 ； \n 因为 PC 是所有基因共享的，在 500 基因面板里 PC/PL ≈ 500 × 15 = 7,500 倍 原文 p.4 ——这个极端的不对称逼着作者重做引物设计（热力学 + 二聚体最小化，改编自 SADDLE 的模拟退火算法） 原文 p.4 。 \n \n\n \n \n AI 重绘示意图（非原文图） \n 流程重绘自 Fig. 2a–b 与 Fig. 1f · 悬停各阶段查看说明 \n \n \n \n \n 这张图的要点不是\"五个步骤\"，而是 01 与 05 之间的那条虚线 ：压缩发生在 barcode 已经打好之后，因此参考数据与压缩数据 共享同一套细胞编号 ，可以做到逐细胞、逐基因的配对比较——这是本文所有\"R²=0.94/0.95/0.98\"类论证能够成立的方法学前提。换一种说法：它不是一个新的单细胞平台，而是 一个可以随时插入现有流程的\"读段重分配插件\" 。 \n \n\n \n 表 B 　可复现参数一览（全部转录自正文；Methods 不在本 PDF 内，故无法补全实验细节） \n \n \n 环节 参数 / 规模 出处 \n \n 原理验证（合成模板） PE/PL = 50；Taq + TaqMan 探针读出；输入 10 pM–100 aM（5 个 log）；每档 3 重复 p.3 Fig.1j–k \n 多重化优化 Taq 聚合酶 + Bio-Rad SsoAdvanced 抑菌缓冲液；4 重靶标测试 p.3 \n 8 靶标验证 PL = 15 nM，PE/PL = 10；R²=0.94–0.99 p.4 \n 96 / 192 靶标 96 个能量平衡引物，10 fM–100 aM；69/96 R²>0.95（83% R²>0.90）；人+酵母 96+96 双物种 R²>0.98 p.4 Fig.1l–m \n 单细胞面板（试点） 60 靶标（无嵌套）；barcode 覆盖 >99%（10 万 reads 内） p.4 Fig.2c \n 单细胞面板（148 靶标） 嵌套 PCR；on-target 40%→70%；高丰度抑制 500–1,000×、稀有富集 5–10× p.4 \n 500 基因免疫面板 486 基因 / 533 个 3′ 端 / 512 对引物（成功率 93%，覆盖 457 基因）；PL = 7.5 nM；测 11 M reads p.4 \n 2,000 基因面板 2,086 基因（占总丰度 18.7%）；2,395 个 3′ 序列；4 个 ~500 基因子面板；186 个重复靶标；测 51 M reads p.6 \n 参考数据集 10X 3′ mRNA；140 M reads；4,200 个细胞；≈33,000 reads/cell p.4 \n Shallow 模式 0.7 M reads（1/200×）；\u003c170 reads/cell p.7 \n AML 临床样本 Fluent（Illumina）PIP-seq；4 个样本（S0 健康、S1/S2 AML-M4、S3 AML-M2）；参考 38,000 reads/cell；压缩 600–800 reads/cell（1/50–60×）；最低下采样到 80 reads/cell（1/500×） p.7–8 \n AML 面板 1,000 基因免疫标记 panel（952 基因，1,084 靶标） p.7 \n 分析工具 CellRanger 比对 + 自定义程序；Harmony 共聚类；preseq 估计文库复杂度；两段模型拟合（Supplementary Note 3） p.6–7 \n \n \n \n 表中缺的是\"怎么定\"：引物筛选阈值、反应体积/循环数、纯化方式、测序饱和度口径、统计检验与多重比较校正，都在未提供的 Methods 里。 \n \n\n \n Add-on 的隐性成本：这张流程图表没画的部分 \n 流程看上去只多了两步 PCR，但真正的成本在 引物池 ：500–2,000 对引物要设计、合成、验证、平衡（原文 96 重的成功率只有 72%，500 基因的面板引物成功率 93%）；嵌套 PCR 多一轮循环与纯化；每个新 panel 都要重新做能量平衡与二聚体优化。作者的\"\u003c$5 测序成本\"只覆盖测序本身， 不含引物与人力 原文 p.8 。这一点在读成本结论时要一直记着。"}, {"id": "sec-fig1", "h": "第一张图：先证明\"分子真的能做对数变换\"", "t": "Fig. 1 是全文的地基：如果 cPCR 不是精确的 log 编码器，后面所有单细胞结论都不成立。它分三层论证—— 概念 （a–e：为什么压缩读段分配是可行的）、 机制 （f–i：两相扩增为什么等于对数）、 实测 （j–m：在合成模板与 96 重体系里到底准不准）。 \n\n Figure 1 原文 Figure 1 · p.3 · 混合裁切 · 来自 PDF 原始页面 · 1360×1364 px 原文 p.3 ↗ 放大 原文图注 · p.3 “Figure 1. Compression Sequencing enables accurate logarithmic transform and dynamic range compression in highly multiplexed assay.” \n \n 逐面板解读 \n \n a–b 压缩前后的基因丰度分布 ：横轴是拷贝数（1× 到 10 5–6 ×），纵轴是基因数。a 是原始分布——典型的右偏长尾；b 是压缩后——分布被挤成一个窄峰（1×–100×），左右两个灰色箭头写明机制： 左侧富集（enrich）、右侧抑制（suppress） 。这是概念图，不含量化数据。 原文 p.3 \n c 跨领域的类比 ：(i) 图像处理里像素值有 90×/9×/1× 三级，压缩后统一；(ii) 测序里各序列的丰度条长短相差几个 log，压缩后差不多齐平。作者用这个面板把\"压缩测序\"接到 Shannon 以来的编码传统上——它不是生物学的发明，而是把信号处理的一条老原则搬进了试管 原文 p.2 。 \n d 问题有多大（真实 10X 数据） ：(i) PBMC 单细胞数据里基因表达呈双峰分布，横轴跨约 5 个 log；(ii) 累积读段曲线—— 前 10% 的基因吃掉约 80% 的读段 ，剩下 90% 的基因分 20%。这两张小图就是全文的成本论证：阴影区那撮基因决定了测序深度，却几乎不提供分型信息。 原文 p.3 \n e 压缩后会长什么样（模拟） ：(i) 分布变成单峰窄分布（注意横轴仍是 10 −8 –1 的同一刻度）；(ii) 累积读段曲线接近线性——读段按基因数均匀分配。这是 模拟 ，不是实验；它的作用是定义\"理想压缩\"的靶子。 原文 p.3 \n f cPCR 的分子流程 ：PE（过量）与 PL（限量）夹住同一段模板 → 双引物指数扩增（Exp）→ PL 耗尽后只剩 PE 延伸，产生单链（Linear Amp.）→ 转成双链 → 上机。注意图里 \"Prolonged ('True') Linear Phase\" 的措辞：作者刻意把它与 qPCR 里\"试剂耗尽的短暂线性段\"区分开。 原文 p.3 \n g 转换公式 ：[Amp] = [P L ]·(C + 1 − log 2 ([P L ]/[T])) = a·log 2 [T] + b。它把\"两相扩增\"翻译成一个仿射变换： 斜率 a 由循环数与引物化学决定，截距 b 由 PL 浓度决定 。这个公式是本文所有\"定量\"主张的源头。 原文 p.3 \n h–i 决定性的对照 ：h 是标准 PCR——不同起始浓度的曲线都是 S 形 ，终点全部饱和到同一平台，所以终点读不出起始量（只能靠 Ct 值，而 Ct 在高循环数下不再线性）；i 是 cPCR——不同起始浓度变成 一组平行直线 ，在固定终点循环处读数，高低由起点决定。这一对面板是全文最漂亮的地方： 同样一台 qPCR 仪、同样的终点读数，只有引入限量引物，输出才从\"饱和\"变成\"对数\" 。 原文 p.3 \n j 原理验证的实时曲线 ：10 pM 到 100 aM 五个数量级 + NTC，每档 3 重复。可以看到 (1) 浓度越低曲线越晚起（指数相更长）；(2) 起得晚的最终也低，但差距被压得很小；(3) NTC 也有微弱信号——qPCR 的典型背景。 原文 p.3 \n k 端点读数 vs 输入浓度 ：双对数坐标上是一条直线，跨 10 −4 –10 1 pM（5 个 log），R²=0.99。 这是\"分子对数编码器\"成立的直接证据 ：输入变化 10 5 倍，输出只变化 \u003c10 倍 原文 p.3 。 原文 p.3 \n l 96 重体系的准确性 ：每一条彩色细线是一个靶标，横轴是靶标浓度（10 fM → 0.1 fM，即 100 aM），纵轴是归一化读段数。理想情况下 96 条线应该重合——图里确实收拢成一条带，但注意 带很宽 ，且浓度越低越散。 原文 p.4 \n m 拟合残差 ：log 10 残差基本落在 ±0.1 以内（虚线），换算成线性尺度是 CV\u003c30%。这是对\"定量精度\"最接近正面回答的面板——30% 的 CV 对 UMI 计数够用，对需要 2 倍效应的实验就偏粗了。 原文 p.4 \n \n \n \n 读图注意：这张图证明了什么、没证明什么 \n 它证明的是 ：在纯化的合成模板 + 单重/96 重条件下，终点信号确实与模板浓度的 log 线性相关，且这种关系在 5 个数量级上成立。 它没有证明 ：① 在真实细胞裂解液、几千种 cDNA 混杂的背景下还能保持；② 每个基因的 a、b 足够一致（图 l 的带宽本身就是反证的一半）；③ 压缩后的\"读段数\"仍然可以跨基因比较。 第 ③ 点是全文最容易被读者自行补全、但原文并未直接证明的假设 [推断]。另外，Fig. 1k 的 R²=0.99 是 单重 结果，多重化的 96 重里只有 72% 靶标达到 R²>0.95 原文 p.4 ——两个数字经常被混着引用。 \n \n \n 这张图在论证链上的位置 \n 它承担的是\" 原理可行性 \"这一环，而且承担得很干净：用 qPCR 仪这种人人有的设备、用合成模板这种人人能重复的体系，把\"两相扩增 = 对数编码\"从一个比喻变成一个可测的斜率。后面所有单细胞实验都建立在这个斜率上；如果斜率会随背景漂移，后面的一切都要重新标定。 \n \n \n\n 多重化的代价在这张图里已经露头：96 个\"能量平衡\"的引物、未做逐对优化的情况下，只有 69/96（72%） 靶标达到 R²>0.95， 83% 达到 R²>0.90 原文 p.4 ；两物种混合实验（96 人 + 96 酵母）里固定组信号保持恒定、变化组 R²>0.98 原文 p.4 。这说明： cPCR 本身是稳的，但\"多重化\"这一步会掉靶 ——而掉靶不是随机的，后面会看到它与引物效率、丰度都有关。"}, {"id": "sec-deep", "h": "第二张图：500 基因面板上的\"Deep Sequencing\"", "t": "这是全文信息量最大的一组实验。设计是：在同一个 PBMC 的 10X 3′ 文库上，先测一份 140 M reads 的标准参考（4,200 个细胞，≈33,000 reads/cell），再做一份 500 基因面板的压缩文库，测到 11 M reads（ 约为参考的 1/13 ），然后逐基因、逐 UMI 地比较 原文 p.4 。 \n\n 面板本身值得单独看：作者从 RefSeq 里所有注释剪接异构体出发，取 486 个基因的 533 个唯一 3′ 端序列 ，设计出 512 对 cPCR 引物（ 成功率 93% ，最终覆盖 457 个基因） 原文 p.4 。也就是说，从一开始就有约 7% 的基因\"设计不出来\"或\"验证不过\"——这是 panel 方法的结构性偏差，原文没有分析失败基因是否集中在某些丰度段。 \n\n Figure 2 原文 Figure 2 · p.5 · 图像块裁切 · 来自 PDF 原始页面 · 1600×1182 px 原文 p.5 ↗ 放大 原文图注 · p.5 “Figure 2. Compressed “Deep Sequencing” with >100x improved efficiency reveals 2-5x more transcripts in low-abundance genes” \n \n 逐面板解读 \n \n a Workflow 与扩增子结构 ：10X mRNA → Compression Sequencing → NGS → 单细胞分析。放大框里画的是引物位置： P C （通用过量）在 R1 一侧、P L （基因特异限量）在 3′ 基因序列一侧 ，中间依次是 BC（barcode）、UMI、pT（poly-T）。这解释了为什么压缩后还能按细胞计数。 原文 p.5 \n b 四步实验流程 ：10X 文库 → Compression PCR → Nested PCR → 文库制备/QC → Illumina 测序。嵌套 PCR 是\"可扩展性\"的关键补丁（见文字部分）。 原文 p.5 \n c Barcode 覆盖 ：Venn 图，两套数据共享 3,757 个 barcode，10X 独有 317、压缩独有 258。原文另称\"从 10 万 reads 起 barcode 覆盖 >99%\" 原文 p.4 。读法上要注意： 共享 3,757 并不等于\"99% 覆盖\" ——两者来自不同的稀释曲线口径，不能互换引用。 原文 p.5 \n d 动态范围压缩的直接可视化 ：蓝线是 10X 的丰度分布（横跨约 5 个 log），橙线是压缩后的（约 2 个 log），图上标了 ~5 logs → ~2 logs 。这是全文最直观的一张\"前后对比\"，对应文字里的\"~1,000 倍动态范围压缩\"。 原文 p.5 \n e 总读段与逐基因读段的双向变化（log₂ 尺度） ：Total 一列是负值（总 reads 约 −4.2、mapped 约 −4.6），Per-gene 一列是正值（reads 约 +2.7、UMIs 约 +0.9），右侧橙色箭头写 140× boost 。这是全文最关键、也最容易被误读的一张柱状图： 它把\"总预算减少\"和\"单基因得到更多\"并列 ，图注称两者合并为 140× overall enrichment。注意 140 不是\"精度提升 140 倍\"：把两个 log₂ 比值粗乘约得 10² 量级，精确分解依赖未随本文件提供的 Supplementary Note 3 [推断]。 原文 p.5 \n f 读段重新分配（箱内视角） ：低丰度基因的读段占比 1.5% → 7.4%（5×） ，高丰度基因 43% → 22%（约 2×） 。这才是在 panel 内部 能测到的纯压缩效应，量级是 2–5×，与 headline 的 100× 差两个数量级（见第 11 节）。 原文 p.5 \n g 逐基因散点 ：横轴 10X 表达（reads），纵轴压缩后 reads。虚线给出压缩趋势，图中标注\"compressed（~1.5 logs）vs original（~3 logs）\"——原始 3 个 log 的跨度被压到 1.5 个 log。低丰度端（左下）明显偏离趋势线向上，即\"被放大\"。 原文 p.5 \n h 分箱 + 两段拟合（reads） ：把 g 的散点按丰度分箱画箱线图，再叠一条两段模型曲线： 低丰度段斜率≈1（线性放大），高丰度段斜率\u003c1（对数压缩） ，拟合参数 k=6.1， 过渡点标在 370 reads 。这是\"压缩是自靶向的\"这一解释的原始出处。 原文 p.5 \n i 同上的 UMI 版本 ：纵轴换成压缩后 UMI，k=1.8，过渡点 220 UMIs 。UMI 的压缩比 reads 温和——因为 UMI 计数还叠了一层\"读段随机抽样\"，稀释了压缩。 这一张是\"灵敏度\"主张的核心图 ：低丰度端 UMI 被抬高。 原文 p.5 \n j UMI 层面逐基因解剖（8 个例子） ：每个基因给出 UMI 交集（蓝=10X、橙=压缩）与\"每 UMI 的读段数\"散点，右下角 k 是压缩因子。左侧高丰度基因（CD52 32,000 UMIs，k=0.60）压缩后 UMI 反而少了 （25.1k+6.9k → 6.9k+6.1k，约 32k→13k）；右侧稀有基因（CXCL3 80、CCL23 3）压缩后 UMI 多出约 3–12 倍（k=14–23）。 这张图是全文最诚实的图 ：它自己把\"信息不是单调增加，而是重新分配\"画了出来。 原文 p.5 \n k UMI 覆盖率的总体分布 ：小提琴图，10X 中位数 36% ，压缩 64% 。注意这是\"互相交集\"估计出的覆盖率（以两套数据 UMI 集合的并/交推算）， 不是绝对真值 ——原文未在本 PDF 中说明估计公式。 原文 p.5 \n l 面板规模的稳健性 ：整块 500 基因面板 vs 三个 250 基因子集，R²=0.92–0.96。说明\"抽掉一半靶标\"不会显著改变压缩后的读数——这是对多重化互相干扰的一个间接检验。 原文 p.5 \n \n \n \n 读图注意：三个最容易踩的坑 \n ① 140× 不是\"测量精度提升 140 倍\"。 它是\"总读段省了约 13–18 倍\"乘\"每个基因分到的读段多了约 6.5 倍\"的乘积；前者来自\"只测 457 个基因\"，后者才部分来自压缩。把它读成\"灵敏度 ×140\"会高估方法本身。 \n ② UMI 覆盖率 64% vs 36% 不是\"压缩让分子变多\"。 分子数没变，变的是\"被抽样到的概率\"。而覆盖率的中位数掩盖了分布：高丰度基因的覆盖率在压缩后是下降的（见 j 的 CD52）。 \n ③ 过渡点 370 reads / 150 UMIs 是拟合出来的，不是设计出来的。 它取决于 PL 浓度、细胞数、panel 组成与测序深度；换一个 panel 或换一个细胞数，这个点会移动。原文没有给出\"如何为新 panel 估计过渡点\"的配方（Supplementary Note 3 不在本文件内）。 \n \n \n 这张图真正的说服力在哪 \n 不在 140×，而在 j 面板的诚实 ：作者主动展示了 CD52 这类高丰度基因损失了一半以上的 UMI。一个只想卖方法的人不会放这张图。从证据角度，这反而让\"信息重新分配、而非凭空增加\"的核心叙事可信——读者可以用它反推方法的适用边界： 如果你关心的是高丰度基因的精确计数，压缩是负收益；如果你关心的是稀有基因的检出与分型，压缩是正收益 。"}, {"id": "sec-model", "h": "机制：压缩为什么是「自靶向」的", "t": "Fig. 2h–i 的两段模型值得单独拆开讲，因为它是全文唯一一个\"机制解释 + 定量拟合\"同时给出的地方，也是所有\"为什么能省\"论证的枢纽。 \n\n 模型只有一句话： 低丰度基因在整个反应里都没能让 PL 耗尽，所以它走完指数相、产物与输入成正比（等价于普通 PCR）；高丰度基因提前耗尽 PL，被迫进入对数段 。于是压缩这件事自动只作用于\"高丰度那一侧\"——不需要事先知道哪些基因高，也不需要按表达水平做任何预设。作者称这一点为 \"unbiased\" 原文 p.2 ，从机制上说确实是自洽的。 \n\n \n \n 数据转录自 Fig. 2h–i（未重新分析） \n 两段模型示意 · 过渡点与倍数取自原文 p.4–5 \n \n \n \n \n 读法 ：两段线都是\"读段随输入增长\"，但斜率不同。低丰度段斜率≈1（输入翻倍、读段翻倍，跟普通 PCR 一样）；高丰度段斜率\u003c1（输入翻 100 倍，读段只翻几倍）。 虚线是个\"反事实\"：如果没有这个拐点、全范围都做 log，低丰度基因会被一并压低，灵敏度反而更差 ——两段结构才是这个方法的精髓。 \n \n\n 把 Fig. 2e–k 的数字按这个模型排一遍，逻辑就清楚了： \n\n \n 低丰度端 ：线性放大 ≈6× 读段；再叠加\"只测 panel 内基因\"带来的读段集中，最终单基因读段增益约 6.5×，稀有基因的 UMI 平均 +1.9×、最高 +5× 原文 p.4 。 \n 高丰度端 ：读段被压 30× 的动态范围，高丰度读段占比 43%→22% 原文 p.4 ；代价是这些基因的 UMI 减少（CD52 例）。 \n 整体 ：总 reads 约 1/13–1/18 而每基因 reads 约 6.5×，作者表述为\"140× 总体富集\" 原文 p.5 。 \n \n\n [推断] 这套机制解释里最弱的一环是 \"逐基因的 a、b 相同\" 。公式对每个基因都成立，但 a（斜率）与 b（截距）实际由引物对的扩增效率、Tm、二聚体倾向决定。作者用\"能量平衡引物 + 逐对热力学优化\"压低这种差异，并用掺入参考序列做浓度校准 原文 p.4 ，但本 PDF 没有给出\"96 个靶标的 a、b 分布\"。Fig. 1l 里 96 条线并不完全重合（带宽较宽），提示逐基因差异是真实存在的——这也是为什么后面的单细胞比较都是\"逐基因 vs 10X 的同基因\"，而不是\"跨基因比较绝对水平\"。"}, {"id": "sec-fig3", "h": "第三张图：2,000 基因面板与\"更有底气的 DEG\"", "t": "500 基因面板证明\"能压\"，2,000 基因面板要证明\"压完还能做真正的免疫学分析\"。面板构成： 2,086 个免疫标记/签名基因 ，合计占 10X 文库总丰度的 18.7% ；拆成 4 个约 500 基因的子面板并行做，其中 186 个靶标在四个子面板里重复出现，用来做跨面板一致性检验 原文 p.6 。压缩文库测到 51 M reads（约为参考的 1/3） 。 \n\n 结果的关键数字：读段从高丰度端向低丰度端重新分配（高丰度 4.4× 减少、低丰度 5.1× 富集）；稀有基因获得 10.6× reads / 2.5× UMIs ；动态范围压缩 30× ；UMI 覆盖 67% vs 27% 原文 p.6 。这些与 500 基因实验方向一致、量级略有差异，说明压缩行为随 panel 规模变化但不会失效。 \n\n Figure 3 原文 Figure 3 · p.6 · 混合裁切 · 来自 PDF 原始页面 · 1184×842 px 原文 p.6 ↗ 放大 原文图注 · p.6 “Figure 3. Comprehensive immune profiling in a 2,000-gene panel allows ultra-sensitive and reproducible DEG analysis” \n \n 逐面板解读 \n \n a 不同面板规模下的富集倍数 ：四组柱（Immune 500、Immune 1,000、Gene Signature 1,000、Combined 2,000），绿=reads、黄=UMIs。读数：reads 富集约 6× / 6.8× / 12.5× / 10.6× ，UMIs 约 2.1× / 2.0× / 3.1× / 2.5× 。注意 reads 富集明显高于 UMI 富集 ——因为\"多读段\"并不能自动变成\"多分子检出\"，这一差距本身就是方法的天花板（见 i 面板的随机抽样项）。 原文 p.6 \n b 富集倍数 vs 表达丰度 ：横轴 10X 表达（UMIs），纵轴富集倍数（log）。低丰度端富集约 6–10×，随丰度升高下降， 过渡点标在 210 UMI ；高丰度端降到 1 以下（即\"被压缩\"）。这张图是 500 基因面板 Fig. 2h 的复现，说明两段行为不是单次实验的偶然。 原文 p.6 \n c DEG 重叠（核心图） ：五个 Venn，分别对应 B / T / NK / Monocytes / All cells；蓝=仅 10X，橙=仅压缩，中间=共有。读数：B 13/48/23、T 20/156/70、NK 14/86/42、Mono 32/185/59、All 79/475/194 。合计 DEG 从 554（10X） 增加到 669（压缩） ，即 +21% 。四个细胞类型分别为 +12% 到 +28%（原文 p.6）。 原文 p.6 \n d 多出来的 DEG 在哪个丰度段 ：横轴是 10X 的每个细胞 UMI 丰度分箱（0–0.01、0.01–0.1、0.1–1.0、1.0–10、10–100），纵轴 DEG 数，颜色分细胞类型，橙框=cPCR、蓝框=10X。关键读数： 增量几乎全部落在 0.1–1.0 UMI/cell 这一箱 （ 原文 p.6 \n e 共享 DEG 的效应量一致性 ：横轴 10X 的 Log2FC，纵轴压缩后的 Log2FC；图内标注 R²=0.94，拟合 y = 0.70x − 0.03 。注意： 正文同一处写的是“Log2FC R²=0.98” （p.6），与图内 0.94 不一致；正文还并列引用了 Extended Data Fig. 3p，两个数字可能来自不同比较，但本 PDF 无法核对 [推断]。这是全文最重要、也最被轻描淡写的一个数字： 斜率 0.70 意味着压缩后的效应量整体被衰减约 30% 。作者解释为\"10X 在近零 UMI 时比值膨胀\" 原文 p.6 ，但压缩本身也会衰减 log 尺度上的差异（见第 11 节）。 原文 p.6 \n f 跨样本可重复性（全文最巧的对照） ：同一套流程在两个生物学独立供体上各做一次标准 + 压缩测序，取\"两个样本都检出\"的 DEG 数。读数：B 约 5 vs 10、T 约 38 vs 14、NK 约 40 vs 10、Mono 约 50 vs 18、合计 约 115 vs 40 （压缩 vs 10X）。更关键的是重叠率： 压缩独有的 DEG 在两个供体间重合 45%，而 10X 独有的只重合 21% 原文 p.6 。如果压缩多出的 DEG 是噪声，跨供体不该重合——这是\"多出来的 DEG 是真的\"最有力的间接证据。 原文 p.6 \n \n \n \n 读图注意： c 与 e 面板的两处\"技术性陷阱\" \n ① Venn 图的数字不能直接相加比较\"谁更强\"。 \"仅压缩检出\"的 194 个 DEG 中，会有一部分在更深的 10X 里也能检出（只是没达到显著阈）；反过来，\"仅 10X\"的 79 个在压缩里可能是引物失败或压缩后 UMI 太少。真正可比的是\"在 相同测序预算 下谁多\"——而这点本文是用\"1/3 深度 vs 全深度\"做的，属于对压缩有利的不对称比较。 \n ② 斜率 0.70 不是小事。 如果读者要把压缩数据直接塞进现成的差异分析流程、并沿用同一套 fold-change 阈值（比如 |log2FC|>1）， 压缩数据会系统性地更难通过阈值 。原文只在讨论里用一句\"ratio inflation\"带过，没有给出校正方案——这是本 PDF 主文里最明显的一个\"未完成接口\"。 \n \n \n 为什么我认为 f 面板是这篇论文最该被同行学走的设计 \n \"我的新方法检出更多差异基因\"是单细胞方法论文里最廉价的主张，因为更深的测序、更宽松的阈值、更大的细胞数都能做到。本文的 45% vs 21% 提供了一个 不依赖 ground truth 的判别器 ：如果新增检出是真信号，它应该在独立生物学重复里重现；如果是噪声，重现率会掉到随机水平。这个对照不需要额外的湿实验，只需要再做一次样本 —— 任何声称\"更灵敏\"的方法都应该补这一张图。"}, {"id": "sec-fig4", "h": "第四张图：把省下来的深度花在\"更多细胞\"上", "t": "同一套化学可以往另一个方向用：不追求\"更深\"，而是把压缩带来的效率换成\"更浅但更多\"。作者把 500 基因面板的压缩文库只测到 0.7 M reads ——相对 140 M 的参考是 1/200× ，相当于每个细胞 \u003c170 reads 原文 p.7 ——然后问：这么浅还能不能分细胞、找 DEG？ \n\n \n \n AI 重绘示意图（非原文图） \n 两种用法对照 · 数字转录自 p.4–8 正文 \n \n \n \n \n 读法 ：这不是两种方法，而是同一个方法的两个操作点。作者的核心卖点也在这里—— 压缩把\"深度\"从硬约束变成了可调参数 。但也因此，Deep 与 Shallow 的所有数字都绑定在\"500–2,000 基因 panel\"这个前提下，不能外推到全转录组（作者自己把全转录组列为 future work）。 \n \n\n Figure 4 原文 Figure 4 · p.7 · 混合裁切 · 来自 PDF 原始页面 · 1167×706 px 原文 p.7 ↗ 放大 原文图注 · p.7 “Figure 4. Compressed “Shallow Sequencing” with 200x lower depth enables ultra-scalable scRNA-seq” \n \n 逐面板解读 \n \n a UMAP 对比 ：(i) 是 10X 全深度（140 M reads），(ii) 是压缩浅测（0.7 M，1/200×），坐标是同一套投影。四类细胞（B、T、NK、Monocytes）位置基本一致—— 但要注意 (ii) 是把压缩数据\"映射\"到 10X 的投影上 ，不是独立降维后再比，所以这张图证明的是\"标签可迁移\"，不是\"独立聚类得到同样结构\"。 原文 p.7 \n b DEG 覆盖（最有信息量的柱状图） ：四组柱分别是 10X 全深度、10X 1/10×、10X 1/100×、cPCR 1/200×。读数：B 细胞四组约 75 / 40 / 8 / 55；T 约 125 / 75 / 20 / 100；NK 约 100 / 55 / 20 / 90；Monocytes 约 170 / 135 / 45 / 130；Total 约 470 / 310 / 95 / 370（79%） 。关键对比： cPCR 在 1/200× 的深度下，DEG 覆盖超过了 10X 在 1/10× 的深度、远高于 1/100× 的 10X（\u003c15%） 。这比\"跟全深度比\"公平得多。 原文 p.7 \n c 效应量一致性 ：共享 DEG 的 Log2FC 对比，R²=0.95、斜率 0.95。注意与 Fig. 3e 的对比： 浅测模式的斜率是 0.95，深测模式是 0.70 。同一方法、同一 panel，斜率随深度变化——这提示斜率 0.70 更可能与\"高丰度基因在深测模式下被压缩\"有关，而不只是 10X 的比值膨胀（见第 11 节）。 原文 p.7 \n d 火山图互检 ：(i) 是 10X 的火山图，(ii) 是压缩的火山图；蓝点 = 压缩检出的 top 100 基因，(ii) 里橙点 = 10X 检出的 top 100，灰点是其余。两侧的\"对方 top 100\"都落在自己火山图的显著臂上，说明 两种方法挑出的强信号高度互认 。这是一个 rank-based 的一致性检验，不做绝对阈值假设。 原文 p.7 \n \n \n \n 读图注意： b 面板的对照设计值得学，但有一个口径要问清楚 \n b 面板是全文唯一把\"同等深度下的 10X 下采样\"和\"压缩\"放在一起比的地方，这是正确的对照思想。但 1/100× 的 10X 与 1/200× 的 cPCR 并不是\"同等深度\" ——前者是 1.4 M reads、后者是 0.7 M reads；cPCR 用更少的 reads 拿到更多 DEG，这才是它的主张。真正严格的对照应该是\"1/200× 的 10X 下采样\"，原文这里取的是 1/100×（对 10X 稍有利，因此不构成夸大）。另外，ARI=0.78 不算高，原文也承认要靠\"合并 T 与 NK\"才到 0.97—— 这说明 panel 在浅测时最难分辨的是 T/NK 这类转录组相近的细胞 。"}, {"id": "sec-fig5", "h": "第五张图：AML 临床样本，把\"$10/样本\"摆上桌", "t": "这是全文的\"落地\"章节，也是样本最薄、主张最大的一章。设计：3 例 AML 患者（S1、S2 为 M4，S3 为 M2）+ 1 例健康对照（S0），用 Fluent（Illumina）的 PIP-seq 做无微流控 barcoding 原文 p.7 ；先按标准深度测参考（ 38,000 reads/cell ），再对同一文库做压缩 + 浅测（ 600–800 reads/cell，1/50–60× ），并进一步下采样到 80 reads/cell（1/500×） 原文 p.7–8 。分析面板是 1,000 个免疫标记基因（952 基因 / 1,084 靶标）。 \n\n Figure 5 原文 Figure 5 · p.8 · 混合裁切 · 来自 PDF 原始页面 · 1334×1006 px 原文 p.8 ↗ 放大 原文图注 · p.8 “Figure 5. Compression Sequencing enables affordable AML diagnostics with in-depth transcriptomic analysis” \n \n 逐面板解读 \n \n a 四个样本共聚类的 UMAP ：标注了髓系（成髓细胞、成熟中的粒细胞）、单核细胞系、B / T / NK、红系（RBC）与血小板（Platelets）。三个 AML 样本的病理性母细胞（blasts）明显 溢出到健康细胞群之外 ——这是复现\"疾病状态\"的第一层证据。 原文 p.8 \n b 逐样本 UMAP 与 FAB 判据 ：S0（健康）无异常亚群；S1、S2 标出 >30% blasts、30–80% 单核细胞 （AML-M4 判据）；S3 标出 >30% blasts、\u003c20% 单核、>10% 成熟粒细胞 （AML-M2 判据）。这些百分比判据来自 FAB 分类 原文 p.7 ，作者用转录组 marker 把细胞分类后计算比例，再与判据比对。 原文 p.8 \n c 细胞比例 vs 深度 vs 标准测序 ：三组柱（总 blasts、单核母细胞、成熟粒细胞），压缩侧是 N=6 （1/50×…1/500× 六个深度），标准侧是 Fluent 参考。读数：S1 的 blasts 约 59% vs 68%、单核约 48% vs 62%；S2 约 66% vs 76%、51% vs 53%；S3 的 blasts 约 85% vs 81%、成熟粒细胞约 53% vs 46%。 趋势与量级都对得上，误差棒是跨深度的标准差 （不是生物学重复）。 原文 p.8 \n d 母细胞的 top-50 DEG 热图 ：三个 AML 样本的母细胞差异表达谱，行是基因（HLA-DRB5、MGST1、SH2D1A、IL12RB2、UBE2C、HLA-DQB1、CD40LG、TNF、CHI3L1、CST7、VNN2…），列是 S1/S2/S3。S3 与 S1/S2 的谱明显不同（S3 在 HLA-DRB5、MGST1、UBE2C 一列高），与\"不同亚型/不同克隆\"一致。 原文 p.8 \n e 治疗前后与深度的三角验证 ：SOCS1 与 WT1 两个基因，在 S1（治疗前）vs S2（治疗后）的母细胞上，分别用 1/50× / 1/200× / 标准 1× 三种深度展示。 SOCS1 在治疗后明显上调 （提示治疗诱导的转录调节，且未见母细胞清除）， WT1 轻度下调 （MRD 标志物，提示治疗有效）——两个方向相反的变化在三种深度下都成立，这是本文最有临床意义的一处观察。 原文 p.8 \n f M2 样本（S3）母细胞的火山图 ：上调端标注 HLA-DRB5（提示免疫调节）、MGST1、UBE2C、CHI3L1（与干性/不良预后相关），左端是下调基因（VNN2、SH2D1A、IL12RB2 等）。 原文 p.8 \n g 找到\"活跃周期\"亚群 ：用 MKI67 等细胞周期基因在 UMAP 上标出一个增殖亚群，三张图分别是压缩 1/50×、压缩 1/200×、标准 1×—— 三者在浅测下仍能定位到同一个亚群 。作者据此提出\"增殖压力 / 残留病风险\"的解释。 原文 p.8 \n \n \n \n 读图注意：临床结论的四个\"不足以\" \n ① n=3 不足以谈\"复现诊断准确率\"。 3/3 与随机猜对（1/2 或 1/3）在统计上无法区分；原文没有报告任何敏感性/特异性区间。 \n ② 判据是\"转录组代理形态学\"。 FAB 的 M4/M2 判据原本基于形态学与细胞化学（原始细胞比例、单核细胞比例、成熟粒细胞比例），本文用 marker 基因注释出的细胞类型去算这些比例， 没有报告与病理科盲法判读的一致性 。这既可能是优势（可自动化），也可能是循环论证（用同一套表达数据证明表达数据分类正确）。 \n ③ 图 c 的误差棒是 N=6 个测序深度，不是 6 个患者或 6 次独立实验 ，所以它衡量的是\"深度稳健性\"，不是\"生物学可重复性\"。 \n ④ 没有随访 / MRD 终点。 SOCS1 上调被解释为\"治疗诱导的转录调节\"，WT1 下调被解释为\"治疗有效\"，但没有任何临床结局（缓解、复发、生存）来验证这两句话——它们目前只是 与已知生物学一致的观察 ，不是疗效预测的证据。 \n \n \n 这一章真正的价值：把\"单细胞诊断\"的成本门槛具象化 \n 无论 n 多小，\"600–800 reads/cell 就能复现 M2/M4 的分型\"这句话如果成立，它改变的是 单细胞进入临床的经济学 ：作者估测测序成本 \u003c$5/样本（2–3 万细胞），连同 barcoding 的\"每患者 \u003c$10\" 原文 p.8 。这个数字是全文最容易被引用、也最需要打折扣的结论——它只算测序与 barcoding， 不算 1,000 对引物的合成验证、不算建库人力、不算临床样本处理与合规成本 。不过即使打上几倍折扣，它仍然把\"单细胞诊断\"从\"科研项目\"推向\"可负担检测\"的量级。"}, {"id": "sec-appraisal", "h": "批判性评估：它成立到什么程度", "t": "这篇论文的论证结构其实很清晰： 化学（cPCR 是 log 编码器）→ 文库（压缩能接在 10X 上）→ 生物学（压缩数据能做常规分析）→ 临床（浅测也能分型） 。四段里，第一段最硬，第四段最弱。下面按\"强项 / 不确定 / 不能外推\"三类拆。 \n\n \n \n 站得住的部分 \n \n 核心化学被独立、定量地验证。 公式有推导、两相有实时曲线、5 个数量级的端点线性 R²=0.99、96 重与 192 重（双物种）交叉验证。这是\"分子对数编码器\"这一提法能立住的地方 原文 p.3–4 。 \n 两段模型把机制和数据接上了。 低丰度线性、高丰度对数，过渡点可估计——这解释了\"为什么压缩只作用于高丰度基因\"，而且预测与数据方向一致 原文 p.5 。 \n 不回避代价。 Fig. 2j 主动展示 CD52 这类高丰度基因压缩后 UMI 减少；Fig. 2f 显示压缩只在 panel 内部带来 2–5× 的读段再分配。这种\"把不利数据放进主图\"的做法在方法论文里不常见。 \n DEG 真实性的内部对照设计得很好。 用两个独立供体的\"仅压缩检出 DEG\"重现率（45% vs 21%）来反驳\"多出来的都是假阳性\"，这比单看 DEG 数更有说服力 原文 p.6 。 \n add-on 设计降低采纳门槛。 barcode 在压缩前已打好，因此可与标准测序 配对比较 ——本文所有\"逐细胞、逐基因\"的论证都建立在这一点上 原文 p.4 。 \n 可调性是真的可调。 同一套化学从 Deep（11 M）到 Shallow（0.7 M）到 AML（600 reads/cell）到 80 reads/cell，覆盖两个数量级的深度并逐级报告退化 原文 p.4–8 。 \n \n \n \n 不确定处 / 需要补充的证据 \n \n 没有 \"panel-only、不压缩\" 的消融。 headline 的 100–140× 效率是\"只测 457 个基因\"与\"压缩\"两件事的乘积；panel 本身的读段集中效应有多大，原文没有单独测。而 Fig. 2f 里可归因于压缩的读段再分配只有 2–5×。这是全文最大的归因缺口 原文 p.5 。 \n 报告口径有一处小矛盾。 同一段话里正文给 Log2FC 的 R²=0.98，而 Fig. 3e 图内标注 R²=0.94；两处都没有说明是哪一组比较。这类细节不影响主结论，但提示读者：正文数字与图内数字应逐一对表后再引用 原文 p.6 。 \n Log2FC 斜率 0.70 没有解释清楚。 作者归因于 10X 在近零 UMI 时的比值膨胀；但同一方法的浅测版本斜率是 0.95，说明\"深度/压缩段位\"会影响斜率。没有校正方案，也没有讨论这对沿用固定 |log2FC| 阈值的下游流程意味着什么 原文 p.6 。 \n 跨基因定量是否被破坏，主文没说清。 压缩是逐基因的单调变换，但每个基因的 a、b 不同；因此\"同一细胞内基因 A 与基因 B 的读段比\"被改写。作者用标准流程做归一化与分型，并显示分型没问题，但没有给出\"何时可以、何时不可以把压缩矩阵当普通表达矩阵用\"的判据。 \n 过渡点与参数的可迁移性。 370 reads / 150 UMIs 是在特定 panel、特定细胞数、特定 PL 浓度下拟合的；换 panel 或换组织是否需要重新标定？原文把方法细节放进 Supplementary Note 3，而本 PDF 不含该文件。 \n 引物失败的偏差方向。 96 重成功率 72%、500 基因引物成功率 93%。失败的靶标是否集中在高 GC、长转录本、低表达或特定 isoform？如果是，panel 的\"无偏\"就会打折扣 原文 p.4 。 \n 成本模型缺失。 \"\u003c$5 测序 / \u003c$10 每患者\"只含测序与 barcoding；500–2,000 对引物的合成、验证、平衡与人力成本没有列支，也没有与\"直接加深测序\"做成本-效果比较 原文 p.8 。 \n \n \n \n 薄弱点 / 不能外推的地方 \n \n 样本面窄。 PBMC 两个供体（Fig. 2–4 主要是 1 个供体，第 2 个供体只用于 DEG 重复性）；AML 3 例；全部是血液样本。作者称\"适用于骨髓等\"，但本 PDF 没有数据 原文 p.4–8 。 \n 不是全转录组。 所有实验都在 457–2,086 个基因的 panel 上；作者把\"whole-transcriptome coverage\"列为 future work 原文 p.9 。这意味着它目前是\"targeted panel 的增强版\"，而不是\"scRNA-seq 的通用替代\"。 \n 临床结论没有独立金标准。 AML 亚型判读用 FAB 形态学标准，但本文的\"细胞类型\"来自转录组 marker；没有病理科盲法复核、没有流式/形态学对照、没有随访终点 原文 p.8 。 \n 没有与竞争方法头对头。 hybridization normalization、DSN、targeted Perturb-seq / HyPR-seq 都只在引言里被一句话带过，没有在同一文库上做对比。因此\"比现有方法好多少\"无法从本文判断 原文 p.2 。 \n 新检出的 DEG 没有正交验证。 没有 qPCR、流式或蛋白层面的确认；\"额外 DEG 是真的\"完全依赖跨供体重现率这一间接论证（虽然这个论证相当有力） 原文 p.6 。 \n 预印本。 本 PDF 是 bioRxiv 预印本（2026-09-03 上传，CC-BY-NC-ND 4.0），未经同行评审；Methods 与补充材料不在本文件内，关键实验参数无法核对。 \n \n \n \n\n 三个必须自己回答的问题 \n \n 100× 里有多少来自 panel、多少来自压缩？ 要回答这个问题只需要一个对照：同一 panel 做普通 PCR 富集（不压缩）测到同样深度，看每基因读段与 UMI。本文没有做。按 Fig. 2f 的数字，压缩本身在 panel 内只贡献 2–5× 的再分配，其余来自\"只测 1/40 的基因\" [推断]。 \n 压缩后的表达矩阵还能不能直接喂给现有流程？ Log2FC 斜率 0.70 说明\"能，但效应量被压缩\"；如果下游用固定 fold-change 阈值，需要重新标定，或者用两段模型反解回线性尺度。本文没有给出这个\"反解层\"——这是方法从\"论文\"走向\"工具\"必须补的一块。 \n 换组织、换平台、换物种还成立吗？ cPCR 的化学是通用的，但过渡点、引物成功率、on-target 比例都与样本复杂度、RNA 完整性、barcoding 平台有关。本文只给了血液 + 10X/Fluent 的组合，跨体系的验证是空白。 \n \n\n \n [推断] 一个替代解释：收益可能被\"panel 选择\"高估 \n 如果把 2,000 基因 panel 拿去做普通靶向富集（不加压缩、不做两段扩增），在 51 M reads 下也很可能拿到远高于全转录组 10X 的 UMI 覆盖——因为 81.3% 的文库丰度被排除在外。这意味着本文报告的\"效率提升\"里，有一块属于 靶向测序本身的收益 ，而 cPCR 的独特贡献是\"panel 内部把读段从高丰度挪到低丰度\"这一块（2–5×）。这不妨碍方法的实用性（组合起来确实省），但会改变\"这项技术有多革命性\"的判断，也会改变读者该把资源投向\"设计更好的 panel\"还是\"引入压缩\"。"}, {"id": "sec-relevance", "h": "与我相关：可以借走的三样东西", "t": "如果只把这篇论文记成\"一种新的单细胞建库方法\"，会漏掉它真正可迁移的部分。至少有三样东西与具体化学无关： \n\n 一、\"用饱和机制实现非线性\"的工程范式 \n cPCR 的聪明之处不是\"发明了对数\"，而是 用一管限量引物把\"什么时候饱和\"变成了输入的函数 。这个范式可以搬到任何\"试剂有限、读出是终点值\"的体系：定量 PCR、等温扩增、ELISA 的显色终点、甚至液滴里的荧光报告。判据是：只要体系里存在一个 可被耗尽、且耗尽时刻取决于输入浓度 的组分，终点读出就能被设计成对数或任意压缩函数。对做检测/传感/筛选的人来说，这比\"又一个 scRNA-seq 方法\"更通用。 \n\n 二、\"两段模型 + UMI 层面解剖\"的验证套路 \n 本文没有停留在\"压缩后信号 vs 原来信号 R²=0.9\"，而是把关系拆成两段、给出过渡点、再用 UMI 交集逐基因检查（Fig. 2j）。这套\"先拟合、再在分子层面抽 8 个基因逐个看\"的验证方式，可以直接用在任何\"改变了测量映射\"的方法上（例如新的 UMI 去重策略、新的扩增方案、新的建库化学）——因为 聚合指标（中位数、R²）会掩盖分段行为 ，而分段行为恰恰决定了方法在哪个丰度段可用。 \n\n 三、\"跨样本重现率\"作为真阳性判别器 \n Fig. 3f 的 45% vs 21% 是整篇论文里最便宜、最有说服力的对照：不需要 ground truth，只需要两个独立生物学重复，就能判断\"新增检出\"是真信号还是阈值放宽的产物。任何声称\"更灵敏\"的方法（更深的测序、更好的归一化、新的细胞分型算法）都可以照搬这个判别器，成本只是再做一次样本。 \n\n \n 如果要把这篇论文变成一条可执行的实验路线 \n [推断] 最低风险的路径是：在 已有的 10X 或 PIP-seq 文库 上做一个 200–500 基因的 panel（选你最关心的低丰度通路，而不是全免疫 panel），用本文的 add-on 流程做一次压缩 + 一次标准测序配对；先只验证三件事——(1) 两段模型在你的体系里是否出现；(2) 你最关心的 10–20 个稀有基因的 UMI 是否真的提高；(3) 你熟悉的 marker 分型是否保持。三件都过，再考虑把它推到大规模筛查或临床样本。风险最高的一步是\"全转录组压缩\"，因为那需要几千对引物同时在复杂背景里工作，而本文自己也把它留给了未来。 \n \n\n 另外值得留意的是它与其他方向的接口：本文的 AML 部分已经用了 Fluent 的无微流控 barcoding（PIP-seq） 原文 p.7 ，这意味着\"压缩化学\"与\"低成本 barcoding\"可以叠加；而它与液滴微流控、AI 虚拟细胞训练数据这两条线的关系，作者在讨论里都点了名 原文 p.9 ——前者是\"更多细胞\"，后者是\"更高质量的表达谱\"，压缩对两者都只是 降成本 ，不改变数据的基本形态，因此接入成本低。"}, {"id": "sec-glossary", "h": "术语表", "t": "cPCR（Compression PCR） 本文的核心反应：用不等量正反向引物（过量 PE / 限量 PL）制造\"指数相 + 线性相\"两段扩增，使终点产物与模板浓度的对数成正比。 \n PE / PL excess primer（过量引物）/ limiting primer（限量引物）。PL 被耗尽的时刻决定压缩程度，PE/PL 比是主旋钮。 \n 非对称 PCR / LATE-PCR asymmetric PCR；LATE-PCR 是其中一种用于实时定量的变体。本文的差别在于刻意拉长第二相并把它当作定量区间。 \n 动态范围（dynamic range） 同一个测量里最大值与最小值的比值。scRNA-seq 里 mRNA 丰度跨 5–6 个 log，是\"读段被高丰度基因吃掉\"的根源。 \n 对数变换 / 压缩 把输入按 log 映射到输出。本文用分子反应实现：输入 10 5 倍 → 输出 \u003c10 倍。 \n 两段模型（two-segment model） 低丰度段线性放大（PL 未耗尽）、高丰度段对数压缩（PL 提前耗尽），中间有过渡点。本文用它在 reads 与 UMI 两个层面拟合（Fig. 2h–i、Fig. 3b）。 \n UMI / barcode unique molecular identifier（分子条码，用于去重计数）/ cell barcode（细胞条码，用于归属细胞）。压缩必须保留这两者才能回到单细胞。 \n dropout 某个基因在某个细胞里实际有表达、但因抽样没被测到（计数为 0）的现象。低丰度基因 dropout 率可达 50–100%。 \n 饱和度（saturation） 测序深度增加到一定程度后，再测也主要是重复读到同样的分子；本文用它来比较\"达到同等饱和度需要多少 reads\"。 \n preseq 用已有测序数据外推\"文库复杂度\"与\"还需要多少 reads\"的软件（Daley & Smith, 2013）。本文用它估计压缩后文库复杂度降低约 100×。 \n on-target rate 落在目标区域（panel 基因）上的读段比例。嵌套 PCR 把它从 40% 提到 70%。 \n panel / 靶向测序 只扩增/捕获预先选定的一组基因。本文所有单细胞实验都是 panel 形式（457–2,086 个基因），不是全转录组。 \n ARI（adjusted Rand index） 两种聚类划分的一致性指标，1 = 完全一致，0 ≈ 随机。本文浅测分型 ARI=0.78（四类），合并 T/NK 后 0.97。 \n DEG / Log2FC differentially expressed gene（差异表达基因）/ log₂ 倍数变化。本文报告压缩后 DEG 多 21%，但 Log2FC 斜率只有 0.70。 \n FAB 分类 French–American–British 的 AML 形态学分型（M0–M7）。M4 = 急性粒单核细胞白血病（30–80% 单核细胞），M2 = 伴成熟粒细胞的急性髓系白血病。 \n MRD measurable residual disease，可测量残留病。本文用 WT1 表达变化提示 MRD，但没有随访数据。 \n PIP-seq Fluent（现 Illumina）的无微流控单细胞 barcoding 方法（templated emulsification），成本低于液滴微流控。本文 AML 部分用它建库。 \n Harmony 常用的单细胞批次整合算法。本文用它把 Fluent 与 10X 的样本共聚类。"}, {"id": "sec-refs", "h": "引用与延伸阅读", "t": "本报告页码均指所提供 PDF 的页面（共 11 页：主文 p.1–9，参考文献 p.10–11）。原文为 bioRxiv 预印本，DOI 10.64898/2026.09.01.748706 ，2026-09-03 上传，CC-BY-NC-ND 4.0，未经同行评审；Methods 与 Supplementary 不在本文件内。 \n\n \n Yan, Y. & Dai, M. Compression Sequencing enables ultra-sensitive and scalable scRNA-seq . bioRxiv (2026). doi:10.64898/2026.09.01.748706 —— 本文。Rice University 生物工程系 / 化学系，通讯作者 mingjie.dai@rice.edu。 \n Sanchez, J. A., Pierce, K. E., Rice, J. E. & Wangh, L. J. Linear-after-the-exponential (LATE)-PCR: an advanced method of asymmetric PCR and its uses in quantitative real-time analysis. PNAS 101, 1933–1938 (2004). —— cPCR 的直接前身：非对称 PCR 用于定量。 \n Gyllensten, U. B. & Erlich, H. A. Generation of single-stranded DNA by the polymerase chain reaction. PNAS 85, 7652–7656 (1988). —— 单链扩增的原始方法。 \n Shannon, C. E. & Weaver, W. The Mathematical Theory of Communication . University of Illinois Press (1949)；Huffman, D. A. Proc. IRE 40, 1098–1101 (1952)；Golomb, S. W. Run-length encodings. IEEE Trans. Inf. Theory (1966). —— 作者用来支撑\"压缩\"这一信息科学类比的经典文献。 \n Larson, G. W. LogLuv Encoding for Full-Gamut, High-Dynamic Range Images. J. Graphics Tools 3, 15–31 (1998). —— 对数编码在高动态范围图像里的先例。 \n Xie, N. G. et al. Designing highly multiplex PCR primer sets with Simulated Annealing Design using Dimer Likelihood Estimation (SADDLE). Nat Commun 13, 1881 (2022). —— 本文引物设计算法的来源；作者称二聚体形成比该报道降低 >10×。 \n Daley, T. & Smith, A. D. Predicting the molecular complexity of sequencing libraries. Nat Methods 10, 325–327 (2013). —— preseq 软件，本文用它估计文库复杂度下降约 100×。 \n Love, M. I., Huber, W. & Anders, S. Moderated estimation of fold change and dispersion for RNA-seq data with DESeq2. Genome Biol 15, 550 (2014). —— 作者用来解释 Log2FC 斜率偏低时引用。 \n Svensson, V. et al. Power analysis of single-cell RNA-sequencing experiments. Nat Methods 14, 381–387 (2017). —— 单细胞 dropout 与测序深度的定量分析，本文问题陈述的主要依据之一。 \n Zheng, G. X. et al. Massively parallel digital transcriptional profiling of single cells. Nat Commun 8, 14049 (2017). —— 10X 平台原始文献。 \n Clark, I. C. et al. Microfluidics-free single-cell genomics with templated emulsification. Nat Biotechnol 41, 1557–1566 (2023). —— Fluent PIP-seq，本文 AML 部分的建库方法。 \n Schraivogel, D. et al. Targeted Perturb-seq enables genome-scale genetic screens in single cells. Nat Methods 17, 629–635 (2020)；Marshall, J. L. et al. HyPR-seq. PNAS 117, 33404–33413 (2020). —— 本文引言里作为\"靶向 panel 路线\"的代表。 \n Replogle, J. M. et al. Mapping information-rich genotype-phenotype landscapes with genome-scale Perturb-seq. Cell 185, 2559–2575 (2022). —— 大规模 Perturb-seq 的成本与规模背景。 \n Hagemann-Jensen, M., Ziegenhain, C. & Sandberg, R. Scalable single-cell RNA sequencing from full transcripts with Smart-seq3xpress. Nat Biotechnol 40, 1452–1457 (2022). —— 作者在讨论里提出的\"深测 + 微孔板\"替代路线。 \n van Galen, P. et al. Single-Cell RNA-Seq Reveals AML Hierarchies Relevant to Disease Progression and Immunity. Cell 176, 1265–1281 (2019)；Döhner, H. et al. Acute Myeloid Leukemia. N Engl J Med 373, 1136–1152 (2015). —— AML 单细胞与临床背景。 \n Bennett, J. M. et al. Proposed revised criteria for the classification of acute myeloid leukemia (FAB). Ann Intern Med 103, 620–625 (1985). —— 本文亚型判读所依据的 FAB 标准。 \n \n\n \n 原文最值得记住的三句 \n \"Fundamentally, this is caused by the high dynamic range of mRNA expression in human cells.\"（p.2）—— 问题的根因一句话。 \n \"…the second phase ('prolonged linear phase') reflects true linear growth due to single-primer amplification, which is different from the transient 'linear phase' observed in conventional qPCR assays.\"（p.2）—— 它与常规 qPCR 的分界线。 \n \"…logarithmic compression suppresses read fraction from high-abundance genes by 40x while boosting that from low-abundance ones, achieving up to 500x overall improvement in sequencing efficiency and sensitivit
