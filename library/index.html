后回到试管里验证。 \n\n 一句话：把\"配方优化\"从湿实验问题，改造成\"可编码、可并行、可预测\"的数据问题。 原文 p.2 · Fig. 1 \n\n \n 表 1 　四条主结论与它们的证据强度（本报告判读） \n \n \n 结论 原文数字 证据 我的判读 \n \n 简化 E. coli 配方 12 种添加剂 → 只留 3 种（PEP、亚精胺、叶酸） Fig. 3i、p.5–6 证据 贡献分来自模型而非因果实验，但趋势与已知代谢逻辑一致 \n 降本 添加剂成本 1.87 → 0.90 USD/mL（2.1×）；单位成本 2.63 → 0.72 USD/mg（4×） p.6、Supplementary Table 1 证据 \"单位成本\"只算添加剂，不含提取物/DNA/人力/设备 \n 增产 sfGFP 0.71 → 1.38 mg/mL（1.9×） p.6、Supplementary Fig. 9a 证据 体外验证为 bulk 试管实验，n 与重复见 Methods \n 跨底盘迁移 B. subtilis 体系：27–36 组实验即可 R²>0.95；直接学习需 ≥75 组 Fig. 5b–c、p.7 证据 \"迁移\"本质是特征增强，不是深度微调；外推到真核体系未验证 \n \n \n \n 判读为报告作者推断的部分已在正文用 [推断] 标出；数字均转录自原文页面。"}, {"id": "sec-problem", "h": "问题背景：CFE 越强，配方越贵", "t": "CFE 用细胞裂解液代替活细胞，绕开了细胞壁、生长和克隆周期，但它把复杂度转移到了\"配方\"上：一个典型的细菌裂解液体系，除裂解液和模板 DNA 外还要加约 40 种组分，其中超过一半的成本来自能量底物和各类添加剂。作者给出的组合爆炸例子很直观： 5 种能量底物选 1 种 × 10 种转录翻译因子\"有/无\" = 5120 种组合 ，按 96 孔板做需要约 6 万次移液、54 块板 ，还没算浓度梯度。 \n\n \n 方法动机 \n 既然瓶颈是\"组合太多、单次实验太贵\"，那就把单次反应体积从 10 μL 压到 250 pL（4 万倍），并让每个液滴自带\"身份码\"。这正是 DropAI 的两个支点： 微流控压缩体积 + 荧光编码携带组合信息 。 原文 p.1 \n \n\n [推断] 这个思路真正的门槛不在液滴生成，而在\"身份码\"的可靠性：一旦编码/解码错一位，训练数据就被污染。因此 Fig. 2 的 6561 组合解码实验（99.5% 覆盖率）其实是整篇文章的方法学地基，值得比结果图更仔细地读。"}, {"id": "sec-method", "h": "方法总览：DropAI 的三段闭环", "t": "Fig. 1 原文 Fig. 1 · p.2 · 混合裁切 · 来自 PDF 原始页面 · 1498×931 px 原文 p.2 ↗ 放大 原文图注 · p.2 “Fig. 1 | DropAI Workﬂow. DropAI employs a hybrid strategy of (a) in-droplet screening and (b) in silico optimization. a In-droplet screening: Massively parallel experimental data are generated using picoliter droplet reactors. Each droplet contains a unique combination of cell-free gene expression (CFE) components encoded by ﬂuorescent markers. Multichannel droplet imaging allows for parallel reading of component combinations and resulting CFE yields (sfGFP ﬂuorescence). b In silico optimization: Experimental data are used to develop AI models, which extend predictions beyond experimental scales to enhance screening capacity. Iterations of the screening process may be conducted for further optimization. c Final veriﬁcation: The optimized screening results are validated in vitro.” \n \n 逐面板解读 \n \n a 液滴筛选 ：载流液滴（CFE 混合物）在下游依次与 3 个卫星液滴相遇，在微齿结构处用电场合并。每个卫星液滴从一个\"条件池\"里随机取样，用不同颜色的染料标出自己代表哪一组条件。 原文 p.2 \n b 在硅优化 ：把每个液滴的编码（组合）和表型（sfGFP 荧光）配对成训练数据，训练模型，再用模型扫描整个组合空间、预测高产组合。 \n c 体外验证 ：把模型推荐的最优配方放回 15 μL 试管体系验证，形成\"干湿闭环\"。 \n \n \n \n 读图要点 \n Fig. 1 是全文的\"路线图\"，本身不含数据；真正需要盯的是它隐含的三个假设：①液滴内 CFE 效率与试管一致（由 Supplementary Fig. 3 支撑）；②染料不干扰表达、不串色（Supplementary Fig. 3e、f）；③编码能无损解码（Fig. 2）。任何一个不成立，后面的数字都要打折。 \n \n \n\n \n \n AI 重绘示意图 · 非原文图 \n 一轮 DropAI 闭环：从组合设计到体外验证 \n \n \n \n \n \n 1 液滴筛选 载流液滴在下游依次与三个卫星液滴配对合并，卫星液滴各自从一个条件池随机取样；四种荧光颜色、每种九级强度，让每个合并液滴得到一个四位九进制码（9⁴ = 6561）。单轮可测约 10⁵ 个液滴。 \n 2 在硅优化 把\"编码 → sfGFP 强度\"配对成表，先训 7 层神经网络（初筛，R² = 0.88），再用 XGBoost 做浓度优化（R² = 0.99，作者自己提示有数据泄漏风险），最后扫描整个组合空间找模型认为高产的组合。 \n 3 体外验证 模型推荐的配方回到 15 μL 试管体系验证：sfGFP 0.71 → 1.38 mg/mL，单位成本 2.63 → 0.72 USD/mg；再在 12 种蛋白和 B. subtilis 体系上做泛化测试。 \n 4 闭环与成本 两轮 E. coli 优化共用约 10 万液滴、25 μL 反应液（含损耗约 100 μL），每轮约 4 h。对比 96 孔板做同规模筛选需要 1 L 以上试剂和数天——这是 DropAI 最硬的一条工程优势。 \n \n 依据 ：原文 Fig. 1、p.2–3、p.9 文字与数字重绘；阶段框中数值为原文报告值，不代表新的实验。 原文 p.2 \n \n\n \n 表 2 　复现 DropAI 所需的关键参数（摘自 Methods） \n \n \n 环节 参数 出处 \n \n CFE 反应 15 μL 试管或 80 μm 液滴（~250 pL），30 °C，4 h；27%（v/v）裂解液，13.3 μg/mL 质粒 p.9 Methods \n 液滴稳定 水相加 0.2%（v/v）P-188 + 1%（v/v）PEG-6000；油相 HFE-7500 + 2.5 wt% PEG-PFPE 表活 p.9–10 \n 液滴尺寸 载流滴 ~70 μm；卫星滴 ~36 μm；合并芯片微齿 + 1.5 kV Vpp / 50 kHz 交流电场 p.3、p.10 \n 编码 4 色（Alexa-488/546/594/647）× 9 级强度；9⁴ = 6561 p.2–4 \n 读出 4 通道数字 PCR 液滴读取仪（Nebula Reader）+ 自研分析软件；MATLAB 多带通滤波 + 分箱 p.10 \n 模型 初筛：7 层全连接 NN，TensorFlow 2.8，Adam，dropout 0.25，MAPE ~5.6%；浓度：XGBoost 180 棵树 + GridSearchCV + 5 折 CV p.10–11 \n 验证 sfGFP 荧光 ex 485 / em 528 nm，用自建标准曲线换算 mg/mL；Western blot / SDS-PAGE 定量其余蛋白 p.9 \n \n \n \n 参数转录自原文 Methods；Supplementary Table 1/4/6 含完整配方、染料浓度与超参数。"}, {"id": "sec-fig2", "h": "图 2｜微流控与编解码：6561 种组合怎么被\"读出来\"", "t": "Fig. 2 原文 Fig. 2 · p.4 · 混合裁切 · 来自 PDF 原始页面 · 1493×1352 px 原文 p.4 ↗ 放大 原文图注 · p.4 “Fig. 2 | Microﬂuidics and coding/decoding in DropAI. a DropAI generates massive combinations in droplet reactors with a multi-droplet microﬂuidic merger. The device loads a pool of carrier droplets into a microchannel at regular intervals. Each carrier droplet meets 3 satellite droplets at downstream junctions, which are all merged under an electrical ﬁeld at the micro-teeth structure. b Micrographs depict the droplet pairing and merging process. The false coloring depicts carrier droplets (green) and differentiates the satellite droplets (yellow, pink, and blue for satellite drop 1, 2, and 3, respectively). c As every droplet is coded by ﬂuorescent color and intensity, the merged droplets are rendered a 4-color barcode (FluoreCode) indicating the exact combinations. The microﬂuidic device generates the combinatorial pool at ~300 Hz, and the total coding capacity is 6561 (94). d A stacked micrograph displaying the as-built combinatorial pool. e For decoding, the merged droplets are imaged under 4 ﬂuorescent channels to extract the FluoreCode of each droplet. The micrographs are representative examples from three independent experiments. The droplets are then clustered based on the FluoreCode information. The font colors indicate the fake colors used in the imaging channels. Alexa-488 (green), Alexa-546 (yellow), Alexa-594 (red), Alexa-647 (blue). f A t-distributed stochastic neighbor embedding (T-SNE) projection of 153,302 droplets containing 6527 recognized clusters, ~99.5% of the entire combinatorial space. The colors are used to represent individual clusters. Scale bars: 100 μm.” \n 逐面板解读 \n \n a 器件布局：载流液滴在上游排队，依次经过三个汇合口，每个口加入一个卫星液滴，最后在微齿结构处合并。 原文 p.3 \n b 实拍配对/合并过程：假彩色标出载流滴（绿）与三个卫星滴（黄/粉/蓝）。合并效率约 90% ，重复性用 3 次独立实验验证（N = 3）。 \n c 合并后液滴成为\"四色条码\"（FluoreCode）：颜色区分\"来自哪个池\"，强度区分\"池内第几档\"，合起来是 四位九进制数 。 \n d–e 用 6561 种染料组合直接建库并四通道成像：成像阶段共测 206,634 个液滴，滤波后保留 112,156 个用于解码。 \n f 按 FluoreCode 分箱得到 6,527 个簇 ，覆盖理论空间的 99.5% ；t-SNE 图展示簇的分离程度。 \n \n \n\n \n 读图注意（两处数字不一致） \n 正文 p.4 与 Fig. 2f 图内标注都是 112,156 个液滴；但同一面板的图注写的是 153,302 个液滴、6,527 个簇，差 4 万余滴，原文没有解释这个口径差（可能是滤波前后或绘图抽样）。 这类不一致不影响 99.5% 覆盖率的量级判断，但说明\"每个液滴都被正确解码\"这件事并没有被逐滴验证 ——99.5% 是\"簇的覆盖率\"，不是\"解码准确率\"。 原文 p.4 \n \n \n 这张图真正的贡献 \n 它证明了\"编码 → 成像 → 解码\"的闭环在 6561 规模上可行，这是后面一切数据的前提。但要注意：Fig. 2 用的是 染料水溶液 而非真实 CFE 反应，染料与反应体系的兼容性由 Supplementary Fig. 3 单独验证。真正的筛选数据（Fig. 3–5）只用了 3 色、100–125 种组合，远低于 6561 的上限——编码能力是\"余量\"，不是\"已用满\"。"}, {"id": "sec-fig3", "h": "图 3｜第一轮：从 12 个添加剂里找出\"必需品\"", "t": "Fig. 3 原文 Fig. 3 · p.5 · 混合裁切 · 来自 PDF 原始页面 · 1498×1497 px 原文 p.5 ↗ 放大 原文图注 · p.5 “Fig. 3 | Primary optimization of an E.coli extract-based CFE system. a Illustration of the CFE mixture composition and emulsiﬁcation process. Preliminary experiments encoding the (b) presence and (c) concentrations of Mg2+. The upper panels display the encoding process and post-CFE droplets under the encoding dye (Alexa-647) and sfGFP channels. The scatter plot on the bottom reveals the ﬂuorescence intensity proﬁle of the droplets. The inset column plot in (c) depicts a parallel experiment performed in bulk (15 μL in-tube). The data are presented as mean ± s.d., based on six independent experiments. d–f In-droplet screening of 12 CFE components. d The 3-color coding strategy. e A representative micrograph of the encoding droplets (false colors are used for display purposes). Independent layers are disclosed in Supplementary Fig. 4a. f A 3D scatter plot showing the ﬂuorescence intensity proﬁle of the droplets across the combinatorial space. The color of the dots indicates the sfGFP intensity. g, h In silico optimization. g A 7-layer neural network model used in the optimization. The model interprets the presence of components as binary values and outputs the contribution score of each component. (h) Comparison of the normalized sfGFP yield (ﬂuorescence intensity) obtained from the droplets vs. the model predictions. The linear ﬁtting of the test set exhibits a Y-intercept of 0.09 and a slope of 0.89. i The in silico estimated contribution of the 12 components to the protein yield. The grey shading indicates additives for the transcription (TX) and translation (TL) process. Spermidine, Folinic acid, and PEP are selected for the second-round optimization (highlighted with red fonts). Scale bars: 100 μm.” \n \n 逐面板解读 \n \n a CFE 混合物组成与乳化流程示意：12 种候选添加剂（7 种转录/翻译因子 + 5 种能量底物）分配到卫星液滴池中。 \n b–c 概念验证 ：先把 Mg²⁺ 的\"有/无\"编码进液滴，两种条件分成两簇（b）；再把 Mg²⁺ 做成五档浓度梯度，五个簇清晰分开，且 sfGFP 在 12 mM 处最高（c），与试管平行实验（c 内嵌小图、n = 6、mean ± s.d.）一致。 原文 p.4 \n d–e 三色编码策略与实拍编码液滴：把 768 种理论组合中的一个子集（ 100 种 ）编进液滴。 \n f 3D 散点： 31,598 个液滴数据点，颜色表示 sfGFP 强度。 \n g 7 层全连接神经网络：输入是 12 个添加剂的 0/1，输出是归一化 sfGFP 产量。 \n h 预测 vs 实测：Pearson r = 0.94 （95% CI 0.87–0.97），测试集 R² = 0.88 ，P \u003c 0.0001；线性拟合截距 0.09、斜率 0.89。 \n i 贡献分：>1.1 表示\"加了它产量平均提高 >10%\"。 亚精胺、叶酸 超过 1.1；PEP 在能量底物里得分最高（1.4）；NAD、腐胺、tRNA、K₂C₂O₄、CoA 被判为非必需。 \n \n \n \n 统计上的三个疑点 \n \n 训练/测试同分布 ：100 种组合随机 70/30 划分，测试集组合都来自同一个 100 组合子空间，且每种组合有 >300 个液滴重复。这里的 R² = 0.88 是\"同分布插值\"能力，不能直接读成\"能预测没做过的新添加剂组合\"。 原文 p.10 \n n 的口径 ：31,598 个液滴被分箱成 100 组，模型训练用的是 组均值 （Methods），所以有效样本量是 100 而不是 31,598；液滴级噪声被平均掉了，模型精度会被\"抬高\"。 \n 贡献分是模型量不是因果量 ：Contribution x 是\"含 x 与不含 x 的预测产量比的平均\"，依赖模型本身。作者用成对组合分析（Supplementary Fig. 7）做了交叉检查，方向一致，但仍是相关性证据。"}, {"id": "sec-fig4", "h": "图 4｜第二轮：浓度优化把成本打到 1/4", "t": "Fig. 4 原文 Fig. 4 · p.7 · 混合裁切 · 来自 PDF 原始页面 · 1498×1411 px 原文 p.7 ↗ 放大 原文图注 · p.7 “Fig. 4 | Second-round optimization of the E. coli extract-based CFE system. a, b In-droplet screening to optimize the concentrations of the selected components. a The ﬂuorescence coding strategy. b A 3D scatter plot showing the ﬂuorescence intensity proﬁle of the droplets. The color of the dots indicates the sfGFP intensity. c–e In silico optimization. c An extreme gradient boosting model used in the optimization. d Concentration ranges scanned in the model prediction. e The estimation matrix sorted by yield level. f–i In vitro veriﬁcation. f Fold change in the expression yield of 12 proteins with the simpliﬁed and optimized CFE formulation compared to the original recipe. The two sfGFP columns depict the same data because sfGFP was considered fully dissolvable (see “Methods” for ﬂuorescencebased quantiﬁcation of sfGFP), and the data are shown as mean ± s.d. of three independent experiments. Western blot results of (g) Sfp (27 kDa) and (h) CAR (128 kDa). i SDS-PAGE analysis of Vlm1 (370 kDa). M, T, and S are marker, total fraction, and soluble fraction, respectively. The gel images are representative examples from three independent experiments, all yielding consistent results. The background shadings highlight a representative round of DropAI optimization: indroplet screening (clear), in silico optimization (grey), and in vitro veriﬁcation (green).” \n \n 逐面板解读 \n \n a–b 用三色编码把 PEP、亚精胺、叶酸的浓度组合做成 5³ = 125 种，筛出 49,148 个液滴数据点。 \n c 换成 XGBoost （180 棵弱树）：连续浓度输入比神经网络更合适，抗过拟合。 \n d–e 在更宽浓度范围内扫描 3780 种组合，最优预测落在 40 mM PEP / 130 μM 亚精胺 / 4 mM 叶酸 。 \n f 12 种蛋白（27–370 kDa）的产量倍数变化：5 种维持、TxtE 总量 4.5×/可溶 2.3×、CAR/Vlm 等提升；TEII、BesB 略降。 注意 ：这是相对\"原始配方\"的倍数，不是绝对产量。 \n g–i 代表性蛋白的 Western blot（Sfp、CAR）与 SDS-PAGE（Vlm1），M/T/S 分别为 marker、总蛋白、可溶组分。 \n \n \n \n 核心数字的算法 \n 体外验证结果：产量 0.71 → 1.38 mg/mL （1.9×）；添加剂成本 1.87 → 0.90 USD/mL （2.1×）；单位成本 2.63 → 0.72 USD/mg （4×）。 原文 p.6 这三个数字里， 4× 是\"1.9× 产量\"与\"2.1× 添加剂省钱\"相乘的结果 ，不是独立测量。 \n \n \n 作者的自我提示与我的补充 \n 作者明确写了 R² = 0.99 存在 数据泄漏（data leakage）风险 ，这一点值得肯定。我的补充：25 个测试组合是从 125 个浓度网格里随机抽的，属于\"网格内插值\"；模型真正被检验的能力是\"在已有浓度范围内找最优\"，而不是\"外推到范围之外\"。另外 3780 个预测组合只在 5 个点上做了体外表征（Fig. 5e），高产区间的绝对产量仍以 bulk 验证为准。"}, {"id": "sec-fig5", "h": "图 5｜迁移学习：换底盘还要重来一遍吗", "t": "Fig. 5 原文 Fig. 5 · p.8 · 混合裁切 · 来自 PDF 原始页面 · 1478×1276 px 原文 p.8 ↗ 放大 原文图注 · p.8 “Fig. 5 | Optimization of a B. subtilis extract-based CFE system by transfer learning. a Schematic of the transfer learning process. The process initiates with the established E. coli-based model. By learning limited B. subtilis experimental data, the E. coli model is transferred to a B. subtilis model through a feature enhancement approach. b Model accuracy obtained at varying learning set sizes. The transfer learning approach is compared with a model directly built on the B. subtilis experimental data. c The measured sfGFPyield (in-droplet screening) vs. the predicted yield of a direct learning model and the transfer learning model. Both yields are normalized. Both models study 36 (3 × 4 × 3) experimental combinations. d The estimation matrix sorted by yield level. e Bulk sfGFP expression under ﬁve notiﬁed compositions and the model prediction results. S (spermidine), F (folinic acid), P (phosphoenolpyruvate). f Experimental estimation of the optimized formulation to express sfGFP. The data are presented as mean ± s.d., based on multiple independent experiments (N = 6). NC (negative control without adding plasmid), B.S. (Bacillus subtilis), E.C. (Escherichia coli). Two-sided t-tests were used to analyze the data (see Methods). P values are classiﬁed as follows: p \u003c 0.01 (**), p \u003c 0.001 (***), p \u003c 0.0001 (****). For original B.S. vs. rep. 1, p = 0.0002; for rep. 1 vs. rep. 2, p = 0.99, which is considered not signiﬁcant (ns). g Fold change in the expression yield of three peptides with the simpliﬁed and optimized CFE formulation compared to the original recipe.” \n \n 逐面板解读 \n \n a 迁移流程：先拿 E. coli 模型对 B. subtilis 数据生成基线预测，再把预测值作为 额外特征 喂给 XGBoost（特征增强），而不是重新训练网络。 \n b 实验规模 vs 精度：迁移学习在 27、36 组 实验时就能达到 R² > 0.95；直接学习要到 ≥75 组 才接近。作者据此称可减少 2–3 倍实验量。 \n c 36 组实验（3×4×3）对比：迁移模型 r = 0.99（95% CI 0.91–1.00）、R² = 0.99、斜率 1.01、截距 −0.008；直接学习 R² = 0.83、斜率 1.50、截距 −0.49。 斜率 1.50 说明直接模型系统性压缩/放大预测 ，不只是噪声。 \n d 扫描 3780 种浓度组合。 \n e 挑 5 个组合做 bulk 验证：预测与实测的 趋势一致 ，但绝对值没有完全对齐（作者原文承认 \"exact yield levels did not perfectly match\"）。 \n f 最优 B. subtilis 配方（5 mM 亚精胺 / 100 μM 叶酸 / 35 mM PEP）：sfGFP 0.24 mg/mL ，约为原 B. subtilis 配方的 2 倍 ；比\"把 E. coli 优化配方直接用于 B. subtilis\"再高 14%。n = 6，双侧 t 检验。 \n g 三种短抗菌肽的产量维持或提升。 \n \n \n \n \"迁移\"到底迁移了什么 \n 严格说这是 特征增强的浅层迁移 ：预训练模型只用来产生一个标量特征，XGBoost 仍完全重训。它成立的前提是\"两个底盘共享同一组关键因子（亚精胺/叶酸/PEP）\"，这对 E. coli → B. subtilis（都是细菌）成立；原文 Discussion 也承认核糖体丰度、RNA 聚合酶类型、tRNA 多样性、密码子偏好都可能破坏这个前提，真核体系未验证。 原文 p.8 \n \n \n 这一节最值得学的工程细节 \n 为了让\"换底盘\"可负担，作者没有追求\"零样本迁移\"，而是主动把新体系实验量压到 27–36 组（3 水平 × 3–4 水平 × 3 水平的网格）。对任何\"平台 + AI\"的工作，这个思路可复用： 用旧模型提供先验特征，用少量新数据校准，再用模型挑最值得做的实验 。"}, {"id": "sec-mechanism", "h": "机制重绘：FluoreCode 为什么能编码组合", "t": "AI 重绘示意图 · 非原文图 \n 四位九进制条码：生成 → 合并 → 解码 → 聚类 \n \n \n \n \n \n 1 条件池 每种荧光颜色对应一个\"位次\"（池），同一颜色下的 9 档染料浓度对应九进制的 9 个取值。四个池（三卫星滴 + 载流滴）随机组合，空间为 9⁴。 \n 2 合并 载流液滴依次与三个卫星液滴在微齿处由 1.5 kVpp/50 kHz 交流电场合并，四个液滴的染料留在同一个液滴里，形成四位条码。合并效率约 90%。 \n 3 成像与反解 四通道成像读出每个通道的荧光强度，按强度档位反解出四位编码；同一个液滴的 sfGFP 通道给出表型（产量）。这是\"编码 + 表型\"同液滴配对的来源。 \n 4 聚类与建库 按解码结果分箱：同一组合的液滴聚成一簇，簇内取平均得到该组合的产量。原文在 6561 组合上得到 6,527 个簇（99.5% 覆盖），随后用三色、125 组合做真实筛选。 \n \n 依据 ：原文 Fig. 2、p.3–4、p.10 的方法描述重绘；数字为原文报告值。\"例：3-0-7-2\"是解释性示例，不代表原文数据。 原文 p.3 \n \n\n \n 为什么\"强度\"可以当编码用 \n 九进制要求九个强度档在成像时可区分：原文用同一染料配 9 个浓度、验证强度分布出现 9 个主峰（Supplementary Fig. 1e），再用多带通滤波剔除边缘点。换句话说， 编码容量不是理论算出来的 9⁴，而是靠\"强度可分辨\"这个硬件条件撑住的 ；换成不同染料/成像参数，容量会变。 原文 p.3"}, {"id": "sec-data", "h": "数据重绘：4× 成本下降是怎么构成的", "t": "数据转录自原文 · 未重新分析 \n 优化前后的三个关键量 \n \n \n \n \n 读法 ：三个面板的纵轴各自独立（数量级不同），横轴都是\"原始 vs 优化\"。4× 的单位成本降幅来自\"添加剂便宜 2.1×\"与\"产量高 1.9×\"的叠加，而不是单一变量的功劳。 \n \n\n \n \"4× 降本\"的边界 \n 原文口径是\"每毫克 sfGFP 的添加剂成本\"，不含细胞提取物、质粒 DNA、人力、设备折旧与筛选本身的成本（液滴读取仪、成像时间）。若要做技术经济分析（TEA），需要把这些项补齐；对工业放大，提取物与 DNA 往往才是大头。 原文 p.6"}, {"id": "sec-critique", "h": "批判性评估：哪些结论是硬的，哪些是推断", "t": "站得住的部分 \n \n 工程可行性 ：10 万液滴/25 μL/4 h 的规模与\"96 孔板需 1 L、数天\"的对比是硬事实，来自实际运行而非估算。 \n 闭环完整 ：从编码、解码、建模到 bulk 验证全链路打通，且每个环节都有独立验证（Fig. 2 编码、Fig. 3 概念验证、Fig. 4/5 bulk）。 \n 可复现材料 ：配方、染料浓度、超参数、代码与数据均公开（GitHub + Zenodo），Methods 参数密度高。 \n 诚实的自我提示 ：作者主动写出 XGBoost 的 data leakage 风险与 B. subtilis 绝对值不匹配，这在同类论文中不常见。 \n \n \n \n 存疑 / 需要更多证据 \n \n 统计单元混用 ：31,598 个液滴 → 100 个组合均值 → 70/30 划分。有效 n 是组合数（100/125），不是液滴数；模型精度被\"先平均后建模\"抬高。 \n 解码准确率未逐滴验证 ：99.5% 是簇覆盖率；错误解码会静默污染训练标签，原文没有给出混淆矩阵或错误率。 \n 4× 成本口径 ：只算添加剂；未含筛选成本、设备与提取物。 \n 迁移的普适性 ：E. coli → B. subtilis 共享关键因子；真核体系、不同培养条件未验证。 \n \n \n \n 我认为的薄弱点 \n \n 光学校准与串色 ：四色 + 九级强度依赖通道间校准；原文用多带通滤波处理边缘点，但没有报告通道补偿矩阵或串色误差。这直接决定\"编码对不对\"。 \n 选择偏差 ：第一轮只筛了 768 组合中的 100 个（作者按经验挑选），\"12 个添加剂里只有 3 个必需\"的结论受这个子集限制。 \n 最优点的稳健性 ：3780 个预测组合只在 5 个点上做 bulk 验证（Fig. 5e），且预测与实测绝对值不一致；\"40 mM PEP / 130 μM 亚精胺 / 4 mM 叶酸\"是模型最优，未必是真实最优。 \n 蛋白泛化的机制 ：12 种蛋白中 TEII、BesB 下降，作者用 sfGFP 融合解释；这说明配方可能仍偏向 sfGFP 这类快速折叠的报告蛋白。 \n \n \n \n\n \n 表 3 　如果我要复现/审稿，会追问的 8 个问题 \n \n \n # 问题 为什么重要 \n \n 1 四通道解码的混淆矩阵/错误率是多少？ 编码错误会直接污染监督标签 \n 2 液滴批次与成像批次是否作为随机效应建模？ 批次效应可能被误读为\"组合效应\" \n 3 模型训练用的是组合均值还是液滴级数据？ 决定有效样本量与置信区间 \n 4 100 个初筛组合是如何从 768 中选出的？ 选择偏差影响\"必需性\"结论 \n 5 XGBoost 的 25 个测试组合是否与训练集共享浓度水平？ 网格内插值 vs 外推能力 \n 6 4× 成本是否包含筛选/设备/提取物？ 决定工业放大可行性 \n 7 B. subtilis 的\"原配方\"具体指哪个配方、基线多少？ \"2 倍提升\"的分母需要明确 \n 8 12 种蛋白的产量是用同一标准曲线/同一 Western 定量口径吗？ 跨蛋白比较的可靠性 \n \n \n \n 问题 1–4 为方法学追问，5–8 为结论边界追问；均可在正文找到对应线索，但原文未完全回答。"}, {"id": "sec-relevance", "h": "与我相关：对液滴 / DMF 与自动化平台的启示", "t": "如果你在做数字微流控（DMF）、液滴微流控或\"AI + 实验平台\"，这篇文章有三点可直接迁移： \n\n \n 把\"身份\"编码进反应器本身 。DropAI 的核心不是液滴，而是\"每个液滴自带组合编码\"。DMF 的优势是电极寻址，天然可以为每个液滴分配坐标/时序编码；把\"位置 + 时间\"当作身份码，可能比荧光编码更稳、更省光学通道。 \n 用\"可分辨级数\"反推编码容量 。9 级强度不是凭空来的，而是由成像信噪比决定。工程上应先测\"强度分辨极限\"，再定编码进制；否则容量是纸面数字。 \n 迁移学习是跨平台复用的捷径 。换底盘/换设备时，用旧模型给新数据生成先验特征，再用 27–36 组实验校准——这个\"少量校准 + 模型挑实验\"的模式，对任何新平台冷启动都适用。 \n \n\n \n [推断] 一个可检验的假设 \n 如果 DMF 的液滴操控精度足以做\"单液滴配方混合 + 原位荧光读出\"，那么 DropAI 的\"编码-解码\"环节可以被 DMF 的\"地址寻址\"替代——代价是通量（DMF 通常远低于 300 Hz），收益是无需荧光染料编码、可做多步反应（如裂解、孵育、洗涤）。对做 TFT-DMF 芯片的团队，这可能是比\"追高通量\"更现实的差异化路线。"}, {"id": "sec-glossary", "h": "术语表", "t": "CFE（cell-free gene expression） 无细胞基因表达：用细胞裂解液在体外完成转录翻译，不需维持活细胞。 \n FluoreCode 本文提出的荧光编码方案：4 种颜色 × 9 级强度 = 9⁴ = 6561 种组合编码。 \n PANOx-SP 一种经典的 E. coli 裂解液 CFE 配方体系，本文以其为优化起点。 \n sfGFP 超折叠绿色荧光蛋白，常用作 CFE 的报告蛋白，荧光强度可换算蛋白浓度。 \n PEP（phosphoenolpyruvate） 磷酸烯醇式丙酮酸，糖酵解途径中的高能磷酸供体，本文选中的能量底物。 \n MAPE 平均绝对百分比误差，本文神经网络的损失/评价指标（~5.6%）。 \n XGBoost 梯度提升决策树实现，适合小样本、连续输入的回归；本文浓度优化用它。 \n 迁移学习（transfer learning） 把源体系训练好的模型用于目标体系；本文用\"特征增强\"方式迁移到 B. subtilis。 \n TEA（techno-economic analysis） 技术经济分析；本报告用它提醒\"4× 降本\"的口径边界。 \n DMF（digital microfluidics） 数字微流控：用电场在电极阵列上操控离散液滴，本文未使用，属\"与我相关\"的对照技术。"}, {"id": "sec-refs", "h": "延伸阅读与引用", "t": "Zhu, J. et al. AI-driven high-throughput droplet screening of cell-free gene expression. Nat. Commun. 16 , 2720 (2025). doi:10.1038/s41467-025-58139-0 \n 数据与代码： github.com/Liulab2023/DropAI （含聚类、AI 模型与 in silico 筛选代码） \n Silverman, A. D., Karim, A. S. & Jewett, M. C. Cell-free gene expression: an expanded repertoire of applications. Nat. Rev. Genet. 21 , 151–170 (2020). \n Karim, A. S. et al. In vitro prototyping and rapid optimization of biosynthetic enzymes for cell design. Nat. Chem. Biol. 16 , 912–919 (2020). \n 本报告使用的图表裁切来自原文 PDF；SVG 示意图为依据原文文字/数字的解释性重绘，非原文图。 \n \n\n \n 报告使用说明 \n 原文图：PDF 页面裁切，保留原始面板标记；SVG 图：AI 重绘，用于解释机制；所有数字转录自原文，未重新分析。引用本报告观点时，请回溯原文页码核对。"}]}], "stats": {"n": 4, "years": ["2025", "2026"], "journals": ["Anthropic · BigHat Biosciences", "Nature Communications", "bioRxiv"], "categories": ["AI 与机器学习", "单细胞与组学", "无细胞与合成生物学", "液滴微流控", "结构生物学与冷冻电镜", "药物发现与诊断", "蛋白质与抗体工程"], "updated": "2026-10-29", "version": "1.2.0"}}</script>

<script>
(function(){
  'use strict';

  /* ---------------------------------------------------------- diagnostics */
  var ERRORS = [];
  window.addEventListener('error', function(ev){
    try{ ERRORS.push(String((ev && (ev.message || ev.error)) || 'unknown error')); }catch(e){}
  });

  /* ------------------------------------------------------------- helpers */
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function clear(n){ while(n && n.firstChild) n.removeChild(n.firstChild); }
  function str(v){ return (v === undefined || v === null) ? '' : String(v).trim(); }
  function num(v){
    if(typeof v === 'number' && isFinite(v)) return v;
    if(typeof v === 'string' && v.trim() !== ''){ var n = parseInt(v, 10); if(isFinite(n)) return n; }
    return null;
  }
  function toArr(v){
    if(Array.isArray(v)) return v;
    if(v === undefined || v === null || v === '') return [];
    if(typeof v === 'string') return v.split(/[,;，；|]/).map(function(s){ return s.trim(); }).filter(Boolean);
    return [v];
  }
  function dedupe(list){
    var seen = Object.create(null), out = [];
    list.forEach(function(x){
      var k = '$' + x;
      if(!seen[k]){ seen[k] = 1; out.push(x); }
    });
    return out;
  }
  function clampLine(text, max){
    text = str(text);
    return text.length > max ? text.slice(0, max - 1) + '…' : text;
  }
  /* only relative paths and http(s) links may become anchors; a hostile
     javascript:/data: value in the JSON is dropped instead of rendered as a link */
  function safeHref(v){
    var value = str(v);
    if(!value) return '';
    if(/^\s*(javascript|vbscript|data):/i.test(value)) return '';
    return value;
  }
  function baseName(path){
    var s = str(path).split(/[?#]/)[0];
    var parts = s.split('/');
    return parts[parts.length - 1] || '';
  }

  /* ------------------------------------------------------------ data load */
  var RAW = null;
  try{
    var dataNode = document.getElementById('library-data');
    if(dataNode && dataNode.textContent && dataNode.textContent.trim()) RAW = JSON.parse(dataNode.textContent);
    else RAW = {};
  }catch(err){
    ERRORS.push('文献库数据解析失败：' + (err && err.message ? err.message : String(err)));
    RAW = {};
  }
  if(Array.isArray(RAW)) RAW = { papers: RAW };
  if(!RAW || typeof RAW !== 'object') RAW = {};
  var RAW_STATS = (RAW.stats && typeof RAW.stats === 'object') ? RAW.stats : {};

  function normPaper(raw, i){
    if(!raw || typeof raw !== 'object') raw = {};
    var p = {};
    p.id = str(raw.id) || ('paper-' + (i + 1));
    p.html = safeHref(raw.html);
    p.raw = safeHref(raw.raw);
    p.rawName = str(raw.raw_name) || baseName(p.raw);
    p.pdf = safeHref(raw.pdf);         /* kept for tolerance; not linked */
    p.readme = str(raw.readme);        /* kept for tolerance; never linked */
    p.title = str(raw.title) || p.id;
    p.title_zh = str(raw.title_zh);
    p.journal = str(raw.journal);
    p.year = str(raw.year);
    p.doi = str(raw.doi);
    p.authors = dedupe(toArr(raw.authors).map(str).filter(Boolean));
    p.tags = dedupe(toArr(raw.tags).map(str).filter(Boolean));
    p.categories = dedupe(toArr(raw.categories).map(str).filter(Boolean));
    p.tldr = str(raw.tldr);
    p.metrics = [];
    if(Array.isArray(raw.metrics)){
      raw.metrics.forEach(function(m){
        if(!m || typeof m !== 'object') return;
        var value = str(m.value !== undefined ? m.value : m.v);
        var label = str(m.label !== undefined ? m.label : m.l);
        var note = str(m.note !== undefined ? m.note : m.n);
        if(value || label) p.metrics.push({ value: value, label: label, note: note });
      });
    }
    p.figures = num(raw.figures);
    p.claims = num(raw.claims);
    p.sectionsN = num(raw.sections);
    p.updated = str(raw.updated);
    p.thumb = str(raw.thumb);
    p.text = [];
    if(Array.isArray(raw.text)){
      raw.text.forEach(function(t, j){
        if(!t || typeof t !== 'object') return;
        var body = str(t.t);
        if(!body) return;
        p.text.push({ id: str(t.id), h: str(t.h) || ('段落 ' + (j + 1)), t: body, _l: null });
      });
    }
    p._meta = [
      ['标题', p.title],
      ['中文标题', p.title_zh],
      ['作者', p.authors.join(', ')],
      ['标签', p.tags.join(' · ')],
      ['一句话结论', p.tldr],
      ['DOI', p.doi]
    ];
    p._hay = [p.title, p.title_zh, p.authors.join(' '), p.tags.join(' '), p.tldr, p.doi].join('\n').toLowerCase();
    return p;
  }

  var PAPERS = [];
  var YEAR_MAP = Object.create(null), YEARS = [];
  var JOURNAL_MAP = Object.create(null), JOURNALS = [];
  var CAT_MAP = Object.create(null), CATEGORIES = [];
  var TAG_MAP = Object.create(null), TAGS = [];
  var RAW_COUNT = 0, LATEST_UPDATE = '', YEAR_RANGE = '';
  var UPDATED = '', CAT_COUNT = 0, TOTAL_PAPERS = 0;

  /* --------------------------------------------------------- computed meta */
  function countMap(items){
    var m = Object.create(null);
    items.forEach(function(x){ if(x) m[x] = (m[x] || 0) + 1; });
    return m;
  }
  function mapSorted(m){
    return Object.keys(m).map(function(k){ return { name: k, n: m[k] }; })
      .sort(function(a, b){ return (b.n - a.n) || a.name.localeCompare(b.name, 'zh-Hans-CN'); });
  }
  function yearNum(p){
    var y = parseInt(p.year, 10);
    return isFinite(y) ? y : -9999;
  }

  /* All data-derived values are rebuilt here (boot + every live refresh). */
  function refreshDataset(nextRaw){
    RAW = (nextRaw && typeof nextRaw === 'object') ? nextRaw : {};
    if(Array.isArray(RAW)) RAW = { papers: RAW };
    RAW_STATS = (RAW.stats && typeof RAW.stats === 'object') ? RAW.stats : {};
    PAPERS = (Array.isArray(RAW.papers) ? RAW.papers : []).map(normPaper);

    YEAR_MAP = countMap(PAPERS.map(function(p){ return p.year; }).filter(Boolean));
    YEARS = Object.keys(YEAR_MAP).sort(function(a, b){ return (parseInt(b, 10) || 0) - (parseInt(a, 10) || 0) || b.localeCompare(a); });
    JOURNAL_MAP = countMap(PAPERS.map(function(p){ return p.journal; }).filter(Boolean));
    JOURNALS = mapSorted(JOURNAL_MAP);
    CAT_MAP = countMap(PAPERS.reduce(function(acc, p){ return acc.concat(p.categories); }, []));
    CATEGORIES = mapSorted(CAT_MAP);
    TAG_MAP = countMap(PAPERS.reduce(function(acc, p){ return acc.concat(p.tags); }, []));
    TAGS = mapSorted(TAG_MAP);
    RAW_COUNT = PAPERS.filter(function(p){ return !!p.raw; }).length;
    LATEST_UPDATE = (function(){
      var best = '';
      PAPERS.forEach(function(p){ if(p.updated && p.updated > best) best = p.updated; });
      return best;
    })();
    YEAR_RANGE = (function(){
      if(!YEARS.length) return '';
      if(YEARS.length === 1) return YEARS[0];
      var nums = YEARS.map(function(y){ return parseInt(y, 10); }).filter(isFinite);
      if(nums.length === YEARS.length){
        var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
        return (lo === hi) ? String(lo) : (lo + '–' + hi);
      }
      return YEARS[YEARS.length - 1] + '–' + YEARS[0];
    })();
    UPDATED = str(RAW_STATS.updated) || LATEST_UPDATE || BUILD_DATE;
    CAT_COUNT = CATEGORIES.length;
    TOTAL_PAPERS = PAPERS.length;
    RELATED = computeRelated();
  }

  /* ========================================================= filtering */
  function baseFiltered(){
    var cats = catKeys(), tags = tagKeys();
    return PAPERS.filter(function(p){
      if(cats.length && !p.categories.some(function(c){ return state.cats[c]; })) return false;
      if(state.year && p.year !== state.year) return false;
      if(state.journal && p.journal !== state.journal) return false;
      if(tags.length && !p.tags.some(function(t){ return state.tags[t]; })) return false;
      if(state.pdf && !p.raw) return false;
      if(state.starOnly && !reading.stars[p.id]) return false;
      if(state.unreadOnly && reading.opened[p.id]) return false;
      if(state.quick === 'unread' && reading.opened[p.id]) return false;
      if(state.quick === 'star' && !reading.stars[p.id]) return false;
      if(state.quick === 'recent' && !reading.opened[p.id]) return false;
      return true;
    });
  }

  function sortPapers(list){
    var arr = list.slice();
    function byTitle(a, b){ return (a.title || '').localeCompare(b.title || '', 'zh-Hans-CN', { sensitivity: 'base', numeric: true }); }
    function byYearDesc(a, b){ return yearNum(b) - yearNum(a); }
    function byOpenedDesc(a, b){
      var ao = reading.opened[a.id] || '', bo = reading.opened[b.id] || '';
      if(ao === bo) return 0;
      if(!ao) return 1;
      if(!bo) return -1;
      return ao < bo ? 1 : -1;
    }
    if(state.quick === 'recent'){
      arr.sort(function(a, b){ return byOpenedDesc(a, b) || byYearDesc(a, b) || byTitle(a, b); });
      return arr;
    }
    function byUpdatedDesc(a, b){
      var av = a.updated || '', bv = b.updated || '';
      if(av === bv) return 0;
      if(!av) return 1;
      if(!bv) return -1;
      return av < bv ? 1 : -1;
    }
    if(state.sort === 'updated'){
      arr.sort(function(a, b){ return byUpdatedDesc(a, b) || byYearDesc(a, b) || byTitle(a, b); });
    }else if(state.sort === 'title'){
      arr.sort(function(a, b){ return byTitle(a, b) || byYearDesc(a, b); });
    }else if(state.sort === 'recent'){
      arr.sort(function(a, b){
        var ao = reading.opened[a.id] || '', bo = reading.opened[b.id] || '';
        if(ao !== bo){
          if(!ao) return 1;
          if(!bo) return -1;
          return ao < bo ? 1 : -1;
        }
        return byYearDesc(a, b) || byTitle(a, b);
      });
    }else{
      arr.sort(function(a, b){ return byYearDesc(a, b) || byUpdatedDesc(a, b) || byTitle(a, b); });
    }
    return arr;
  }

  /* ================================================= reading state + related */
  var LS_KEY = 'deepread-library-state';
  var reading = { opened: Object.create(null), stars: Object.create(null), last: null };
  var readingDirty = false;
  var RELATED = Object.create(null);
  var relatedOpen = false;

  function loadReading(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      if(!d || typeof d !== 'object') return;
      if(d.opened && typeof d.opened === 'object'){
        Object.keys(d.opened).forEach(function(k){
          if(typeof d.opened[k] === 'string') reading.opened[k] = d.opened[k];
        });
      }
      if(d.stars && typeof d.stars === 'object'){
        Object.keys(d.stars).forEach(function(k){ if(d.stars[k]) reading.stars[k] = true; });
      }
      if(d.last && typeof d.last === 'object' && typeof d.last.id === 'string' && d.last.id){
        reading.last = { id: d.last.id, at: typeof d.last.at === 'string' ? d.last.at : '' };
      }
    }catch(e){
      reading = { opened: Object.create(null), stars: Object.create(null), last: null };
    }
  }
  function saveReading(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({ opened: reading.opened, stars: reading.stars, last: reading.last }));
    }catch(e){}
  }
  function paperById(id){
    for(var i = 0; i < PAPERS.length; i++){ if(PAPERS[i].id === id) return PAPERS[i]; }
    return null;
  }
  function isOpened(p){ return !!(p && reading.opened[p.id]); }
  function isStarred(p){ return !!(p && reading.stars[p.id]); }
  function openedCount(){ return PAPERS.filter(isOpened).length; }
  function starredCount(){ return PAPERS.filter(isStarred).length; }
  function unreadCount(){ return PAPERS.filter(function(p){ return !isOpened(p); }).length; }

  function computeRelated(){
    var map = Object.create(null);
    PAPERS.forEach(function(p){
      var candidates = [];
      PAPERS.forEach(function(q){
        if(q === p) return;
        var sharedC = p.categories.filter(function(c){ return q.categories.indexOf(c) >= 0; });
        var sharedT = p.tags.filter(function(t){ return q.tags.indexOf(t) >= 0; });
        var score = sharedC.length * 2 + sharedT.length;
        if(score > 0) candidates.push({ paper: q, score: score, sharedC: sharedC, sharedT: sharedT });
      });
      candidates.sort(function(a, b){
        return (b.score - a.score) || (yearNum(b.paper) - yearNum(a.paper)) ||
               (a.paper.title || '').localeCompare(b.paper.title || '', 'zh-Hans-CN');
      });
      map[p.id] = candidates.slice(0, 6);
    });
    return map;
  }
  function relOf(p){ return (p && RELATED[p.id]) ? RELATED[p.id] : []; }

  function markOpened(p){
    if(!p) return;
    var now = new Date().toISOString();
    reading.opened[p.id] = now;
    reading.last = { id: p.id, at: now };
    readingDirty = true;
    saveReading();
    refreshReadingUI();
  }
  function updateContinue(){
    if(!continueBtn) return;
    var p = reading.last ? paperById(reading.last.id) : null;
    if(p && p.html){
      continueBtn.hidden = false;
      continueBtn._paper = p;
      continueTitleEl.textContent = clampLine(p.title_zh || p.title, 30);
      continueBtn.setAttribute('aria-label', '继续阅读：' + p.title);
      continueBtn.setAttribute('title', '继续阅读：' + p.title);
    }else{
      continueBtn.hidden = true;
      continueBtn._paper = null;
    }
  }
  function syncMyCounts(){
    var sc = starredCount(), uc = unreadCount(), oc = openedCount();
    if(starCountEl) starCountEl.textContent = String(sc);
    if(unreadCountEl) unreadCountEl.textContent = String(uc);
    if(quickStarN) quickStarN.textContent = String(sc);
    if(quickUnreadN) quickUnreadN.textContent = String(uc);
    if(quickRecentN) quickRecentN.textContent = String(oc);
    if(tabStarN) tabStarN.textContent = String(sc);
    if(tabUnreadN) tabUnreadN.textContent = String(uc);
    if(mobileTabs){
      var contTab = mobileTabs.querySelector('.mtab[data-tab="continue"]');
      if(contTab){
        var lastP = reading.last ? paperById(reading.last.id) : null;
        var canCont = !!(lastP && lastP.html);
        contTab.disabled = !canCont;
        contTab.setAttribute('aria-disabled', canCont ? 'false' : 'true');
      }
    }
    syncRailGroupCounts();
  }
  function refreshReadingUI(){
    $$('.list-row[data-id]').forEach(function(row){
      var lp = paperById(row.getAttribute('data-id'));
      if(!lp) return;
      var lstate = row.querySelector('.list-state');
      if(lstate){
        var lchip = lstate.querySelector('.media-read');
        if(reading.opened[lp.id] && !lchip){
          var mc = el('span', 'media-read', '已读');
          lstate.insertBefore(mc, lstate.firstChild);
        }else if(!reading.opened[lp.id] && lchip) lchip.parentNode.removeChild(lchip);
        var lstar = lstate.querySelector('.list-star');
        if(lstar){
          var lon = !!reading.stars[lp.id];
          lstar.setAttribute('aria-pressed', lon ? 'true' : 'false');
          lstar.textContent = lon ? '★' : '☆';
          lstar.setAttribute('aria-label', (lon ? '取消星标：' : '星标：') + lp.title);
        }
      }
    });
    $$('.card[data-id]').forEach(function(card){
      var p = paperById(card.getAttribute('data-id'));
      if(!p) return;
      var flags = card.querySelector('.media-flags');
      if(flags){
        var chip = flags.querySelector('.media-read');
        if(reading.opened[p.id] && !chip) flags.appendChild(el('span', 'media-read', '已读'));
        else if(!reading.opened[p.id] && chip) flags.removeChild(chip);
      }
      var star = card.querySelector('.card-star');
      if(star){
        var on = !!reading.stars[p.id];
        star.setAttribute('aria-pressed', on ? 'true' : 'false');
        star.textContent = on ? '★' : '☆';
        star.setAttribute('aria-label', (on ? '取消星标：' : '星标：') + p.title);
      }
    });
    updateContinue();
    syncMyCounts();
  }
  function toggleStar(p){
    if(!p) return;

  /* ------------------------------------------------- related panel in reader */
  function renderRelatedPanel(p, rel){

  function openRelatedPanel(){

    renderRelatedPanel(viewerState.paper, relOf(viewerState.paper));

  function closeRelatedPanel(){
    relatedOpen = false;
    if(viewerRelated) viewerRelated.hidden = true;
    if(viewerRelatedBtn) viewerRelatedBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleRelatedPanel(){
    if(!viewerRelatedBtn || viewerRelatedBtn.hidden) return;

  function refreshViewerRelated(p){
    if(!viewerRelatedBtn) return;
    var rel = relOf(p);
    if(!rel.length){
      viewerRelatedBtn.hidden = true;
      closeRelatedPanel();

    }
    viewerRelatedBtn.hidden = false;
    viewerRelatedN.textContent = String(rel.length);
    viewerRelatedBtn.setAttribute('aria-expanded', relatedOpen ? 'true' : 'false');

  function switchViewerToRelated(q){
    if(!q || !q.html || !viewerState.paper) return;
    if(relatedOpen) relatedOpen = false; /* renderRelatedPanel re-opens; avoids stale click state */
    var list = viewerState.list;
    var idx = list.indexOf(q);
    if(idx < 0){
      idx = viewerState.idx + 1;
      list.splice(idx, 0, q);
      viewerState.list = list;
    }
    relatedOpen = true;
    showViewerAt(idx, null);
    try{ viewerRelatedBtn.focus(); }catch(e){}
  }

  /* ============================================================ search */
  function sectionLower(sec){
    if(sec._l === null || sec._l === undefined) sec._l = sec.t.toLowerCase();
    return sec._l;
  }
  function countOccurrences(hay, needle){
    if(!needle) return 0;
    var n = 0, from = 0, idx;
    while(true){
      idx = hay.indexOf(needle, from);
      if(idx < 0) break;
      n++;
      from = idx + needle.length;
      if(n >= 500) break;
    }
    return n;
  }
  function searchPaper(p, needle){
    var ql = needle.toLowerCase();
    var total = 0;
    var metaHits = [];
    if(p._hay.indexOf(ql) >= 0){
      p._meta.forEach(function(f){
        var val = f[1];
        if(!val) return;
        var hay = val.toLowerCase();
        var idx = hay.indexOf(ql);
        if(idx < 0) return;
        var n = countOccurrences(hay, ql);
        total += n;
        if(metaHits.length < 3) metaHits.push({ label: f[0], text: val, idx: idx });
      });
    }
    var groups = [];
    p.text.forEach(function(sec){
      var hay = sectionLower(sec);
      if(hay.indexOf(ql) < 0) return;
      var from = 0, count = 0, positions = [];
      while(true){
        var idx = hay.indexOf(ql, from);
        if(idx < 0) break;
        count++;
        if(positions.length < 8) positions.push(idx);
        from = idx + ql.length;
        if(count >= 500) break;
      }
      if(count){ total += count; groups.push({ sec: sec, count: count, positions: positions }); }
    });
    if(!total) return null;
    groups.sort(function(a, b){ return b.count - a.count; });
    var snippets = [];
    var round = 0;
    while(snippets.length < 4 && round < 8){
      var added = false;
      for(var g = 0; g < groups.length && snippets.length < 4; g++){
        if(round < groups[g].positions.length){
          snippets.push({ sec: groups[g].sec, idx: groups[g].positions[round], count: groups[g].count });
          added = true;
        }
      }
      if(!added) break;
      round++;
    }
    if(snippets.length < 2 && metaHits.length){
      metaHits.slice(0, 2 - snippets.length).forEach(function(m){
        snippets.push({ label: m.label, text: m.text, idx: m.idx, count: 0 });
      });
    }
    return { paper: p, total: total, snippets: snippets };
  }
  function runSearch(list, needle){
    var results = [];
    var totalHits = 0;
    list.forEach(function(p){
      var r = searchPaper(p, needle);
      if(r){ results.push(r); totalHits += r.total; }
    });
    results.sort(function(a, b){
      return (b.total - a.total) || (yearNum(b.paper) - yearNum(a.paper)) || (a.paper.title || '').localeCompare(b.paper.title || '', 'zh-Hans-CN');
    });
    return { results: results, totalHits: totalHits };
  }

  /* ====================================================== build helpers */
  function actionLink(label, href, cls, extra){
    var a = el('a', 'card-link-mini' + (cls ? ' ' + cls : ''));
    a.href = href;
    if(extra && extra.target){ a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    if(extra && extra.download){ a.download = extra.download; a.setAttribute('download', extra.download); }
    a.appendChild(el('span', null, label));
    if(extra && extra.ext){
      var e = el('span', 'ext', '↗');
      e.setAttribute('aria-hidden', 'true');
      a.appendChild(e);
    }
    if(extra && extra.title) a.setAttribute('aria-label', extra.title);
    return a;
  }
  function authorLine(authors){
    if(!authors.length) return '';
    if(authors.length <= 3) return authors.join(', ');
    return authors.slice(0, 3).join(', ') + ' 等 ' + authors.length + ' 人';
  }
  function monogram(p){
    var src = (p.categories[0] || p.title || '?').replace(/\s+/g, ' ').trim();
    var chars = Array.from(src).slice(0, 2).join('');
    return chars.toUpperCase() || '·';
  }
  function countsRow(p){
    var row = el('div', 'card-counts');
    [[p.figures, '图表'], [p.claims, '证据'], [p.sectionsN, '章节']].forEach(function(pair){
      if(pair[0] === null) return;
      var s = el('span');
      s.appendChild(el('b', null, String(pair[0])));
      s.appendChild(document.createTextNode(' ' + pair[1]));
      row.appendChild(s);
    });
    return row;
  }

  function cardEl(p){
    var art = el('article', 'card');
    art.setAttribute('data-id', p.id);
    if(p.html){
      art.setAttribute('data-print-url', p.html);
      var link = el('a', 'card-link');
      link.href = p.html;
      link.rel = 'noopener';
      link.setAttribute('aria-label', '阅读报告：' + p.title);
      link.addEventListener('click', function(e){
        if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return; /* new-tab fallback */
        e.preventDefault();
        openViewer(p);
      });
      art.appendChild(link);
    }else{
      art.classList.add('is-static');
    }

    /* media: monogram fallback UNDER the cover crop (Lead fix) */
    var media = el('div', 'card-media');
    var mono = el('div', 'card-mono ' + catClass(p.categories[0] || ''));
    mono.appendChild(el('span', 'mono-word', monogram(p)));
    media.appendChild(mono);
    if(p.thumb){
      var img = el('img', 'card-thumb');
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', function(){
        if(img.parentNode) img.parentNode.removeChild(img);
      });
      img.src = p.thumb;
      media.appendChild(img);
    }
    var flags = el('div', 'media-flags');
    if(p.year) flags.appendChild(el('span', 'media-year', p.year));
    if(reading.opened[p.id]) flags.appendChild(el('span', 'media-read', '已读'));
    if(flags.childNodes.length) media.appendChild(flags);
    var star = el('button', 'card-star');
    star.type = 'button';
    star.setAttribute('aria-pressed', reading.stars[p.id] ? 'true' : 'false');
    star.setAttribute('aria-label', (reading.stars[p.id] ? '取消星标：' : '星标：') + p.title);
    star.textContent = reading.stars[p.id] ? '★' : '☆';
    star.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      toggleStar(p);
    });
    media.appendChild(star);
    art.appendChild(media);

    /* body */
    var body = el('div', 'card-body');
    if(p.categories.length){
      var cr = el('div', 'card-catrow');
      cr.appendChild(el('span', 'cat-chip ' + catClass(p.categories[0]), p.categories[0]));
      body.appendChild(cr);
    }
    body.appendChild(el('h3', 'card-title', p.title));
    if(p.title_zh) body.appendChild(el('p', 'card-title-zh', p.title_zh));
    var meta = [p.journal, authorLine(p.authors)].filter(Boolean).join(' · ');
    if(meta) body.appendChild(el('p', 'card-meta', meta));
    if(p.tldr) body.appendChild(el('p', 'card-tldr', p.tldr));
    if(p.tags.length){
      var tw = el('div', 'card-tags');
      p.tags.slice(0, 2).forEach(function(t){ tw.appendChild(el('span', 'tchip', t)); });
      body.appendChild(tw);
    }
    var counts = countsRow(p);
    if(counts.childNodes.length) body.appendChild(counts);
    art.appendChild(body);

    /* foot: primary 阅读 + RAW pdf links */
    var foot = el('div', 'card-foot');
    if(p.html){
      var read = el('button', 'btn-read');
      read.type = 'button';
      read.setAttribute('aria-label', '阅读报告：' + p.title);
      read.appendChild(el('span', null, '阅读'));
      read.appendChild(el('span', 'arrow', '→'));
      read.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        openViewer(p);
      });
      foot.appendChild(read);
    }
    var links = el('div', 'card-links');
    if(p.raw){
      links.appendChild(actionLink('查看原文', p.raw, null, { target: true, ext: true, title: '在新标签查看原文 PDF：' + p.title }));
    }
    if(links.childNodes.length) foot.appendChild(links);
    if(foot.childNodes.length) art.appendChild(foot);
    return art;
  }

  function cardsGrid(list){
    var grid = el('div', 'cards');
    list.forEach(function(p){ grid.appendChild(cardEl(p)); });
    return grid;
  }

  /* ------------------------------------------------------------- snippets */
  function appendHighlighted(parent, text, query){
    var needle = (query || '').toLowerCase();
    if(!needle){ parent.appendChild(document.createTextNode(text)); return; }
    var hay = text.toLowerCase();
    var from = 0, idx;
    while(true){
      idx = hay.indexOf(needle, from);
      if(idx < 0){
        if(from < text.length) parent.appendChild(document.createTextNode(text.slice(from)));
        break;
      }
      if(idx > from) parent.appendChild(document.createTextNode(text.slice(from, idx)));
      parent.appendChild(el('mark', null, text.slice(idx, idx + needle.length)));
      from = idx + needle.length;
      if(from >= text.length) break;
    }
  }

  function snippetUrl(p, sec){
    var base = str(p.html).split('#')[0];
    if(!base) return '';
    return sec && sec.id ? (base + '#' + sec.id) : base;
  }

  function makeSnippet(p, snip, query){
    var canOpen = !!(p.html && snip.sec);
    var box = el(canOpen ? 'a' : 'div', 'snip');
    if(canOpen){
      box.href = snippetUrl(p, snip.sec);
      box.rel = 'noopener';
      box.addEventListener('click', function(e){
        if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        openViewer(p, snip.sec.id);
      });
    }
    var head = el('span', 'snip-head');
    head.appendChild(el('span', 'snip-sec', snip.sec ? (snip.sec.h || '全文章节') : ((snip.label || '摘要') + '命中')));
    if(canOpen) head.appendChild(el('span', 'snip-go', '阅读 ↗'));
    box.appendChild(head);

    var text = el('span', 'snip-text');
    var raw = str(snip.text !== undefined ? snip.text : (snip.sec ? snip.sec.t : ''));
    var qlen = query.length;
    var from = Math.max(0, (snip.idx || 0) - 50);
    var to = Math.min(raw.length, (snip.idx || 0) + qlen + 84);
    var seg = raw.slice(from, to).replace(/\s+/g, ' ');
    if(from > 0) seg = '…' + seg;
    if(to < raw.length && seg.charAt(seg.length - 1) !== '…') seg = seg + '…';
    appendHighlighted(text, seg, query);
    box.appendChild(text);
    return box;
  }

  /* ============================================================== viewer */
  var viewerState = { list: [], idx: -1, paper: null, lastFocus: null, loadToken: 0, fallbackTimer: null };

  function setLoading(on){
    viewerLoading.hidden = !on;
    if(on){
      viewerLoading.classList.remove('is-error');
      viewerHint.textContent = '离线单文件报告。若长时间不显示，请使用右上角的「在新标签打开」。';
    }
  }

  function showViewerAt(idx, sectionId){
    if(idx < 0 || idx >= viewerState.list.length) return;
    viewerState.idx = idx;
    var p = viewerState.list[idx];
    viewerState.paper = p;
    markOpened(p);
    viewerTitle.textContent = p.title;
    if(viewerCrumb){
      clear(viewerCrumb);
      viewerCrumb.appendChild(el('span', null, '文献库'));
      viewerCrumb.appendChild(el('span', 'sep', '/'));
      viewerCrumb.appendChild(el('span', null, p.categories[0] || '未分类'));
      viewerCrumb.appendChild(el('span', 'sep', '/'));
      viewerCrumb.appendChild(el('span', null, clampLine(p.title_zh || p.title, 22)));
    }
    var subParts = [];
    if(p.title_zh) subParts.push(p.title_zh);
    var meta = [p.journal, p.year].filter(Boolean).join(' · ');
    if(meta) subParts.push(meta);
    viewerSub.textContent = subParts.join('  ·  ') || '';
    viewerPos.textContent = (idx + 1) + ' / ' + viewerState.list.length;
    var canLoop = viewerState.list.length > 1;
    viewerPrev.disabled = !canLoop;
    viewerNext.disabled = !canLoop;
    viewerPrev.setAttribute('aria-label', canLoop ? '上一篇报告（循环）' : '上一篇报告');
    viewerNext.setAttribute('aria-label', canLoop ? '下一篇报告（循环）' : '下一篇报告');
    viewerPrev.setAttribute('title', canLoop ? '上一篇（循环）' : '上一篇');
    viewerNext.setAttribute('title', canLoop ? '下一篇（循环）' : '下一篇');

    var url = snippetUrl(p, sectionId ? { id: sectionId } : null);
    viewerOpenTab.href = url;
    if(p.raw){
      viewerRawView.hidden = false;
      viewerRawView.href = p.raw;
      viewerRawView.setAttribute('title', '在新标签查看原文 PDF：' + p.title);
    }else{
      viewerRawView.hidden = true;
      viewerRawView.removeAttribute('href');
    }
    refreshViewerRelated(p);

    var token = ++viewerState.loadToken;
    setLoading(true);
    if(viewerState.fallbackTimer) clearTimeout(viewerState.fallbackTimer);
    viewerFrame.onload = function(){
      if(token !== viewerState.loadToken) return;
      setLoading(false);
    };
    viewerFrame.title = '论文精读报告：' + p.title;
    viewerFrame.src = url;
    viewerState.fallbackTimer = setTimeout(function(){
      if(token !== viewerState.loadToken) return;
      if(viewerLoading.hidden) return;
      viewerLoading.classList.add('is-error');
      viewerHint.textContent = '报告载入较慢，或浏览器不允许在页面内嵌 file:// 文档。请使用右上角「在新标签打开」查看完整报告。';
    }, 9000);
  }

  function openViewer(paper, sectionId){
    if(!paper || !paper.html) return;
    var order = lastRendered.length ? lastRendered.slice() : sortPapers(baseFiltered());
    var list = order.filter(function(p){ return !!p.html; });
    var idx = list.indexOf(paper);
    if(idx < 0){ list = [paper].concat(list.filter(function(p){ return p !== paper; })); idx = 0; }
    viewerState.list = list;
    viewerState.lastFocus = document.activeElement;
    hidePeek();
    relatedOpen = false;
    if(viewerRelated) viewerRelated.hidden = true;
    viewer.hidden = false;
    document.documentElement.classList.add('viewer-open');
    showViewerAt(idx, sectionId || null);
    try{ viewerClose.focus(); }catch(e){}
  }

  function closeViewer(){
    if(viewer.hidden) return;
    if(document.fullscreenElement === viewer && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} }
    viewer.hidden = true;
    viewerState.loadToken++;
    viewerState.paper = null;
    if(viewerState.fallbackTimer){ clearTimeout(viewerState.fallbackTimer); viewerState.fallbackTimer = null; }
    viewerFrame.onload = null;
    viewerFrame.src = 'about:blank';
    document.documentElement.classList.remove('viewer-open');
    closeRelatedPanel();
    var back = viewerState.lastFocus;
    viewerState.lastFocus = null;
    if(readingDirty){
      readingDirty = false;
      if(state.sort === 'recent' || state.unreadOnly || state.quick === 'unread' || state.quick === 'recent'){
        apply({ skipHash: true });
      }
    }
    if(back && document.contains(back)){ try{ back.focus(); }catch(e){} }
  }

  function viewerStep(dir){
    var n = viewerState.list.length;
    if(n <= 1) return;
    var next = (viewerState.idx + dir + n) % n;
    showViewerAt(next, null);
  }

  function viewerFocusables(){
    return $$('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])', viewerShell)
      .filter(function(n){ return n.offsetParent !== null || n.tagName === 'IFRAME'; });
  }

  function initViewer(){
    viewerClose.addEventListener('click', closeViewer);
    viewerPrev.addEventListener('click', function(){ viewerStep(-1); });
    viewerNext.addEventListener('click', function(){ viewerStep(1); });
    viewerRelatedBtn.addEventListener('click', toggleRelatedPanel);
    viewerRelatedClose.addEventListener('click', closeRelatedPanel);
    initFullscreen();
    viewer.addEventListener('click', function(e){ if(e.target === viewer) closeViewer(); });
    document.addEventListener('keydown', function(e){
      if(viewer.hidden) return;
      if(e.key === 'Escape'){
        if(document.fullscreenElement){ e.preventDefault(); return; }
        e.preventDefault();
        if(relatedOpen){ closeRelatedPanel(); return; }
        closeViewer();
        return;
      }
      if(e.key === 'Tab'){
        var f = viewerFocusables();
        if(!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if(e.shiftKey && (document.activeElement === first || document.activeElement === viewerShell)){
          e.preventDefault(); last.focus();
        }else if(!e.shiftKey && document.activeElement === last){
          e.preventDefault(); first.focus();
        }
      }
    });
  }

  /* ================================================================ rail drawer */
  function openRail(){
    document.body.classList.add('drawer-open');
    document.documentElement.classList.add('drawer-lock');
    railScrim.hidden = false;
    filterToggle.setAttribute('aria-expanded', 'true');
    try{ railClose.focus(); }catch(e){}
  }
  function closeRail(){
    if(!document.body.classList.contains('drawer-open')) return;
    document.body.classList.remove('drawer-open');
    document.documentElement.classList.remove('drawer-lock');
    railScrim.hidden = true;
    filterToggle.setAttribute('aria-expanded', 'false');
    try{ filterToggle.focus(); }catch(e){}
  }

  /* ============================================================ empty states */
  function renderEmpty(kind, extra){
    var box = el('div', 'empty');
    var ico = el('div', 'empty-ico');
    ico.innerHTML = kind === 'search'
      ? '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="13" y="9" width="30" height="40" rx="4"/><path d="M20 18h16M20 26h16M20 34h10"/><circle cx="43" cy="43" r="9"/><path d="M49.5 49.5 56 56"/></svg>'
      : '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="12" y="10" width="27" height="37" rx="4"/><path d="M19 19h13M19 26h13M19 33h8"/><path d="M25 51h27a4 4 0 0 0 4-4V20" /><path d="M18 15 46 24"/></svg>';
    box.appendChild(ico);
    var h2 = el('h2');
    var p = el('p');
    var actions = el('div', 'empty-actions');
    if(kind === 'search'){
      var q = (extra && extra.q) || '';
      h2.textContent = '没有匹配「' + clampLine(q, 40) + '」的报告';
      p.textContent = '全文索引里没有找到这个关键词。试试更短的词、去掉空格，或者清空搜索回到全部报告。';
      var b1 = el('button', 'btn-primary', '清空搜索');
      b1.type = 'button';
      b1.addEventListener('click', function(){ setQuery(''); qInput.focus(); });
      actions.appendChild(b1);
    }else if(kind === 'filter'){
      h2.textContent = '当前筛选条件下没有报告';
      p.textContent = '分类、年份、期刊、标签与「仅看有原文 PDF」是多条件叠加的（同类内为“或”）。放宽一两个条件就能看到报告。';
      var b2 = el('button', 'btn-primary', '清空筛选');
      b2.type = 'button';
      b2.addEventListener('click', resetAll);
      actions.appendChild(b2);
    }else{
      h2.textContent = '还没有报告';
      p.textContent = '这份文献库是空的。用 paper-deepread-html skill 把一篇论文 PDF 深读成报告，产物放进 paper-read/，再运行库构建脚本即可。';
      var hint = el('code', 'hint', 'paper-read/<年份>-<期刊>-<标题>/');
      box.appendChild(h2);
      box.appendChild(p);
      box.appendChild(hint);
      return box;
    }
    box.appendChild(h2);
    box.appendChild(p);
    box.appendChild(actions);
    return box;

  /* ============================================================== apply */
  function apply(opts){
    opts = opts || {};
    hidePeek();
    var query = state.q.trim();
    var filtered = baseFiltered();
    lastRendered = [];

    if(query){
      var payload = runSearch(filtered, query);
      lastRendered = payload.results.map(function(r){ return r.paper; });
      updateResultCount(payload.results.length, query, payload.totalHits);
      renderHits(payload, query);
    }else if(state.view === 'table'){
      var sortedT = sortPapers(filtered);
      lastRendered = sortedT;
      updateResultCount(sortedT.length, '');
      renderTable(sortedT);
    }else if(state.view === 'list'){
      var sortedL = sortPapers(filtered);
      lastRendered = sortedL;
      updateResultCount(sortedL.length, '');
      renderList(sortedL);
    }else{
      var sortedC = sortPapers(filtered);
      lastRendered = sortedC;
      updateResultCount(sortedC.length, '');
      renderCards(sortedC);
    }

    syncRail();
    renderActiveBar();
    if(!opts.skipHash) syncHash();
  }

  function setQuery(value){
    state.q = value === undefined || value === null ? '' : String(value);
    apply();
  }

  function resetAll(){
    state.q = '';
    state.cats = Object.create(null);
    state.tags = Object.create(null);
    state.year = '';
    state.journal = '';
    state.pdf = false;
    state.starOnly = false;
    state.unreadOnly = false;
    state.quick = 'all';
    state.tagsOpen = false;
    renderTagChips();
    apply();
  }

  /* ================================================================ hash */
  var hashTimer = null;
  function buildHash(){
    var p = new URLSearchParams();
    if(state.q.trim()) p.set('q', state.q.trim());
    catKeys().forEach(function(c){ p.append('cat', c); });
    tagKeys().forEach(function(t){ p.append('tag', t); });
    if(state.year) p.set('year', state.year);
    if(state.journal) p.set('journal', state.journal);
    if(state.pdf) p.set('pdf', '1');
    if(state.starOnly) p.set('star', '1');
    if(state.unreadOnly) p.set('unread', '1');
    if(state.quick !== 'all') p.set('quick', state.quick);
    if(state.view !== 'cards') p.set('view', state.view);
    if(state.sort !== 'year') p.set('sort', state.sort);
    var qs = p.toString();
    return qs ? '#' + qs : '';
  }
  function syncHash(){
    if(hashTimer) clearTimeout(hashTimer);
    hashTimer = setTimeout(function(){
      hashTimer = null;
      var h = buildHash();
      if(location.hash === h) return;
      try{
        history.replaceState(null, '', location.pathname + location.search + h);
      }catch(e){
        try{ location.hash = h; }catch(e2){}
      }
    }, 60);
  }
  function parseHashState(){
    var st = emptyState();
    var raw = (location.hash || '').replace(/^#/, '');
    if(!raw) return st;
    var p;
    try{ p = new URLSearchParams(raw); }catch(e){ return st; }
    var q = p.get('q');
    if(q !== null) st.q = q;
    p.getAll('cat').forEach(function(c){ if(CAT_MAP[c]) st.cats[c] = true; });
    p.getAll('tag').forEach(function(t){ if(TAG_MAP[t]) st.tags[t] = true; });
    var y = p.get('year');
    if(y && YEAR_MAP[y]) st.year = y;
    var j = p.get('journal');
    if(j && JOURNAL_MAP[j]) st.journal = j;
    st.pdf = p.get('pdf') === '1';
    st.starOnly = p.get('star') === '1';
    st.unreadOnly = p.get('unread') === '1';
    var qk = p.get('quick');
    if(qk === 'unread' || qk === 'star' || qk === 'recent') st.quick = qk;
    var v = p.get('view');
    if(v === 'table') st.view = 'table';
    else if(v === 'list') st.view = 'list';
    var s = p.get('sort');
    if(s === 'year' || s === 'updated' || s === 'title' || s === 'recent') st.sort = s;
    return st;
  }
  function adoptState(st){
    state.q = st.q;
    state.cats = st.cats;
    state.year = st.year;
    state.journal = st.journal;
    state.tags = st.tags;
    state.pdf = st.pdf;
    state.starOnly = st.starOnly;
    state.unreadOnly = st.unreadOnly;
    state.quick = st.quick;
    state.view = st.view;
    state.sort = st.sort;
  }
  window.addEventListener('hashchange', function(){
    var st = parseHashState();
    if(stateSig(st) === stateSig(state)) return;
    adoptState(st);
    apply({ skipHash: true });
  });

  /* =============================================================== theme */

      root.setAttribute('data-theme', next);
